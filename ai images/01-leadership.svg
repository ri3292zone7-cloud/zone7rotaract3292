<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Leadership — team leading and training">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F4ECF6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg1)"/>
  <circle cx="1400" cy="140" r="260" fill="#E11A6E" opacity="0.07"/>
  <circle cx="120" cy="760" r="300" fill="#F2A900" opacity="0.08"/>
  <circle cx="800" cy="450" r="330" fill="none" stroke="#1B1836" stroke-opacity="0.06" stroke-width="3"/>

  <g fill="none" stroke="#1B1836" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- leader central figure with raised arm -->
    <circle cx="620" cy="430" r="58"/>
    <path d="M560 560c8-56 30-88 60-88s52 32 60 88"/>
    <path d="M680 480l60 52 78-66 90 14"/>
    <!-- pointing hand -->
    <path d="M740 500l64 64"/>
    <circle cx="820" cy="580" r="40" fill="#F2A900" stroke="none"/>
    <path d="M805 586l22-12 34 30-30 22z" fill="#F2A900" stroke="none"/>
    <!-- followers -->
    <circle cx="980" cy="520" r="44" stroke-width="10"/>
    <path d="M932 660c0-46 22-74 48-74s48 28 48 74"/>
    <circle cx="1110" cy="545" r="44" stroke="#A80F52" stroke-width="10"/>
    <path d="M1062 660c0-46 22-74 48-74s48 28 48 74" stroke="#A80F52"/>
    <!-- speech bubbles -->
    <path d="M1160 400c14-6 30-6 44 0" stroke="#E11A6E" stroke-width="8"/>
    <path d="M1180 350c26-12 56-12 84 0l10 22-18 10-8-14-72 10z" stroke="#E11A6E" stroke-width="8" fill="#FFFDF6"/>
    <!-- ground -->
    <path d="M470 680h760" stroke-opacity="0.5"/>
  </g>
</svg>