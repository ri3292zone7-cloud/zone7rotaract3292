<script src="zone7-data.js"></script>
<style>
  :root{--ink:#1B1836;--magenta:#E11A6E;--magenta-deep:#A80F52;--gold:#F2A900;--cream:#FFF8EF;--paper:#FFFDF9;--line:rgba(27,24,54,0.1);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  html{overflow-x:hidden;overflow-x:clip;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
  h1,h2,h3,h4{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-0.02em;}
  a{color:inherit;text-decoration:none;} img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px; overflow-x:hidden;overflow-x:clip;} @media (max-width: 600px){ .wrap{padding:0 20px;} }
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}
  .reveal.show{opacity:1;transform:none;}

  /* NAV - same universal nav used across the whole site */

  /* HERO */
  .chero{position:relative;padding:90px 0 80px;overflow:hidden;background:var(--ink);color:#fff;}
  .chero-blob1{position:absolute;top:-160px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(225,26,110,.35),transparent 68%);filter:blur(10px);transition:background 1.2s ease;}
  .chero-blob2{position:absolute;bottom:-200px;left:-140px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,0,.22),transparent 65%);transition:background 1.2s ease;}
  .chero-pattern{position:absolute;inset:0;opacity:.7;pointer-events:none;}
  .chero-7{position:absolute;right:-10px;bottom:-70px;font-family:'Poppins';font-weight:900;font-size:16rem;color:rgba(255,255,255,.05);line-height:1;}
  .chero-identity{
    display:inline-flex; align-items:center; gap:8px; margin-top:16px; font-size:.8rem; font-weight:700;
    color:#fff; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); padding:7px 16px 7px 12px;
    border-radius:100px; position:relative; z-index:1;
  }
  .chero-identity .ic{font-size:.95rem;}
  .chero .wrap{position:relative;z-index:1;}
  .chero-top{display:flex;align-items:center;gap:18px;margin-bottom:26px;}
  .chero-mark{width:64px;height:64px;border-radius:16px;background:#fff;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;flex-shrink:0;}
  .chero-mark img{width:100%;height:100%;object-fit:contain;}
  .chero-eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
  .chero h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.05;max-width:820px;}
  .chero .loc{margin-top:14px;color:rgba(255,255,255,.6);font-size:.95rem;font-weight:500;max-width:640px;}
  .chero-vision{
    margin-top:26px;font-family:'Poppins';font-weight:700;font-size:1.15rem;line-height:1.5;max-width:700px;
    padding:18px 24px;border-left:3px solid var(--magenta);background:rgba(255,255,255,.05);border-radius:0 14px 14px 0;
  }
  .chero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px;}
  .btn{padding:14px 26px;border-radius:100px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;transition:transform .2s,box-shadow .2s;}
  .btn-primary{background:var(--magenta);color:#fff;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(225,26,110,.3);}
  .btn-ghost-dark{border:1.6px solid rgba(255,255,255,.35);color:#fff;}
  .btn-ghost-dark:hover{background:#fff;color:var(--ink);}

  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;padding-top:34px;border-top:1px solid rgba(255,255,255,.14);position:relative;z-index:1;}
  .stat-strip .s b{display:block;font-family:'Poppins';font-weight:800;font-size:2.2rem;color:var(--gold);}
  .stat-strip .s span{font-size:.76rem;color:rgba(255,255,255,.55);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  @media(max-width:700px){.stat-strip{grid-template-columns:1fr 1fr;row-gap:24px;}}

  /* SECTION HEAD */
  .csec{padding:80px 0;}
  .csec-tag{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta-deep);margin-bottom:14px;display:inline-block;}
  .csec h2{font-size:clamp(1.6rem,3vw,2.2rem);max-width:600px;margin-bottom:8px;}

  /* ABOUT */
  .about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:50px;align-items:start;margin-top:36px;}
  .about-grid p{color:rgba(27,24,54,.72);line-height:1.9;font-size:1.04rem;}
  .quickfacts{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;}
  .qf{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);transition:background .15s;}
  .qf:last-child{border-bottom:none;}
  .qf:hover{background:var(--cream);}
  .qf .k{font-size:.74rem;font-weight:600;color:rgba(27,24,54,.5);flex-shrink:0;}
  .qf .v{font-size:.86rem;font-weight:700;color:var(--ink);text-align:right;min-width:0;overflow-wrap:anywhere;}
  @media(max-width:900px){.about-grid{grid-template-columns:1fr;}}
  @media(max-width:900px){#about{padding-left:20px;padding-right:20px;}}
  @media(max-width:480px){
    .qf{flex-direction:column;align-items:flex-start;gap:4px;}
    .qf .v{text-align:left;}
  }

  /* GOALS */
  .goals-sec{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .goals-head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}
  .goals-summary{
    display:flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--line); border-radius:100px;
    padding:8px 22px 8px 8px; flex-shrink:0;
  }
  .goals-summary .gs-ring{
    width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'Poppins'; font-weight:800; font-size:.78rem; color:#fff; background:conic-gradient(#1c8a4d calc(var(--pct)*1%), var(--line) 0);
    position:relative;
  }
  .goals-summary .gs-ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff;}
  .goals-summary .gs-ring span{position:relative;z-index:1;color:var(--ink);}
  .goals-summary .gs-text{font-size:.82rem;color:rgba(27,24,54,.6);font-weight:600;line-height:1.4;}
  .goals-summary .gs-text b{color:var(--ink);font-family:'Poppins';font-weight:700;}

  .goals-list{
    background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; margin-top:30px;
  }
  .goal-row{
    display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--line);
    transition:background .15s;
  }
  .goal-row:last-child{border-bottom:none;}
  .goal-row:hover{background:var(--cream);}
  .goal-row .g-ic{
    width:30px; height:30px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:.76rem; font-weight:800; background:rgba(225,26,110,.08); color:var(--magenta-deep);
  }
  .goal-row.completed .g-ic{background:rgba(28,138,77,.1); color:#1c8a4d;}
  .goal-row.canceled .g-ic{background:rgba(27,24,54,.06); color:rgba(27,24,54,.32);}
  .goal-row .g-text{flex:1; min-width:0; font-size:.92rem; font-weight:600; color:var(--ink); line-height:1.45;}
  .goal-row.canceled .g-text{color:rgba(27,24,54,.42); text-decoration:line-through; text-decoration-color:rgba(27,24,54,.22);}
  .goal-row .g-progress{flex-shrink:0; width:96px; display:flex; align-items:center; gap:8px;}
  .goal-row .g-bar-track{flex:1; height:5px; border-radius:100px; background:var(--cream); overflow:hidden;}
  .goal-row .g-bar-fill{height:100%; border-radius:100px; background:var(--gold); width:0; transition:width 1s cubic-bezier(.4,0,.2,1);}
  .goal-row .g-pct{font-size:.68rem; font-weight:800; color:rgba(27,24,54,.45); flex-shrink:0; width:30px; text-align:right;}
  .goal-row .g-status{
    flex-shrink:0; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:rgba(27,24,54,.35);
    min-width:74px; text-align:right;
  }
  .goal-row.completed .g-status{color:#1c8a4d;}
  @media(max-width:640px){
    .goal-row{flex-wrap:wrap; padding:15px 18px;}
    .goal-row .g-progress{order:3; width:100%; margin-left:46px;}
    .goal-row .g-status{order:2;}
    .goals-summary{width:100%;}
    .goals-head-row{align-items:flex-start;}
  }

  /* LEADERSHIP / BOARD */
  .board-sec{padding:80px 0;}
  .board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .board-track{display:flex;gap:18px;overflow-x:auto;padding:36px 4px 14px;scroll-snap-type:x mandatory;}
  .board-track::-webkit-scrollbar{height:6px;}
  .board-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .board-card{
    flex:0 0 220px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
    transition:transform .25s,box-shadow .25s;cursor:default;
  }
  .board-card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(27,24,54,.12);}
  .board-card.featured{flex:0 0 260px;border:2.5px solid var(--magenta);box-shadow:0 20px 44px rgba(225,26,110,.2);}
  .board-photo{aspect-ratio:4/5;background:linear-gradient(150deg,rgba(225,26,110,.15),rgba(242,169,0,.12));position:relative;overflow:hidden;}
  .board-photo img{width:100%;height:100%;object-fit:cover;}
  .board-initials{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:800;font-size:1.6rem;color:var(--magenta-deep);}
  .board-crown{position:absolute;top:12px;left:12px;background:var(--magenta);color:#fff;font-size:.68rem;font-weight:800;padding:5px 12px;border-radius:100px;display:flex;align-items:center;gap:5px;}
  .board-info{padding:14px 16px 18px;}
  .board-info h5{font-size:.92rem;font-weight:700;font-family:'Poppins';margin-bottom:3px;}
  .board-info span{font-size:.76rem;font-weight:700;color:var(--magenta-deep);}
  .board-empty{background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:44px;text-align:center;color:rgba(27,24,54,.5);font-size:.92rem;margin-top:28px;}
  .board-empty b{color:var(--magenta-deep);}
  .no-goals{color:rgba(27,24,54,.5);font-size:.92rem;margin-top:20px;}

  /* PROJECTS MASONRY */
  .pmasonry{column-count:3;column-gap:16px;margin-top:36px;}
  .pcard{break-inside:avoid;margin-bottom:16px;border-radius:18px;overflow:hidden;position:relative;cursor:pointer;background:var(--ink);}
  .pcard img{width:100%;display:block;transition:transform .35s;opacity:.92;}
  .pcard:hover img{transform:scale(1.06);}
  .pcard-cap{position:absolute;left:0;right:0;bottom:0;padding:20px 18px 14px;background:linear-gradient(0deg,rgba(10,8,20,.92),transparent);}
  .pcard-cap b{color:#fff;font-family:'Poppins';font-size:.95rem;display:block;line-height:1.3;}
  .pcard-cap span{color:rgba(255,255,255,.65);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  @media(max-width:900px){.pmasonry{column-count:2;}}
  @media(max-width:560px){.pmasonry{column-count:1;}}
  .no-projects-note{background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:40px;text-align:center;color:rgba(27,24,54,.55);font-size:.92rem;margin-top:24px;}

  /* TWIN / SPONSOR STRIP */
  .link-strip{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;}
  .link-chip{background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:9px 18px;font-size:.82rem;font-weight:700;color:var(--magenta-deep);}

  /* CTA */
  .join-cta{padding:90px 0;}
  .join-card{background:linear-gradient(120deg,var(--magenta),var(--magenta-deep));border-radius:28px;padding:64px 50px;color:#fff;text-align:center;position:relative;overflow:hidden;}
  .join-card::after{content:"7";position:absolute;left:-30px;top:-50px;font-family:'Poppins';font-weight:900;font-size:14rem;color:rgba(255,255,255,.08);}
  .join-card h2{position:relative;z-index:1;color:#fff;max-width:none;margin-bottom:14px;}
  .join-card p{position:relative;z-index:1;color:rgba(255,255,255,.85);max-width:520px;margin:0 auto 30px;}
  .join-card .btn-primary{position:relative;z-index:1;background:#fff;color:var(--magenta-deep);}
  .join-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;}

  footer{background:var(--ink);color:rgba(255,255,255,.5);padding:34px 0;text-align:center;font-size:.85rem;}
  .empty-state{padding:120px 28px;text-align:center;}
  @media (max-width: 600px){
    .do-grid{grid-template-columns:1fr;}
    .journey-track{grid-template-columns:1fr;}
    .clubs-grid{grid-template-columns:1fr;}
    .hero-stats{grid-template-columns:1fr;}
    .stat-strip{grid-template-columns:repeat(2,1fr);}
    .related-grid{grid-template-columns:1fr;}
    .promise-strip{grid-template-columns:1fr;}
    .score-cells{grid-template-columns:repeat(2,1fr);}
    .org-cols-3{grid-template-columns:1fr;}
  }

  /* NIGHT MODE - one pass fixes all 9 club profile pages, which render from
     this file. Mirrors the club-tools.html night pass + handbook :root.dark
     pattern. Note: --magenta/--magenta-deep/--gold are re-skinned per club
     via inline vars at render time (inline wins), so dark-mode accent TEXT
     below reads --magenta (each club's lighter c1) instead of the dark c2. */
  .loading-note{color:rgba(27,24,54,.5);}
  html.dark{color-scheme:dark;--ink:#E6E3F5;--cream:#0E0C1A;--paper:#151327;--line:rgba(233,231,247,.14);}
  html.dark .chero{background:#14122B;}
  html.dark .about-grid p{color:rgba(230,227,245,.78);}
  html.dark .quickfacts,html.dark .goals-summary,html.dark .goals-list,html.dark .board-card{background:#1A1730;border-color:var(--line);}
  html.dark .qf:hover,html.dark .goal-row:hover{background:rgba(233,231,247,.05);}
  html.dark .qf .k{color:rgba(230,227,245,.55);}
  html.dark .gs-ring::after{background:#1A1730;}
  html.dark .gs-text{color:rgba(230,227,245,.65);}
  html.dark .g-bar-track{background:rgba(233,231,247,.14);}
  html.dark .goal-row.canceled .g-text{color:rgba(230,227,245,.45);text-decoration-color:rgba(230,227,245,.25);}
  html.dark .goal-row .g-pct,html.dark .goal-row .g-status{color:rgba(230,227,245,.5);}
  html.dark .goal-row.canceled .g-ic{background:rgba(233,231,247,.08);color:rgba(230,227,245,.4);}
  html.dark .goal-row.completed .g-ic,html.dark .goal-row.completed .g-status{color:#4ade80;}
  html.dark .csec-tag,html.dark .goal-row .g-ic,html.dark .board-info span,html.dark .board-initials,html.dark .link-chip,html.dark .board-empty b{color:var(--magenta);filter:brightness(1.3);}
  html.dark .board-empty,html.dark .no-goals,html.dark .no-projects-note,html.dark .loading-note{color:rgba(230,227,245,.6);}
  html.dark .pcard{background:#14122B;}
  html.dark footer{background:#0B0A16;color:rgba(230,227,245,.55);}
  html.dark .btn-ghost-dark:hover{background:#fff;color:#14122B;}

/* ============================================================
     VAPORWAVE / OUTRUN SKIN — BALKUMARI CLUB PAGE ONLY
     Everything below is scoped to body.vw, which the render script
     adds only when clubSlug === "balkumari". The other eight clubs
     never match this scope, so their rendering is unaffected.
     Tokens mirror the Vaporwave design system: void #090014,
     magenta #FF00FF, cyan #00FFFF, sunset #FF9900, Orbitron for
     headings, Share Tech Mono for body/UI.
     NOTE: clip-path is used (not transform skew) for the slanted
     edges so text never distorts. Because clip-path also clips
     box-shadow, glow is done with drop-shadow filters instead.
     ============================================================ */
  body.vw{
    --vw-void:#090014;
    --vw-panel:rgba(26,16,60,.8);
    --vw-panel-solid:#1a103c;
    --vw-track:#0d0022;
    --vw-text:#E0E0E0;
    --vw-dim:rgba(224,224,224,.66);
    --vw-faint:rgba(224,224,224,.42);
    --vw-mag:#FF00FF;
    --vw-cyan:#00FFFF;
    --vw-sun:#FF9900;
    --vw-border:#2D1B4E;
    --vw-grad:linear-gradient(to right,#FF9900,#FF00FF 45%,#00FFFF);
    /* Re-tint the shared universal nav (rendered by site-nav.js) via
       its own custom properties — page-scoped, no other page sees this. */
    --nav-bg:rgba(9,0,20,.92);
    --nav-surface:#1a103c;
    --nav-border:#2D1B4E;
    --nav-border-soft:rgba(45,27,78,.7);
    --nav-ink:#E0E0E0;
    --nav-ink-soft:rgba(224,224,224,.66);
    --nav-ink-dim:rgba(224,224,224,.45);
    --nav-brand:#00FFFF;
    --nav-brand-strong:#FF00FF;
    --nav-tint:rgba(0,255,255,.08);
    --nav-tint2:rgba(255,0,255,.12);
    --nav-shadow:0 0 24px rgba(255,0,255,.18);
    background:var(--vw-void);
    color:var(--vw-text);
    color-scheme:dark;
    font-family:'Share Tech Mono',ui-monospace,SFMono-Regular,monospace;
  }
  body.vw ::selection{background:var(--vw-mag);color:#090014;}
  body.vw h1,body.vw h2,body.vw h3,body.vw h4,body.vw h5{font-family:'Orbitron',sans-serif;}
  body.vw a:focus-visible,body.vw button:focus-visible{outline:2px solid var(--vw-cyan);outline-offset:3px;}
  body.vw .btn:focus-visible{clip-path:none;} /* clipped outlines are invisible — square off on focus */
  body.vw ::-webkit-scrollbar{width:10px;height:8px;}
  body.vw ::-webkit-scrollbar-track{background:#0d0022;}
  body.vw ::-webkit-scrollbar-thumb{background:linear-gradient(#FF00FF,#00FFFF);border-radius:0;}

  /* Global CRT scanlines + faint RGB chromatic wash (visual only). */
  body.vw::before{
    content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:linear-gradient(rgba(18,16,20,0) 50%,rgba(0,0,0,.25) 50%);
    background-size:100% 4px;
  }
  body.vw::after{
    content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,0,0,.06),rgba(0,255,0,.02),rgba(0,0,255,.06));
  }

  /* Shared nav accents */
  body.vw #siteNav .brand{font-family:'Orbitron',sans-serif;letter-spacing:.05em;}
  body.vw #siteNav .brand .z{background:var(--vw-mag);border-radius:0;box-shadow:0 0 12px rgba(255,0,255,.7);}
  body.vw #siteNav .navlinks>a{font-family:'Share Tech Mono',monospace;text-transform:uppercase;font-size:.78rem;letter-spacing:.1em;}
  body.vw #siteNav .navlinks>a.current{color:var(--vw-cyan);}
  body.vw #siteNav .nav-cta{

  /* ============================================================
     BOTANICAL / ORGANIC SERIF SKIN — KATHMANDU WEST CLUB PAGE ONLY
     Everything below is scoped to body.bot, which the render script
     adds only when clubSlug === "kathmanduwest". The other eight
     clubs never match this scope, so their rendering is unaffected.
     Tokens mirror the Botanical design system: alabaster #F9F8F4,
     forest #2D3A31, sage #8C9A84, clay #DCCFC2, stone #E6E2DA,
     terracotta #C27B66, Playfair Display for headings,
     Source Sans 3 for body/UI.
     NOTE: no markup or text changes — presence is restyled through
     scoped CSS only (decorative ::before ornaments add editorial
     flourishes without touching content strings).
     ============================================================ */
  body.bot{
    --bot-bg:#F9F8F4;
    --bot-ink:#2D3A31;
    --bot-ink-soft:rgba(45,58,49,.72);
    --bot-ink-faint:rgba(45,58,49,.5);
    --bot-sage:#8C9A84;
    --bot-sage-deep:#6E7F66;
    --bot-sage-wash:rgba(140,154,132,.16);
    --bot-clay:#DCCFC2;
    --bot-card:#FFFFFF;
    --bot-card2:#F2F0EB;
    --bot-border:#E6E2DA;
    --bot-terra:#C27B66;
    --bot-forest:#2D3A31;
    /* Re-tint the shared universal nav (rendered by site-nav.js) via
       its own custom properties — page-scoped, no other page sees this. */
    --nav-bg:rgba(249,248,244,.92);
    --nav-surface:#FFFFFF;
    --nav-border:#E6E2DA;
    --nav-border-soft:#E6E2DA;
    --nav-ink:#2D3A31;
    --nav-ink-soft:rgba(45,58,49,.62);
    --nav-ink-dim:rgba(45,58,49,.45);
    --nav-brand:#2D3A31;
    --nav-brand-strong:#C27B66;
    --nav-tint:rgba(140,154,132,.14);
    --nav-tint2:rgba(140,154,132,.18);
    --nav-shadow:0 20px 40px -10px rgba(45,58,49,.12);
    background:var(--bot-bg);
    color:var(--bot-ink);
    color-scheme:light;
    font-family:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;
  }
  body.bot ::selection{background:var(--bot-sage);color:#fff;}
  body.bot h1,body.bot h2,body.bot h3,body.bot h4,body.bot h5{font-family:'Playfair Display',Georgia,serif;}
  body.bot a:focus-visible,body.bot button:focus-visible{outline:2px solid var(--bot-sage);outline-offset:3px;}

  /* Paper grain overlay (mandatory) — fixed full-screen SVG fractal
     noise at 1.5% opacity; transforms flat pixels into warm paper. */
  body.bot::before{
    content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    background-repeat:repeat;
  }

  body.bot #siteNav .brand{font-family:'Playfair Display',Georgia,serif;}
  body.bot #siteNav .brand .z{background:var(--bot-forest);border-radius:999px;}

  body.bot #siteNav .navlinks>a.current{color:var(--bot-terra);}
  body.bot #siteNav .nav-cta{background:var(--bot-forest);border-radius:999px;font-family:'Source Sans 3',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;padding:12px 28px;white-space:nowrap;}
  body.bot #siteNav .nav-cta:hover{background:var(--bot-terra);}

  body.bot .chero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(560px 380px at 85% 8%,rgba(140,154,132,.22),transparent 70%),
      radial-gradient(520px 360px at 8% 90%,rgba(220,207,194,.4),transparent 70%);
  }
  body.bot .chero-blob1{background:radial-gradient(circle,rgba(140,154,132,.28),transparent 68%);}
  body.bot .chero-blob2{background:radial-gradient(circle,rgba(220,207,194,.45),transparent 65%);}
  body.bot .chero-pattern{opacity:.6;}
  body.bot .chero-mark{background:#fff;border:1px solid var(--bot-border);border-radius:20px;box-shadow:0 10px 15px -3px rgba(45,58,49,.08);}
  body.bot .chero-eyebrow{
    font-family:'Source Sans 3',sans-serif;font-weight:600;color:var(--bot-sage-deep);
    background:var(--bot-card2);border:1px solid var(--bot-border);
    letter-spacing:.14em;border-radius:999px;

function esc(s){return zone7Esc(s);}
function animateCount(el, target, suffix){
  const isNum = /^\d+/.test(target);
  if(!isNum){ el.textContent = target; return; }
  const num = parseInt(target, 10);
  const rest = target.replace(/^\d+/, "");
  let cur = 0; const step = Math.max(1, Math.ceil(num/40));
  const t = setInterval(() => { cur += step; if(cur >= num){ cur = num; clearInterval(t); } el.textContent = cur + rest; }, 25);
}
function initReveal(){
  const obs = new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add("show"); obs.unobserve(e.target); } }), {threshold:0.12});
  document.querySelectorAll(".reveal").forEach(el => obs.observe(el));
  document.querySelectorAll(".g-bar-fill").forEach(el => {
    const obs2 = new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting){ e.target.style.width = e.target.dataset.pct; obs2.unobserve(e.target); } }), {threshold:0.3});
    obs2.observe(el);
  });
  document.querySelectorAll(".stat-strip .s b").forEach(el => {
    const obs3 = new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting){ animateCount(e.target, e.target.dataset.val); obs3.unobserve(e.target); } }), {threshold:0.4});
    obs3.observe(el);
  });
}

            <div class="g-ic">${g.s==='completed'?'✓':g.s==='canceled'?'✕':'◐'}</div>
            <div class="g-text">${esc(g.t)}</div>
            ${g.s==='inprogress' ? `<div class="g-progress"><div class="g-bar-track"><div class="g-bar-fill" data-pct="${pctFor(g)}"></div></div><span class="g-pct">${g.pct ? g.pct : '-'}</span></div>` : ""}
            <span class="g-status">${g.s === 'inprogress' ? 'In Progress' : g.s}</span>
          </div>`).join("")}</div>` : `<p class="no-goals reveal">No active club goals on record yet.</p>`}
      </div>
    </section>

    <section class="csec wrap" id="projects">
      <span class="csec-tag reveal">In Action</span>
      <h2 class="reveal">Projects run by this club.</h2>
      <div class="pmasonry" id="pmasonry"><p class="loading-note">Loading projects…</p></div>
    </section>

    <section class="join-cta wrap">
      <div class="join-card reveal">
        <h2>Want to join ${esc(club.name)}?</h2>
        <p>Membership is open to anyone aged 18-30. Fill out one short form and this club will welcome you in.</p>
        <div class="join-actions">
          <a class="btn btn-primary" href="/join">Fill the Join Form →</a>
          <a class="btn btn-ghost-dark" style="border-color:rgba(255,255,255,.5);" href="/#clubs">Explore Other Clubs</a>
        </div>
      </div>
    </section>
  `;

  if(theme){
    document.getElementById("cheroBlob1").style.background = theme.blob1;
    document.getElementById("cheroBlob2").style.background = theme.blob2;
    const patternEl = document.getElementById("cheroPattern");
    patternEl.style.backgroundImage = theme.pattern;
    if(theme.bgSize) patternEl.style.backgroundSize = theme.bgSize;
    document.getElementById("cheroWatermark").textContent = theme.icon;
    document.getElementById("cheroWatermark").style.fontSize = "13rem";
    /* Botanical decor: serif ornament instead of the compass emoji. */
    if(isBot){ document.getElementById("cheroWatermark").textContent = "\u2767"; }
    /* Vaporwave decor: zone number as outlined display type instead of the emoji. */
    if(isVapor){ document.getElementById("cheroWatermark").textContent = "07"; }
  }

  const pm = document.getElementById("pmasonry");
  const projects = (typeof ZONE7_DB !== "undefined") ? await ZONE7_DB.getProjects(clubSlug, { limit: 60 }) : [];
  if(projects.length){
    pm.innerHTML = projects.map(p => `
      <div class="pcard" onclick="location.href='/project?club=${encodeURIComponent(clubSlug)}&id=${encodeURIComponent(p.id)}'">
        <img src="${esc(p.cover || 'https://images.unsplash.com/photo-1521791136064-7986c2920216?w=600')}" alt="${esc(p.title)}" loading="lazy">
        <div class="pcard-cap"><b>${esc(p.title)}</b><span>${esc(p.category || 'Project')} · ${esc(p.date || '')}</span></div>
      </div>
    `).join("");
  } else {
    pm.innerHTML = `<div class="no-projects-note">This club hasn't published any projects yet. Club officers can add projects from the <a href="/admin" style="color:var(--magenta-deep); font-weight:700;">Club Admin panel</a>.</div>`;
  }
  initReveal();
})();
} else {
  document.getElementById("content").innerHTML = `<div class="empty-state"><h2>Club not found</h2><p class="loading-note" style="margin-top:10px;">Go back and select a club from the homepage.</p></div>`;
}
</script>



<script defer src="z7-lazy.js"></script>
</body>
</html>
