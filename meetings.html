<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://va.vercel-scripts.com/v1/script.js"></script>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="alternate" hreflang="en" href="https://zone7rotaract3292.vercel.app/meetings">
<link rel="alternate" hreflang="x-default" href="https://zone7rotaract3292.vercel.app/meetings">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=/tutorials">
<link rel="canonical" href="https://zone7rotaract3292.vercel.app/tutorials">
<title>Redirecting, Zone 7 Rotaract</title>
<style>
  html{overflow-x:hidden;overflow-x:clip;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0F1A;color:#E2E8F0;font-family:Georgia,serif;text-align:center}
  img{max-width:100%;display:block}
  a{color:#F59E0B}
  p{margin:.6em 0}
</style>
<script>document.documentElement.classList.add("pt-enter");try{var t=localStorage.getItem("z7-theme");if(!t){var h=localStorage.getItem("hb-theme");if(h==="dark"||h==="light"){localStorage.setItem("z7-theme",h);t=h}}if(t==="dark")document.documentElement.classList.add("dark")}catch(e){}document.documentElement.style.background=document.documentElement.classList.contains("dark")?"#0E0C1A":"#FFF8EF";</script>
  </head>
<body>
<div>
  <p>Meeting guides have moved to the Tutorials section.</p>
  <p><a href="/tutorials">Continue to Tutorials →</a></p>
  <p><small>You will be redirected automatically.</small></p>
</div>
<script>location.replace('/tutorials');</script>
<script src="site-transition.js" defer></script>
<style>/* Zone 7 night-mode pass */
html.dark{color-scheme:dark;--ink:#CBC9DE;--cream:#0E0C1A;--paper:#151327;--line:rgba(233,231,247,.14);--magenta:#E06093;--magenta-deep:#E11A6E;--gold:#D9A648}
html.dark body{background:var(--paper);color:var(--ink)}
html.dark input,html.dark select,html.dark textarea{background:#1C1A33;color:var(--ink);border:1px solid var(--line)}
html.dark ::placeholder{color:rgba(233,231,247,.45)}
</style>
</body>
</html>
