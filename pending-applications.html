<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="alternate" hreflang="en" href="https://zone7rotaract3292.vercel.app/pending-applications">
<link rel="alternate" hreflang="ne" href="https://zone7rotaract3292.vercel.app/ne/pending-applications">
<link rel="alternate" hreflang="x-default" href="https://zone7rotaract3292.vercel.app/pending-applications">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Applications, Zone 7</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #12102b; color: #eee; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
  h1 { color: #F2A900; font-size: 1.4rem; }
  p.hint { color: #b9b4e0; font-size: .92rem; }
  .card { background: #1d1a3d; border: 1px solid #35316b; border-radius: 10px; padding: 16px 18px; margin: 14px 0; }
  .card h3 { margin: 0 0 8px; color: #E11A6E; font-size: 1rem; }
  .card pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: .85rem; color: #ddd; }
  .empty { color: #8a86b8; text-align: center; padding: 40px 0; }
  .btn { display: inline-block; margin: 6px 6px 0 0; padding: 8px 14px; border: none; border-radius: 8px;
         background: #E11A6E; color: #fff; cursor: pointer; font-size: .9rem; }
  .btn.ghost { background: transparent; border: 1px solid #55508f; color: #ccc; }
  .count { font-weight: 600; color: #F2A900; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Saved applications on this browser (device)</h1>
  <p class="hint">This page reads the local queue saved when the form could not send. If nothing shows here, your submission was actually sent to FormSubmit, so check ri3292zone7@gmail.com.</p>
  <div id="list"></div>
  <div id="empty" class="empty" style="display:none">No saved applications, the queue is empty.</div>
  <button id="copyBtn" class="btn" style="display:none">Copy all as JSON</button>
  <button id="clearBtn" class="btn ghost" style="display:none">Clear saved applications</button>
</div>
<script>
  var raw = localStorage.getItem('zone7_pending_applications');
  var list = [];
  try { list = JSON.parse(raw || '[]'); } catch (e) { list = []; }

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var copyBtn = document.getElementById('copyBtn');
  var clearBtn = document.getElementById('clearBtn');

  if (!list.length) { emptyEl.style.display = 'block'; }
  else {
    list.forEach(function (app, i) {
      var card = document.createElement('div');
      card.className = 'card';
      var name = app.fullname || ('Application #' + (i + 1));
      var head = document.createElement('h3');
      head.textContent = (i + 1) + '. ' + name;
      var pre = document.createElement('pre');
      var lines = Object.keys(app).filter(function (k) { return !k.startsWith('_'); })
        .map(function (k) { return k.replace(/_/g, ' ') + ': ' + app[k]; });
      pre.textContent = lines.join('\n');
      card.appendChild(head);
      card.appendChild(pre);
      listEl.appendChild(card);
    });
    copyBtn.style.display = 'inline-block';
    clearBtn.style.display = 'inline-block';
  }

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(JSON.stringify(list, null, 2)).then(function () {
      copyBtn.textContent = 'Copied!';
      setTimeout(function () { copyBtn.textContent = 'Copy all as JSON'; }, 1500);
    });
  });
  clearBtn.addEventListener('click', function () {
    localStorage.removeItem('zone7_pending_applications');
    location.reload();
  });
</script>
</body>
</html>
