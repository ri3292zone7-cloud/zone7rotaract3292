<style>
  :root{
    --ink:#1B1836; --magenta:#E11A6E; --magenta-deep:#A80F52; --gold:#F2A900;
    --cream:#FFF8EF; --paper:#FFFDF9; --line: rgba(27,24,54,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink);}
  h1,h2,h3,h4{font-family:'Poppins',sans-serif; font-weight:800; letter-spacing:-0.02em;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:980px; margin:0 auto; padding:0 28px;}


  .p-hero{position:relative; margin-top:0;}
  .p-hero-img{
    width:100%; aspect-ratio:16/8; object-fit:cover; background:linear-gradient(150deg, rgba(225,26,110,0.18), rgba(242,169,0,0.15));
  }
  .p-hero-overlay{
    position:absolute; inset:0; background:linear-gradient(0deg, rgba(27,24,54,0.82) 0%, rgba(27,24,54,0.15) 55%, transparent 100%);
    display:flex; align-items:flex-end;
  }
  .p-hero-content{padding:48px 0 40px; width:100%; color:#fff;}
  .p-tag{
    display:inline-flex; align-items:center; gap:8px; font-size:0.76rem; font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; background:rgba(255,255,255,0.14); padding:7px 14px; border-radius:100px; margin-bottom:16px;
  }
  .p-hero-content h1{font-size:clamp(1.9rem,4.6vw,3rem); max-width:800px; color:#fff; line-height:1.08;}
  .p-hero-content .club-line{margin-top:14px; font-size:0.95rem; font-weight:600; color:rgba(255,255,255,0.85);}
  .p-sdgs{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;}
  .p-sdg{
    font-size:0.7rem; font-weight:700; letter-spacing:0.03em; color:#fff;
    background:var(--sdg); padding:6px 12px; border-radius:100px; white-space:nowrap;
  }

  .p-meta-row{display:flex; gap:34px; flex-wrap:wrap; margin:36px 0 6px; padding-bottom:30px; border-bottom:1px solid var(--line);}
  .p-meta b{display:block; font-family:'Poppins'; font-size:0.95rem; color:var(--magenta-deep);}
  .p-meta span{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:rgba(27,24,54,0.5); font-weight:700;}

  /* ---- Stats pills — the prominent display ---- */
  .p-stats-pills{
    display:flex; flex-wrap:wrap; gap:10px; margin-top:22px;
  }
  .p-pill{
    display:inline-flex; flex-direction:column; align-items:flex-start;
    background:var(--ink); color:#fff; border-radius:16px; padding:14px 20px; min-width:110px;
  }
  .p-pill b{font-family:'Poppins'; font-weight:800; font-size:1.35rem; line-height:1.1; color:#fff;}
  .p-pill span{font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:rgba(255,255,255,0.55); margin-top:4px;}
  .p-pill.accent{background:linear-gradient(135deg, var(--magenta), var(--magenta-deep));}
  .p-pill.gold{background:linear-gradient(135deg, #b07d00, var(--gold)); color:var(--ink);}
  .p-pill.gold b{color:var(--ink);}
  .p-pill.gold span{color:rgba(27,24,54,0.55);}

  .p-jointly{
    margin-top:14px; display:inline-flex; align-items:center; gap:8px; font-size:0.85rem; font-weight:700;
    color:var(--magenta-deep); background:rgba(225,26,110,0.08); padding:9px 16px; border-radius:100px;
  }

  .p-host-badge{
    display:inline-flex; margin-top:18px; font-size:0.78rem; font-weight:800; letter-spacing:0.03em;
    color:#fff; background:var(--magenta-deep); padding:6px 15px; border-radius:100px;
  }
  .p-body{padding:46px 0; font-size:1.05rem; line-height:1.9; color:rgba(27,24,54,0.78); max-width:760px; white-space:pre-line;}

  .p-gallery{padding:10px 0 60px;}
  .p-gallery h3{font-size:1.2rem; margin-bottom:20px;}
  .gal-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .gal-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:14px; cursor:zoom-in; transition:transform .2s;}
  .gal-grid img:hover{transform:scale(1.02);}

  .lightbox{
    position:fixed; inset:0; background:rgba(10,8,20,0.92); display:none; align-items:center; justify-content:center;
    z-index:999; padding:30px; cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{position:relative;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;align-items:center;}
  .lightbox img{max-width:92vw; max-height:80vh; border-radius:10px; object-fit:contain; box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .lb-count{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.65);font-size:.78rem;font-weight:700;letter-spacing:.08em;}
  .lb-close{position:fixed;top:16px;right:20px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1.15rem;cursor:pointer;transition:.2s;z-index:2;}
  .lb-close:hover{background:var(--magenta-deep);}
  .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(27,24,54,.55);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;z-index:2;}
  .lb-btn:hover{background:var(--magenta-deep);}
  .lb-prev{left:-70px;}.lb-next{right:-70px;}
  @media (max-width:900px){.lb-prev{left:2px;}.lb-next{right:2px;}}

  .p-cta{padding:50px 0 90px; display:flex; gap:16px; flex-wrap:wrap;}
  .btn{padding:15px 30px; border-radius:100px; font-weight:700; font-size:0.95rem; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-ghost{border:1.6px solid var(--ink); color:var(--ink);}

  .empty-state{padding:120px 28px; text-align:center;}
  .empty-state h2{margin-bottom:12px;}
  .empty-state p{color:rgba(27,24,54,0.6); margin-bottom:26px;}

  footer{background:var(--ink); color:rgba(255,255,255,0.5); padding:34px 0; text-align:center; font-size:0.85rem;}

  @media (max-width:720px){ .gal-grid{grid-template-columns:repeat(2,1fr);} .p-pill{min-width:90px;} }
</style>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" id="lbClose" aria-label="Close photo viewer">✕</button>
  <span class="lb-count" id="lbCount"></span>
  <div class="lightbox-inner">
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>

    <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">›</button>
  </div>
</div>
<script>
/* ------------------------------------------------------------------ *
 * parseStatsFromText — extracts numeric stats from project body text
 * when structured fields (attendees, volunteer_hours, duration,
 * expense) are absent. Falls back gracefully if nothing matches.
 * ------------------------------------------------------------------ */
function parseStatsFromText(text){
  if(!text) return {};
  const s = {};

  // Rotaractors / attendees
  // "40 Rotaractors", "50 Rotaractors and 15 other visitors"
  const rotM = text.match(/(\d+(?:,\d+)?)\s+Rotaractors?/i);
  if(rotM) s.rotaractors = rotM[1];

  // Other visitors
  const visM = text.match(/(\d+(?:,\d+)?)\s+other\s+visitors?/i);
  if(visM) s.visitors = visM[1];

  // Rotarians
  const rotarianM = text.match(/(\d+(?:,\d+)?)\s+Rotarians?/i);
  if(rotarianM) s.rotarians = rotarianM[1];

  // Total attendees fallback (if no Rotaractor split found)
  if(!s.rotaractors){
    const attM = text.match(/(\d+(?:,\d+)?)\s+(?:attendees?|participants?|people)/i);
    if(attM) s.attendees = attM[1];
  }

  // Duration: "over 2 hours", "4.5 hours", "for 3 hours"
  const durM = text.match(/(?:over|for|ran\s+for|spanning)\s+([\d.]+(?:\s*\.\s*\d+)?)\s+hours?/i)
    || text.match(/([\d.]+)\s+hours?\s+(?:long|duration)/i);
  if(durM) s.duration = durM[1] + " hrs";

  // Volunteering hours: "contributing X volunteering hours"
  const volM = text.match(/contributing\s+([\d,]+(?:\.\d+)?)\s+(?:total\s+)?volunteering\s+hours?/i)
    || text.match(/([\d,]+(?:\.\d+)?)\s+(?:total\s+)?volunteer(?:ing)?\s+hours?/i);
  if(volM) s.vol_hours = volM[1];

  // Expense: "NRs. 2,000" or "NRs 5,000" or "Rs. 2000"
  const expM = text.match(/NRs?\.?\s*([\d,]+)/i) || text.match(/Rs\.?\s*([\d,]+)/i);
  if(expM) s.expense = "NRs " + expM[1];

  // Trees planted
  const treeM = text.match(/(\d+(?:,\d+)?)\s+trees?\s+(?:were\s+)?planted/i);
  if(treeM) s.trees = treeM[1];

  // Blood pints
  const bloodM = text.match(/(\d+(?:,\d+)?)\s+pints?\s+of\s+blood/i);
  if(bloodM) s.blood_pints = bloodM[1];

  return s;
}

/* UN Sustainable Development Goals — keyword-matched from a project's
   category/title/body so every project page can show what it aligns with. */
const SDG_MAP = [
  { num:3,  name:"Good Health & Well-Being", color:"#4C9F38",  words:["health","blood","hygiene","screening","donation","mental","dengue","cancer","vaccin","first aid","sick"] },
  { num:4,  name:"Quality Education",        color:"#C5192D",  words:["education","school","literacy","teach","student","uniform","child club","classroom"] },
  { num:5,  name:"Gender Equality",          color:"#FF3A21",  words:["women","girl","menstru","gbv","gender"] },
  { num:6,  name:"Clean Water & Sanitation", color:"#26BDE2",  words:["water","sanitation","wash"] },
  { num:10, name:"Reduced Inequalities",     color:"#DD1367",  words:["marginal","chepang","disability","brick factory","inclus"] },
  { num:13, name:"Climate Action",           color:"#3F7E44",  words:["climate","environment","plantation","tree","clean-up","cleanup","recycl"] },
  { num:17, name:"Partnerships for the Goals", color:"#19486A", words:["joint","exchange","twin","collaborat","together with","alliance"] }
];
function computeSdgs(project){
  const text = ((project.category||"") + " " + (project.title||"") + " " + (project.summary||"") + " " + (project.body||"")).toLowerCase();
  return SDG_MAP.filter(g => g.words.some(w => text.includes(w)));
}

document.addEventListener("DOMContentLoaded", () => {
const params = new URLSearchParams(location.search);
const clubSlug = params.get("club");
const projectId = params.get("id");
const club = CLUB_DIRECTORY[clubSlug];

const clubBackLink = document.getElementById("clubBackLink");
if (clubBackLink) clubBackLink.href = clubSlug ? `/${clubSlug}` : "/";
document.getElementById("content").innerHTML = `<div class="empty-state wrap"><h2>Loading…</h2></div>`;

(async () => {
const project = (clubSlug && projectId) ? await ZONE7_DB.getProject(clubSlug, projectId) : null;

if(project && club){
  document.title = project.title + " | " + club.name;

  const dateStr = project.date ? new Date(project.date).toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}) : "Date not set";

  // Merge structured fields with text-parsed fallbacks
  const bodyText = project.body || project.summary || "";
  const parsed = parseStatsFromText(bodyText);

  const attendees  = project.attendees    || null;
  const volHours   = project.volunteer_hours ? String(project.volunteer_hours) : (parsed.vol_hours || null);
  const duration   = project.duration     || (parsed.duration || null);
  const jointly    = project.jointly_with || null;

  // Build pills array
  const pills = [];
  if(attendees)          pills.push({val: attendees,         label:"Attendees",         style:""});
  else if(parsed.rotaractors) {
    pills.push({val: parsed.rotaractors, label:"Rotaractors", style:"accent"});
    if(parsed.rotarians) pills.push({val: parsed.rotarians,  label:"Rotarians",         style:""});
    if(parsed.visitors)  pills.push({val: parsed.visitors,   label:"Other Visitors",    style:""});
  } else if(parsed.attendees) {
    pills.push({val: parsed.attendees,   label:"Participants",  style:""});
  }
  if(duration)  pills.push({val: duration,  label:"Duration",           style:""});
  if(volHours)  pills.push({val: volHours,  label:"Volunteering Hours", style:"accent"});
  if(parsed.trees)       pills.push({val: parsed.trees,      label:"Trees Planted",     style:"gold"});
  if(parsed.blood_pints) pills.push({val: parsed.blood_pints,label:"Pints of Blood",   style:"accent"});
  if(parsed.expense)     pills.push({val: parsed.expense,    label:"Total Expense",     style:""});

  const pillsHTML = pills.length
    ? `<div class="p-stats-pills">${pills.map(p =>
        `<div class="p-pill${p.style ? ' '+p.style : ''}"><b>${zone7Esc(p.val)}</b><span>${zone7Esc(p.label)}</span></div>`
      ).join("")}</div>`
    : "";

  const jointlyHTML = jointly
    ? `<div class="p-jointly">🤝 Jointly with: ${zone7Esc(jointly)}</div>`
    : "";

  const sdgs = computeSdgs(project);
  const sdgHTML = sdgs.length
    ? `<div class="p-sdgs">${sdgs.map(g =>
        `<span class="p-sdg" style="--sdg:${g.color}">SDG ${g.num} · ${zone7Esc(g.name)}</span>`
      ).join("")}</div>`
    : "";

  document.getElementById("content").innerHTML = `
    <header class="p-hero">
      <img class="p-hero-img" src="${zone7Esc(project.cover || 'https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1200')}" alt="${zone7Esc(project.title)}" width="1600" height="800">
      <div class="p-hero-overlay">
        <div class="wrap p-hero-content">
          <span class="p-tag">${zone7Esc(project.category || "Club Project")}</span>
          <h1>${zone7Esc(project.title)}</h1>
          <div class="club-line">${zone7Esc(club.name)}</div>
          ${sdgHTML}
        </div>
      </div>
    </header>

    <section class="wrap">
      <div class="p-meta-row">
        <div class="p-meta"><b>${zone7Esc(dateStr)}</b><span>Project Date</span></div>
        <div class="p-meta"><b>${zone7Esc(project.location || "Kathmandu Valley")}</b><span>Location</span></div>
        <div class="p-meta"><b>${zone7Esc(club.name)}</b><span>Organized By</span></div>
      </div>
      ${project.host_status ? `<span class="p-host-badge">${zone7Esc(project.host_status)}</span>` : ""}
      ${pillsHTML}
      ${jointlyHTML}
      <div class="p-body">${zone7Esc(bodyText)}</div>
    </section>

    ${project.gallery && project.gallery.length ? `
    <section class="wrap p-gallery">
      <h3>Gallery</h3>
      <div class="gal-grid" id="galGrid"></div>
    </section>` : ""}

    <section class="wrap p-cta">
      <a class="btn btn-primary" href="/${clubSlug}">← Back to ${club.name.replace('Rotaract Club of ','')}</a>
      <a class="btn btn-ghost" href="/#clubs">All Zone 7 Clubs</a>
    </section>
  `;

  if(project.gallery && project.gallery.length){
    const grid = document.getElementById("galGrid");
    const galImgs = project.gallery.slice();
    grid.innerHTML = galImgs.map((src,i) => `<img src="${zone7Esc(src)}" alt="${zone7Esc(project.title)}, photo ${i+1} of ${galImgs.length}" loading="lazy" width="600" height="600">`).join("");
    const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lightboxImg"), lbCount = document.getElementById("lbCount");
    let li = 0;
    function showLb(i){
      li = (i + galImgs.length) % galImgs.length;
      lbImg.src = galImgs[li];
      lbImg.alt = zone7Esc(project.title) + ", photo " + (li+1) + " of " + galImgs.length;
      lbCount.textContent = (li+1) + " / " + galImgs.length;
      lb.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeLb(){ lb.classList.remove("open"); document.body.style.overflow = ""; }
    grid.querySelectorAll("img").forEach((img,i) => img.addEventListener("click", () => showLb(i)));
    document.getElementById("lbClose").addEventListener("click", closeLb);
    document.getElementById("lbPrev").addEventListener("click", () => showLb(li-1));
    document.getElementById("lbNext").addEventListener("click", () => showLb(li+1));
    lb.addEventListener("click", e => { if(e.target === lb) closeLb(); });
    document.addEventListener("keydown", e => {
      if(!lb.classList.contains("open")) return;
      if(e.key === "Escape") closeLb();
      if(e.key === "ArrowLeft") showLb(li-1);
      if(e.key === "ArrowRight") showLb(li+1);
    });
  }

} else {
  document.getElementById("content").innerHTML = `
    <div class="empty-state wrap">
      <h2>Project not found</h2>
      <p>This project may have been removed, or the link is incorrect.</p>
      <a class="btn btn-primary" href="/#clubs">Browse Zone 7 Clubs</a>
    </div>
  `;
}
})();
});
</script>
