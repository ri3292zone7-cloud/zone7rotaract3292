<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project | Zone 7 Rotaract 3292</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1836; --magenta:#E11A6E; --magenta-deep:#A80F52; --gold:#F2A900;
    --cream:#FFF8EF; --paper:#FFFDF9; --line: rgba(27,24,54,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink);}
  h1,h2,h3,h4{font-family:'Poppins',sans-serif; font-weight:800; letter-spacing:-0.02em;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:980px; margin:0 auto; padding:0 28px;}

  nav{position:sticky; top:0; z-index:100; background:rgba(255,253,249,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  nav .wrap{display:flex; align-items:center; justify-content:space-between; height:76px;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Poppins'; font-weight:800; font-size:1.1rem;}
  .brand .z{background:var(--magenta); color:#fff; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .back{font-weight:700; font-size:0.88rem; color:var(--magenta-deep);}

  .p-hero{position:relative; margin-top:0;}
  .p-hero-img{
    width:100%; aspect-ratio:16/8; object-fit:cover; background:linear-gradient(150deg, rgba(225,26,110,0.18), rgba(242,169,0,0.15));
  }
  .p-hero-overlay{
    position:absolute; inset:0; background:linear-gradient(0deg, rgba(27,24,54,0.82) 0%, rgba(27,24,54,0.15) 55%, transparent 100%);
    display:flex; align-items:flex-end;
  }
  .p-hero-content{padding:48px 0 40px; width:100%; color:#fff;}
  .p-tag{
    display:inline-flex; align-items:center; gap:8px; font-size:0.76rem; font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; background:rgba(255,255,255,0.14); padding:7px 14px; border-radius:100px; margin-bottom:16px;
  }
  .p-hero-content h1{font-size:clamp(1.9rem,4.6vw,3rem); max-width:800px; color:#fff; line-height:1.08;}
  .p-hero-content .club-line{margin-top:14px; font-size:0.95rem; font-weight:600; color:rgba(255,255,255,0.85);}

  .p-meta-row{display:flex; gap:34px; flex-wrap:wrap; margin:36px 0 6px; padding-bottom:30px; border-bottom:1px solid var(--line);}
  .p-meta b{display:block; font-family:'Poppins'; font-size:0.95rem; color:var(--magenta-deep);}
  .p-meta span{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:rgba(27,24,54,0.5); font-weight:700;}

  .p-stats-strip{
    margin-top:24px; background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:16px 22px; font-size:0.92rem; color:rgba(27,24,54,0.75); line-height:1.8;
  }
  .p-stats-strip b{color:var(--ink);}
  .p-stats-strip .sep{color:var(--line); margin:0 4px;}
  .p-host-badge{
    display:inline-flex; margin-top:18px; font-size:0.78rem; font-weight:800; letter-spacing:0.03em;
    color:#fff; background:var(--magenta-deep); padding:6px 15px; border-radius:100px;
  }
  .p-body{padding:46px 0; font-size:1.05rem; line-height:1.9; color:rgba(27,24,54,0.78); max-width:760px; white-space:pre-line;}

  .p-gallery{padding:10px 0 60px;}
  .p-gallery h3{font-size:1.2rem; margin-bottom:20px;}
  .gal-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .gal-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:14px; cursor:zoom-in; transition:transform .2s;}
  .gal-grid img:hover{transform:scale(1.02);}

  .lightbox{
    position:fixed; inset:0; background:rgba(10,8,20,0.92); display:none; align-items:center; justify-content:center;
    z-index:999; padding:30px; cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92vw; max-height:88vh; border-radius:10px; object-fit:contain;}

  .p-cta{padding:50px 0 90px; display:flex; gap:16px; flex-wrap:wrap;}
  .btn{padding:15px 30px; border-radius:100px; font-weight:700; font-size:0.95rem; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-ghost{border:1.6px solid var(--ink); color:var(--ink);}

  .empty-state{padding:120px 28px; text-align:center;}
  .empty-state h2{margin-bottom:12px;}
  .empty-state p{color:rgba(27,24,54,0.6); margin-bottom:26px;}

  footer{background:var(--ink); color:rgba(255,255,255,0.5); padding:34px 0; text-align:center; font-size:0.85rem;}

  @media (max-width:720px){ .gal-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<nav><div class="wrap">
  <a href="index.html"><div class="brand"><span class="z">7</span> Zone 7 Rotaract</div></a>
  <a href="#" id="clubBackLink" class="back">← Back to Club</a>
</div></nav>

<div id="content"></div>

<footer>© 2026 Zone 7, Rotaract District 3292 Nepal-Bhutan.</footer>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<script src="zone7-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const clubSlug = params.get("club");
const projectId = params.get("id");
const club = CLUB_DIRECTORY[clubSlug];

document.getElementById("clubBackLink").href = clubSlug ? `club.html?club=${clubSlug}` : "index.html";
document.getElementById("content").innerHTML = `<div class="empty-state wrap"><h2>Loading…</h2></div>`;

(async () => {
const project = (clubSlug && projectId) ? await ZONE7_DB.getProject(clubSlug, projectId) : null;

if(project && club){
  document.title = project.title + " | " + club.name;

  const dateStr = project.date ? new Date(project.date).toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}) : "Date not set";

  document.getElementById("content").innerHTML = `
    <header class="p-hero">
      <img class="p-hero-img" src="${zone7Esc(project.cover || '')}" alt="${zone7Esc(project.title)}">
      <div class="p-hero-overlay">
        <div class="wrap p-hero-content">
          <span class="p-tag">${zone7Esc(project.category || "Club Project")}</span>
          <h1>${zone7Esc(project.title)}</h1>
          <div class="club-line">${zone7Esc(club.name)}</div>
        </div>
      </div>
    </header>

    <section class="wrap">
      <div class="p-meta-row">
        <div class="p-meta"><b>${zone7Esc(dateStr)}</b><span>Project Date</span></div>
        <div class="p-meta"><b>${zone7Esc(project.location || "Kathmandu Valley")}</b><span>Location</span></div>
        <div class="p-meta"><b>${zone7Esc(club.name)}</b><span>Organized By</span></div>
      </div>
      ${project.host_status ? `<span class="p-host-badge">${zone7Esc(project.host_status)}</span>` : ""}
      ${(project.duration || project.volunteer_hours || project.attendees || project.jointly_with) ? `
      <div class="p-stats-strip">
        ${dateStr ? `<b>Date:</b> ${zone7Esc(dateStr)}` : ""}
        ${project.duration ? `<span class="sep">|</span><b>Duration:</b> ${zone7Esc(project.duration)}` : ""}
        ${project.volunteer_hours ? `<span class="sep">|</span><b>Volunteering Hours:</b> ${zone7Esc(String(project.volunteer_hours))}` : ""}
        ${project.attendees ? `<span class="sep">|</span><b>Attendees:</b> ${zone7Esc(String(project.attendees))}` : ""}
        ${project.jointly_with ? `<span class="sep">|</span><b>Jointly with:</b> ${zone7Esc(project.jointly_with)}` : ""}
      </div>` : ""}
      <div class="p-body">${zone7Esc(project.body || project.summary || "")}</div>
    </section>

    ${project.gallery && project.gallery.length ? `
    <section class="wrap p-gallery">
      <h3>Gallery</h3>
      <div class="gal-grid" id="galGrid"></div>
    </section>` : ""}

    <section class="wrap p-cta">
      <a class="btn btn-primary" href="club.html?club=${clubSlug}">← Back to ${club.name.replace('Rotaract Club of ','')}</a>
      <a class="btn btn-ghost" href="index.html#clubs">All Zone 7 Clubs</a>
    </section>
  `;

  if(project.gallery && project.gallery.length){
    const grid = document.getElementById("galGrid");
    grid.innerHTML = project.gallery.map(src => `<img src="${zone7Esc(src)}" alt="${zone7Esc(project.title)} photo">`).join("");
    grid.querySelectorAll("img").forEach(img => {
      img.addEventListener("click", () => {
        document.getElementById("lightboxImg").src = img.src;
        document.getElementById("lightbox").classList.add("open");
      });
    });
  }
  document.getElementById("lightbox").addEventListener("click", () => {
    document.getElementById("lightbox").classList.remove("open");
  });

} else {
  document.getElementById("content").innerHTML = `
    <div class="empty-state wrap">
      <h2>Project not found</h2>
      <p>This project may have been removed, or the link is incorrect.</p>
      <a class="btn btn-primary" href="index.html#clubs">Browse Zone 7 Clubs</a>
    </div>
  `;
}
})();
</script>
</body>
</html>
