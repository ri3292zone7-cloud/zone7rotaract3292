<style>
:root{
  --brand:#E11A6E;--brand-deep:#A80F52;--ink:#1B1836;--gold:#F2A900;--teal:#0E7490;
  --cream:#FAFAFA;--paper:#FFFDF9;--accent:#f5f5f5;--border:#e5e7eb;--border-muted:#f3f4f6;
  --pres:#E11A6E;--sec:#2563EB;--treas:#7C3AED;--vps:#0E7490;--vpp:#D97706;--secr:#059669;--serg:#6B21A8;--comms:#C2410C;--board:#1B1836;
  --ink-strong:rgba(27,24,54,.82);--ink-body:rgba(27,24,54,.78);--ink-soft:rgba(27,24,54,.68);
  --ink-mid:rgba(27,24,54,.55);--ink-dim:rgba(27,24,54,.45);--ink-faint:rgba(27,24,54,.4);
  --ink-line:rgba(27,24,54,.1);--ink-line2:rgba(27,24,54,.18);--ink-line3:rgba(27,24,54,.2);
  --ink-line4:rgba(27,24,54,.04);--shadow-card:0 4px 16px rgba(27,24,54,.06);
  --gold-bg:rgba(242,169,0,.05);--gold-line:rgba(242,169,0,.18);--gold-strong:rgba(242,169,0,.14);
  --brand-bg:rgba(225,26,110,.05);--brand-line:rgba(225,26,110,.22);
  --mono:ui-monospace,'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);scroll-behavior:smooth}
body{min-height:100vh}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;color:var(--ink)}
a{color:var(--brand-deep);text-decoration:none}a:hover{text-decoration:underline}
:root.dark{
  --ink:#E9E7F7;--ink-strong:rgba(233,231,247,.86);--ink-body:rgba(233,231,247,.8);--ink-soft:rgba(233,231,247,.68);
  --ink-mid:rgba(233,231,247,.56);--ink-dim:rgba(233,231,247,.42);--ink-faint:rgba(233,231,247,.35);
  --ink-line:rgba(233,231,247,.12);--ink-line2:rgba(233,231,247,.2);--ink-line3:rgba(233,231,247,.24);
  --ink-line4:rgba(233,231,247,.05);--shadow-card:0 4px 18px rgba(0,0,0,.4);
  --cream:#0B0A16;--paper:#151327;--accent:#1C1A33;--border:#282545;--border-muted:#1E1C37;
  --gold-bg:rgba(242,169,0,.12);--gold-line:rgba(242,169,0,.3);--gold-strong:rgba(242,169,0,.2);
  --brand-bg:rgba(225,26,110,.14);--brand-line:rgba(225,26,110,.4);
  --brand-deep:#f0488f;--board:#E9E7F7;
}

/* ── layout shell ── */
.app-layout{display:flex;flex:1;min-height:0}
.main-content{flex:1;min-width:0;display:flex;justify-content:flex-start;padding:0 48px}
.content-inner{width:100%;max-width:800px;padding:44px 0 100px}
@media(max-width:1024px){.content-inner{padding:36px 0 80px}.main-content{padding:0 28px}}
@media(max-width:800px){.main-content{padding:0 16px}.content-inner{padding:24px 0 60px}}

/* ── page toolbar (breadcrumb + actions) ── */
.page-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.pb-crumb{font-size:12.5px;color:var(--ink-dim);font-family:'Inter';font-weight:500;letter-spacing:.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pb-crumb b{color:var(--ink-soft);font-weight:600}
.pb-spacer{flex:1}
.tool-actions{display:flex;align-items:center;gap:8px}
.tool-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1px solid var(--ink-line);border-radius:7px;padding:6px 11px;cursor:pointer;font-family:'Inter';transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.tool-btn:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-bg)}
.tool-btn kbd{font-family:var(--mono);font-size:10px;background:var(--accent);border:1px solid var(--ink-line);border-radius:4px;padding:1px 5px;color:var(--ink-mid)}

/* ── sidebar ── */
.sidebar-wrap{width:300px;flex-shrink:0;position:sticky;top:72px;height:calc(100vh - 72px)}
.sidebar{width:100%;height:100%;background:var(--paper);border-right:1px solid var(--ink-line);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(27,24,54,.08) transparent;padding:24px 12px 24px 36px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(27,24,54,.1);border-radius:8px}
.toc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-mid);margin-bottom:16px;font-family:'Inter'}
.toc-links{display:flex;flex-direction:column;gap:4px}
.toc-link{font-size:13px;color:var(--ink-soft);text-decoration:none;padding:4px 0 4px 12px;border-left:2px solid transparent;transition:color .15s,border-color .15s;line-height:1.5}
.toc-link:hover{color:var(--ink);border-color:var(--brand);text-decoration:none}
.toc-link.active{color:var(--brand-deep);border-color:var(--brand)}
.sb-search{position:relative;margin-bottom:14px}
.sb-search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-faint);pointer-events:none}
.sb-search input{width:100%;height:34px;padding:0 34px 0 30px;border:1px solid var(--ink-line);border-radius:8px;font-size:14px;color:var(--ink);background:var(--paper);font-family:'Inter';transition:border-color .15s}
.sb-search input:focus{outline:none;border-color:var(--brand)}
.sb-search .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink-faint);font-family:var(--mono);pointer-events:none}
.sb-group{margin-bottom:4px}
.sb-group-head{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;margin:0 -12px;font-size:15px;font-weight:700;color:var(--ink);user-select:none;font-family:'Poppins'}
.sb-group-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-items-list{padding:2px 0 8px 0}
.sb-item{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;margin:0 -12px;border-radius:8px;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s;text-decoration:none;border:1px solid transparent}
.sb-item:hover{background:var(--brand-bg);color:var(--ink);text-decoration:none}
.sb-item.active{background:var(--brand-bg);color:var(--brand-deep);font-weight:600;border-color:var(--brand)}
.sb-item .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sb-footer{margin-top:auto;padding-top:20px;border-top:1px solid var(--ink-line);font-size:12px;color:var(--ink-mid)}

/* ── right TOC rail ── */
.right-rail{display:none;width:280px;flex-shrink:0}
@media(min-width:1536px){.right-rail{display:block;position:sticky;top:72px;height:calc(100vh - 72px);padding:40px 32px 40px 0;overflow-y:auto}}
@media(min-width:801px){html.has-subnav .sidebar-wrap{top:120px;height:calc(100vh - 120px)}}
@media(min-width:1536px){html.has-subnav .right-rail{top:120px;height:calc(100vh - 120px)}}
@media(min-width:801px){html.has-subnav [data-spy]{scroll-margin-top:132px}}

/* ── overview (arcade hero) ── */
.overview-hero{margin-bottom:28px}
.overview-hero h1{font-size:clamp(1.7rem,3.2vw,2.2rem);line-height:1.1;margin-bottom:12px}
.overview-hero h1 em{font-style:normal;color:var(--brand)}
.overview-hero .page-desc{font-size:16px;color:var(--ink-body);line-height:1.7;max-width:620px}
.overview-hero .note{margin-top:16px;font-size:13.5px;color:var(--ink-soft);border-left:3px solid var(--gold);padding:12px 16px;background:var(--gold-bg);border-radius:0 8px 8px 0;line-height:1.6}
.overview-hero .note a{color:var(--brand-deep);font-weight:700;text-decoration:underline}
.overview-hero .note a:hover{text-decoration:none}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 6px}
@media(max-width:640px){.stat-strip{grid-template-columns:1fr}}
.stat-card{background:var(--paper);border:1px solid var(--ink-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat-card .num{font-family:'Poppins';font-weight:800;font-size:1.25rem;color:var(--ink)}
.stat-card .lab{font-size:12px;color:var(--ink-mid);line-height:1.5}
.role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
@media(max-width:900px){.role-cards{grid-template-columns:1fr}}
.role-card{background:var(--paper);border:1px solid var(--ink-line);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative}
.role-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--gold));opacity:0;transition:opacity .2s}
.role-card:hover{border-color:var(--ink-line2);box-shadow:var(--shadow-card);transform:translateY(-3px);text-decoration:none}
.role-card:hover::before{opacity:1}
.role-card:hover .rc-body h3{color:var(--brand-deep)}
.rc-head{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--ink-line4)}
.rc-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.15rem;flex-shrink:0}
.rc-head h3{font-size:15px;font-weight:700;line-height:1.2}
.rc-body{padding:14px 16px 16px}
.rc-body p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:10px}
.rc-meta{display:flex;gap:6px;flex-wrap:wrap}
.meta-chip{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:100px;background:var(--accent);border:1px solid var(--ink-line);color:var(--ink-mid);font-family:'Inter'}
.meta-chip.hot{background:var(--gold-bg);border-color:var(--gold-line);color:#8a6200}
:root.dark .meta-chip.hot{color:#F2C14E}
.rc-count{font-size:11px;color:var(--ink-faint);margin-top:10px;font-weight:600}
.rc-count span{color:var(--brand);font-weight:700}

/* ── guide detail ── */
.guide-detail{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gd-role{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;padding:4px 10px;border-radius:100px;white-space:nowrap;font-family:'Inter'}
.gd-src{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;font-family:'Inter'}
.gd-src.zone{color:var(--brand-deep);background:var(--brand-bg)}
.gd-src.ri{color:#1c8a4d;background:rgba(28,138,77,.08)}
.gd-src.both{color:var(--teal);background:rgba(14,116,144,.08)}
.guide-detail h1{font-size:clamp(1.55rem,3vw,2rem);line-height:1.1;margin:6px 0 10px}
.gd-deadline{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-body);background:var(--accent);border:1px solid var(--ink-line);border-radius:8px;padding:7px 14px;margin-bottom:18px;font-family:'Inter'}
.gd-intro{font-size:15.5px;color:var(--ink-strong);line-height:1.75;margin-bottom:20px}
.gd-stat{display:flex;align-items:flex-start;gap:10px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.gd-stat .g-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.gd-stat p{font-size:14.5px;font-weight:500;line-height:1.65;margin:0;color:var(--ink)}
.gd-stat p span{color:var(--brand-deep);font-weight:700}
.callouts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.callout{border:1px solid var(--ink-line);border-left-width:3px;border-radius:10px;padding:13px 16px 13px 15px;background:var(--ink-line4)}
.callout p{font-size:14px;color:var(--ink-body);line-height:1.65;margin:0}
.co-head{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.co-head .co-ic{font-size:15px;flex-shrink:0;line-height:1}
.co-head b{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-family:'Inter'}
.callout--tip{border-color:var(--gold);background:var(--gold-bg)}
.callout--tip b{color:#B48600}
.callout--info{border-color:var(--teal);background:rgba(14,116,144,.05)}
.callout--info b{color:var(--teal)}
:root.dark .callout--tip b{color:#F2C14E}
:root.dark .callout--info b{color:#4CC1E0}

/* ── arcade stage ── */
.stage{background:var(--paper);border:1px solid var(--ink-line);border-radius:16px;padding:24px;box-shadow:var(--shadow-card);margin-bottom:14px}
@media(max-width:600px){.stage{padding:18px}}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.p-back{background:transparent;border:1px solid var(--ink-line);color:var(--ink-soft);border-radius:100px;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;font-family:'Inter'}
.p-back:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-bg)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:8px 16px;min-height:36px;border-radius:100px;border:1.5px solid var(--ink-line);background:var(--paper);cursor:pointer;color:var(--ink-mid);transition:all .15s;font-family:'Inter';display:inline-flex;align-items:center;justify-content:center}
.chip:hover{border-color:var(--brand);color:var(--brand-deep)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
:root.dark .chip.active{background:var(--brand);border-color:var(--brand)}
.chip:focus-visible,.q-opt:focus-visible,.btn:focus-visible,.deck-nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.deck-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.deck-count{font-size:12.5px;font-weight:700;color:var(--ink-mid)}
.deck-progress{height:6px;border-radius:6px;background:var(--ink-line4);overflow:hidden;margin-bottom:18px;border:1px solid var(--ink-line4)}
.deck-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));transition:width .25s;border-radius:6px}
.flash-card{background:var(--paper);border:1.5px solid var(--ink-line);border-radius:16px;min-height:220px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 26px;transition:border-color .2s,transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.flash-card:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow-card)}
.flash-card .f-cat{position:absolute;top:14px;left:16px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--brand-deep);background:var(--brand-bg);border:1px solid var(--brand-line);padding:4px 10px;border-radius:100px;font-family:'Inter'}
.flash-card .f-flip{position:absolute;bottom:12px;right:16px;font-size:11px;font-weight:600;color:var(--ink-faint);font-family:'Inter'}
.flash-card .f-q{font-family:'Poppins';font-weight:700;font-size:clamp(1.02rem,2vw,1.28rem);line-height:1.45;max-width:600px;color:var(--ink)}
.flash-card .f-a{font-size:1.02rem;font-weight:700;color:#1c8a4d;max-width:600px;line-height:1.5}
:root.dark .flash-card .f-a{color:#4ade80}
.flash-card .f-why{margin-top:10px;font-size:13px;color:var(--ink-soft);max-width:600px;line-height:1.6}
.deck-nav{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.deck-nav button{background:var(--ink);color:#fff;border:none;border-radius:100px;padding:12px 22px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,transform .15s;font-family:'Inter'}
.deck-nav button:hover{background:var(--brand-deep);transform:translateY(-1px)}
.deck-nav button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--ink-line)}
.deck-nav button.ghost:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-bg)}
.deck-nav button:disabled{opacity:.35;cursor:default;transform:none}
.kbd-hint{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:12px;font-family:'Inter'}
.kbd-hint kbd{background:var(--paper);border:1px solid var(--ink-line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:var(--mono);font-weight:700;font-size:10px;color:var(--ink-mid)}
/* quiz */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hud .hud-item{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink)}
.hud .hearts{font-size:15px;letter-spacing:2px}
.hud .hearts .lost{opacity:.18;filter:grayscale(1)}
.hud .streak{color:#8a6200;background:var(--gold-bg);border:1px solid var(--gold-line);padding:5px 12px;border-radius:100px;font-size:12px;font-family:'Inter'}
:root.dark .hud .streak{color:#F2C14E}
.hud .points{color:var(--brand-deep);font-size:14px}
.q-progress{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:6px;font-family:'Inter'}
.q-bar{height:6px;border-radius:6px;background:var(--ink-line4);overflow:hidden;margin-bottom:20px;border:1px solid var(--ink-line4)}
.q-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));transition:width .3s;border-radius:6px}
#qzQ h3,#spQ h3{font-size:clamp(1.08rem,2.2vw,1.32rem);margin-bottom:18px;line-height:1.45}
.q-opts{display:grid;gap:12px}
.q-opt{text-align:left;font-size:15px;font-weight:600;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink-line);border-radius:12px;padding:16px 18px;min-height:52px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;display:flex;align-items:center;gap:12px;font-family:'Inter';line-height:1.4}
.q-opt .letter{width:28px;height:28px;border-radius:50%;background:var(--accent);border:1px solid var(--ink-line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;transition:background .15s,border-color .15s,color .15s;font-family:'Poppins'}
.q-opt:hover{border-color:var(--brand);transform:translateY(-1px);background:var(--brand-bg)}
.q-opt.correct{border-color:#1c8a4d;background:rgba(28,138,77,.08)}
.q-opt.correct .letter{background:#1c8a4d;border-color:#1c8a4d;color:#fff}
.q-opt.wrong{border-color:#C0392B;background:rgba(192,57,43,.08);animation:shake .35s}
.q-opt.wrong .letter{background:#C0392B;border-color:#C0392B;color:#fff}
.q-opt:disabled{cursor:default;transform:none}

    $("spFb").className="q-feedback";$("spNext").classList.remove("show");
    $("spStreak").style.display=spStreak>0?"inline-flex":"none";$("spStreakN").textContent=spStreak;$("spPts").textContent=spPts+" pts";
    spLeft=6;$("spTimer").style.width="100%";$("spTimer").style.background="linear-gradient(90deg,#1c8a4d,var(--gold))";
    spTimer=setInterval(function(){
      spLeft-=0.1;var pct=Math.max(0,(spLeft/6)*100);$("spTimer").style.width=pct+"%";
      if(pct<30)$("spTimer").style.background="#C0392B"; else if(pct<55)$("spTimer").style.background="var(--gold)";
      if(spLeft<=0){clearInterval(spTimer);spAnswer(null)}
    },100);
  }
  function spAnswer(v){
    if(spTimer){clearInterval(spTimer)}
    var a=spQ[spIdx];
    var opts=$("spOpts").querySelectorAll(".q-opt");
    if(opts.length&&!opts[0].disabled){
      opts.forEach(function(o){o.disabled=true;if(o.dataset.v===a.full)o.classList.add("correct");if(o.dataset.v===v&&v!==a.full)o.classList.add("wrong")});
      var fb=$("spFb");
      if(v===a.full){spStreak++;spPts+=100+Math.min(spStreak-1,5)*20;fb.className="q-feedback show good";fb.querySelector("b").textContent=spStreak>1?"On fire! 🔥":"Fast and correct!";fb.querySelector("span").textContent=a.ab+" stands for "+a.full+"."}
      else{spStreak=0;spMissed.push(a);fb.className="q-feedback show bad";fb.querySelector("b").textContent=v?"Not quite.":"Time's up!";fb.querySelector("span").textContent=a.ab+" stands for "+a.full+"."}
      $("spStreak").style.display=spStreak>0?"inline-flex":"none";$("spStreakN").textContent=spStreak;$("spPts").textContent=spPts+" pts";
      $("spNext").classList.add("show");$("spNext").textContent=spIdx===spQ.length-1?"See your score →":"Next →";
    }
  }
  function spNext(){if(spIdx===spQ.length-1){spEnd()} else {spIdx++;spRender()}}
  function spEnd(){
    if(spTimer){clearInterval(spTimer)}
    $("spPlay").style.display="none";var res=$("spResult");res.classList.add("show");
    var ok=spQ.length-spMissed.length;var pct=ok/spQ.length;
    $("spScore").textContent=ok+"/"+spQ.length;
    var v=verdictFor(pct);v.t=pct===1?"Decoding Machine. 🏆":v.t;v.b=pct===1?"Every acronym, no hesitation. The quiz committee is calling you.":v.b;
    $("spVerdict").textContent=v.t;$("spBlurb").textContent=v.b;ringTo($("spRing"),pct);if(pct>=0.8)confettiBurst();
    $("spReview").innerHTML=spMissed.length?'<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:8px;font-family:Inter">Missed acronyms</div>'+spMissed.map(function(a){return '<div class="rv"><b>'+esc(a.ab)+'</b> · <span class="rv-a">'+esc(a.full)+'</span></div>'}).join(""):"";
  }
  function spStart(){spQ=shuffle(ACRO).slice(0,spTotal);spIdx=0;spPts=0;spStreak=0;spMissed=[];$("spSetup").style.display="none";$("spPlay").style.display="block";$("spResult").classList.remove("show");spRender()}
  window.initSprintStage=function(){
    if($("spSetup")) $("spSetup").style.display="block";
    if($("spPlay")) $("spPlay").style.display="none";
    if($("spResult")) $("spResult").classList.remove("show");
    var st=$("spStart"), opts=$("spOpts"), nxt=$("spNext"), ret=$("spRetry"), toS=$("spToStudy");
    if(st) st.onclick=spStart;
    if(opts) opts.onclick=function(e){var opt=e.target.closest(".q-opt");if(!opt) return;spAnswer(opt.dataset.v)};
    if(nxt) nxt.onclick=spNext;
    if(ret) ret.onclick=spStart;
    if(toS) toS.onclick=function(){currentGuide="study";currentView="guide";history.replaceState(null,"","#study");renderAll();closeSidebar()};
    window._rqSprint={answer:spAnswer,next:spNext,start:spStart};
  };
  // global keyboard
  document.addEventListener("keydown",function(e){
    // study
    if(currentGuide==="study"&&currentView==="guide"){
      if(e.key==="ArrowLeft"){e.preventDefault();if(window._rqDeck)window._rqDeck.nav(-1)}
      else if(e.key==="ArrowRight"){e.preventDefault();if(window._rqDeck)window._rqDeck.nav(1)}
      else if(e.code==="Space"){var ae=document.activeElement;if(ae&&ae.tagName==="INPUT") return;e.preventDefault();if(window._rqDeck)window._rqDeck.flip()}
    }
    if(currentGuide==="quiz"&&currentView==="guide"&&$("qzPlay")&&$("qzPlay").style.display==="block"){
      var qzOpts=$("qzOpts")&&$("qzOpts").querySelectorAll(".q-opt");
      if(qzOpts&&qzOpts.length&&!qzOpts[0].disabled){
        var idx=["1","2","3","4"].indexOf(e.key);
        if(idx>-1){e.preventDefault();if(window._rqQuiz)window._rqQuiz.pick(idx);return}
      }
      if(e.key==="Enter"&&$("qzNext")&&$("qzNext").classList.contains("show")){e.preventDefault();if(window._rqQuiz)window._rqQuiz.next()}
    }
    if(currentGuide==="sprint"&&currentView==="guide"&&$("spPlay")&&$("spPlay").style.display==="block"){
      var spOpts=$("spOpts")&&$("spOpts").querySelectorAll(".q-opt");
      if(spOpts&&spOpts.length&&!spOpts[0].disabled){
        var idx2=["1","2","3","4"].indexOf(e.key);
        if(idx2>-1){e.preventDefault();if(window._rqSprint)window._rqSprint.answer(spOpts[idx2].dataset.v);return}
      }
      if(e.key==="Enter"&&$("spNext")&&$("spNext").classList.contains("show")){e.preventDefault();if(window._rqSprint)window._rqSprint.next()}
    }
  });
  // initial render hook: after first script's renderAll, ensure deckCards length updates role-cards
  setTimeout(function(){
    if(typeof renderAll==="function"){
      // replace the earlier totalCards calc by re-rendering overview if we are on overview
      if(currentView==="overview"){renderAll()}
    }
  },0);
})();
</script>
<script>
// kickoff render after all defs
renderAll();
if(location.hash){var id=location.hash.slice(1);if(GUIDES.some(function(g){return g.id===id})){currentGuide=id;currentView="guide";renderAll()}}
</script>
