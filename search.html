<style>
  :root{--ink:#1B1836;--magenta:#E11A6E;--magenta-deep:#A80F52;--gold:#F2A900;--cream:#FFF8EF;--paper:#FFFDF9;--line:rgba(27,24,54,0.1);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{overflow-x:hidden;overflow-x:clip;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
  h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-0.02em;}
  a{color:inherit;text-decoration:none;} img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px; overflow-x:hidden;overflow-x:clip;} @media (max-width: 600px){ .wrap{padding:0 20px;} }
  .hero{padding-top:56px; padding-bottom:10px;}
  .eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta-deep);background:rgba(225,26,110,.09);padding:8px 16px;border-radius:100px;margin-bottom:22px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .hero h1{font-size:clamp(2rem,4.4vw,2.9rem);max-width:680px;}
  .hero p{color:rgba(27,24,54,.65);font-size:1.02rem;max-width:640px;margin-top:14px;line-height:1.6;}
  .searchbox{max-width:720px;position:relative;margin:34px 0 8px;}
  .searchbox input{width:100%;font-family:'Inter',sans-serif;font-size:1.05rem;padding:18px 56px 18px 24px;border-radius:100px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;transition:border-color .2s, box-shadow .2s;}
  .searchbox input:focus{border-color:var(--magenta);box-shadow:0 0 0 4px rgba(225,26,110,.12);}
  .searchbox svg{position:absolute;right:24px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:rgba(27,24,54,.45);pointer-events:none;}
  .s-meta{color:rgba(27,24,54,.45);font-size:.86rem;margin:12px 2px 30px;}
  .s-meta b{color:var(--magenta-deep);}
  section.results-group{margin-bottom:42px;}
  .rg-title{display:flex;align-items:baseline;gap:12px;font-size:1.12rem;margin-bottom:16px;}
  .rg-title .cnt{font-size:.8rem;font-weight:700;color:var(--magenta-deep);background:rgba(225,26,110,.09);padding:3px 10px;border-radius:100px;}
  .res-card{display:flex;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px;transition:border-color .18s, transform .18s;}
  .res-card:hover{border-color:var(--magenta);transform:translateY(-1px);}
  .res-ico{width:44px;height:44px;border-radius:12px;background:rgba(225,26,110,.09);color:var(--magenta-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Poppins',sans-serif;font-weight:800;font-size:.8rem;}
  .res-ico img{width:44px;height:44px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line);padding:5px;}
  .res-body{min-width:0;}
  .res-body h3{font-size:.98rem;line-height:1.3;margin-bottom:3px;}
  .res-body p{font-size:.84rem;color:rgba(27,24,54,.55);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .res-tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(27,24,54,.4);margin-bottom:4px;}
  .res-arrow{margin-left:auto;color:var(--magenta-deep);font-size:1.15rem;flex-shrink:0;opacity:.5;transition:opacity .18s;}
  .res-card:hover .res-arrow{opacity:1;}
  .empty{padding:90px 28px;text-align:center;color:rgba(27,24,54,.5);}
  .empty b{display:block;font-family:'Poppins';font-size:1.15rem;color:var(--ink);margin-bottom:8px;}
  .hint-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px;}
  .hint-tags button{font-size:.78rem;font-weight:700;padding:7px 14px;border-radius:100px;border:1.5px solid var(--line);background:#fff;color:rgba(27,24,54,.6);cursor:pointer;transition:all .15s;}
  .hint-tags button:hover{border-color:var(--magenta);color:var(--magenta-deep);}
  footer{border-top:1px solid var(--line);padding:36px 28px 48px;text-align:center;color:rgba(27,24,54,.45);font-size:.82rem;}
</style>

<body>
<div id="siteNav" data-current="resources" data-cta="join"></div>
<script src="site-nav.js" defer></script>
    <script src="site-transition.js" defer></script>
<header class="hero wrap">
  <span class="eyebrow"><span class="dot"></span>Search Zone 7</span>
  <h1>Find a club, a project, a guide</h1>
  <p>Search across all nine Zone 7 clubs, their service projects and resources, our guides and handbooks, and upcoming events across the Kathmandu Valley.</p>
  <div class="searchbox">
    <input id="q" type="search" placeholder="Try &quot;blood donation&quot;, &quot;Balkumari&quot;, &quot;quiz&quot;, &quot;grants&quot;..." autocomplete="off" autofocus>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </div>
  <p class="s-meta" id="meta">&nbsp;</p>
</header>

<main class="wrap" id="results" style="padding-bottom:70px;"></main>

<footer>&copy; 2026 Zone 7, Rotaract District 3292 Nepal-Bhutan.</footer>

<script>
(function(){
  var qEl = document.getElementById("q");
  var metaEl = document.getElementById("meta");
  var resultsEl = document.getElementById("results");
  var timer = null;
  var cached = { clubs: null, projects: null, guides: null, events: null };
  var loaded = false;

  function esc(s){ return typeof zone7Esc === "function" ? zone7Esc(s) : String(s == null ? "" : s); }
  function clubName(slug){ return (CLUB_DIRECTORY && CLUB_DIRECTORY[slug] ? CLUB_DIRECTORY[slug].name.replace(/^Rotaract Club of /i,"") : (slug||"")); }
  function shortName(slug){ return clubName(slug) || slug; }

  var STATIC_PAGES = [
    { t:"About Zone 7", d:"Who we are, our nine clubs, ZRR team and how we serve the Kathmandu Valley.", h:"/about", k:["about","zone 7","district","zrr","team","who"] },
    { t:"Join a Club", d:"Ready to serve? See how to become a member of a Zone 7 Rotaract club.", h:"/join", k:["join","member","membership","apply","form","become"] },
    { t:"Gallery", d:"Photos from service projects, blood drives, plantations and events across Zone 7.", h:"/gallery", k:["gallery","photos","pictures","album"] },
    { t:"Guides & Resources", d:"Club constitutions, bylaws, templates, funding guides and quiz materials.", h:"/guides", k:["guide","constitution","bylaw","template","funding","quiz","mou","agenda","attendance"] },
    { t:"Tutorials", d:"Step-by-step guides for meetings, board, assembly, ZRR, DRR and blood drive planning.", h:"/tutorials", k:["tutorial","meeting","board","assembly","zrr","drr","blood","training"] },
    { t:"Rota Quiz", d:"Practice the Rotary-Rotaract quiz with the full question bank and study materials.", h:"/rkt-quiz", k:["quiz","question","study","rotary","rotaract","practice"] },
    { t:"Handbook", d:"The Zone 7 club handbook - everything a club needs to run smoothly.", h:"/handbook", k:["handbook","manual","club"] },
    { t:"Handbook: Grants", d:"District fund (RDG) grant criteria, eligibility and application guidance.", h:"/handbook-grants", k:["grant","rdg","fund","funding","district fund","apply"] },
    { t:"Handbook: New Clubs", d:"How to charter and grow a new Rotaract club in District 3292.", h:"/handbook-newclub", k:["new club","charter","start","establish","formation"] },
    { t:"Handbook: Projects", d:"Project planning, execution and reporting for clubs.", h:"/handbook-projects", k:["project","planning","service","report"] },
    { t:"Handbook: Health", d:"Health and safety guidance for club activities and drives.", h:"/handbook-health", k:["health","safety","first aid","blood"] },
    { t:"Handbook: Twinship", d:"Twin club partnerships and international fellowship.", h:"/handbook-twinship", k:["twinship","twin","international","fellowship"] },
    { t:"Club Guides", d:"Tools and templates club leaders use for meetings, minutes and treasury.", h:"/club-guides", k:["club guide","minutes","treasury","secretary","treasurer"] },
    { t:"Club Tools", d:"Meeting minutes and treasury tools for club admins.", h:"/club-tools", k:["minutes","treasury","tool","secretary","treasurer","finance"] },
    { t:"Store", d:"Zone 7 merchandise and partner store.", h:"/store", k:["store","shop","merchandise","merch","buy"] },
    { t:"Meetings", d:"Meeting guides - moved to the Tutorials section.", h:"/meetings", k:["meeting","minutes","agenda"] }
  ];

  function norm(s){ return (s||"").toLowerCase().replace(/\s+/g," ").trim(); }
  function terms(q){ return norm(q).split(/\s+/).filter(Boolean); }

  function inStatic(q){
    var ts = terms(q);
    if(!ts.length) return [];
    return STATIC_PAGES.filter(function(p){
      var hay = norm(p.t + " " + p.d + " " + p.k.join(" "));
      return ts.every(function(t){ return hay.indexOf(t) > -1; });
    });
  }

  function projectFields(p){
    return norm([p.title, p.category, p.club_slug, (p.summary||""), (p.body||"")].join(" "));
  }
  function guideFields(g){
    return norm([g.title, g.description, g.category, (g.file_name||""), (g.tag||"")].join(" "));
  }
  function eventFields(e){
    return norm([e.title, e.description, e.location||""].join(" "));
  }

  function iconFor(what, item){
    if(what === "clubs" && item.logo) return '<img src="' + esc(zone7MediaPath(item.logo)) + '" alt="">';
    var map = { clubs:"CL", projects:"PR", guides:"GD", events:"EV", pages:"PG" };
    return (map[what]||"");
  }

  function renderRow(what, item){
    var href = item.h, tag = item.tag || "";
    if(what === "clubs"){ tag = "Club"; href = "/club?club=" + encodeURIComponent(item.slug); }
    else if(what === "projects"){ tag = (item.category||"Project"); href = "/project?club=" + encodeURIComponent(item.club_slug) + "&id=" + encodeURIComponent(item.id); }
    else if(what === "guides"){ tag = (item.category||item.tag||"Guide"); href = "/guides#" + encodeURIComponent(item.id); }
    else if(what === "events"){ tag = (item.event_date ? new Date(item.event_date).toLocaleDateString("en-US",{month:"short",day:"numeric"}) : "Event"); href = item.rsvp_link || "/#events"; }
    else if(what === "pages"){ tag = "Page"; }
    return '<a class="res-card" href="' + esc(href) + '">' +
      '<div class="res-ico">' + iconFor(what, item) + '</div>' +
      '<div class="res-body">' +
        '<div class="res-tag">' + esc(tag) + '</div>' +
        '<h3>' + esc(item.title) + '</h3>' +
        (item.d ? '<p>' + esc(item.d) + '</p>' : '') +
      '</div>' +
      '<div class="res-arrow">&rsaquo;</div></a>';
  }

  function groupTitle(name, arr){
    if(!arr.length) return "";
    return '<section class="results-group"><h2 class="rg-title">' + esc(name) + ' <span class="cnt">' + arr.length + '</span></h2>' + arr.map(function(r){ return renderRow(r.what, r.item); }).join("") + '</section>';
  }

  function emptyState(q){
    resultsEl.innerHTML = '<div class="empty"><b>No results for "' + esc(q) + '"</b>' +
      'Try a club name, a service area like "education" or "blood", or a resource like "grants" or "quiz".' +
      '<div class="hint-tags">' +
        ["blood donation","education","environment","quiz","grants","meetings","Balkumari","join"].map(function(t){ return '<button type="button" data-q="' + esc(t) + '">' + esc(t) + '</button>'; }).join("") +
      '</div></div>';
    resultsEl.querySelectorAll(".hint-tags button").forEach(function(b){ b.onclick = function(){ qEl.value = b.getAttribute("data-q"); run(); }; });
  }

  function run(){
    var q = qEl.value;
    var termsOk = terms(q);
    if(!termsOk.length){
      metaEl.innerHTML = "Type to search clubs, projects, guides, events and pages across Zone 7.";
      resultsEl.innerHTML = "";
      history.replaceState(null, "", "/search");
      return;
    }
    var url = "/search?q=" + encodeURIComponent(q.trim());
    history.replaceState(null, "", url);

    var out = [];

    if(cached.clubs){
      var clubs = Object.keys(CLUB_DIRECTORY || {}).filter(function(slug){
        var c = CLUB_DIRECTORY[slug];
        var hay = norm(c.name + " " + slug + " " + (c.ig||""));
        return termsOk.every(function(t){ return hay.indexOf(t) > -1; });
      }).map(function(slug){ return { what:"clubs", item: { slug:slug, title:CLUB_DIRECTORY[slug].name, d:"Rotaract club in the Kathmandu Valley.", logo:CLUB_DIRECTORY[slug].logo } }; });
      if(clubs.length) out.push({ label:"Clubs", rows:clubs });
    }
    if(cached.projects){
      var projects = cached.projects.filter(function(p){ return termsOk.every(function(t){ return projectFields(p).indexOf(t) > -1; }); })
        .slice(0, 20).map(function(p){ return { what:"projects", item: { title:p.title, d:(p.summary||p.category||""), club_slug:p.club_slug, category:p.category, id:p.id } }; });
      if(projects.length) out.push({ label:"Projects", rows:projects });
    }
    if(cached.guides){
      var guides = cached.guides.filter(function(g){ return termsOk.every(function(t){ return guideFields(g).indexOf(t) > -1; }); })
        .slice(0, 20).map(function(g){ return { what:"guides", item: { title:g.title, d:(g.description||""), category:g.category, tag:g.tag, id:g.id } }; });
      if(guides.length) out.push({ label:"Guides", rows:guides });
    }
    if(cached.events){
      var events = cached.events.filter(function(e){ return termsOk.every(function(t){ return eventFields(e).indexOf(t) > -1; }); })
        .slice(0, 20).map(function(e){ return { what:"events", item: { title:e.title, d:(e.description||""), event_date:e.event_date, rsvp_link:e.rsvp_link, id:e.id } }; });
      if(events.length) out.push({ label:"Events", rows:events });
    }
    var pages = inStatic(q);
    if(pages.length) out.push({ label:"Pages", rows: pages.map(function(p){ return { what:"pages", item: { title:p.t, d:p.d, h:p.h } }; }) });

    var total = out.reduce(function(s,g){ return s + g.rows.length; }, 0);

    if(!total){
      metaEl.innerHTML = "";
      emptyState(q);
      return;
    }

    metaEl.innerHTML = '<b>' + total + '</b> result' + (total===1?"":"s") + ' for &ldquo;' + esc(q.trim()) + '&rdquo;';

    var html = "";
    for (var gi = 0; gi < out.length; gi++){
      html += groupTitle(out[gi].label, out[gi].rows);
    }
    resultsEl.innerHTML = html || "";
  }

  qEl.addEventListener("input", function(){
    clearTimeout(timer);
    timer = setTimeout(run, 180);
  });

  function loadAll(){
    if(loaded) return;
    loaded = true;
    var db = (typeof ZONE7_DB !== "undefined") ? ZONE7_DB : null;
    var promises = [];

    cached.clubs = CLUB_DIRECTORY || {};
    if(db && db.getGuides){ promises.push(db.getGuides().then(function(rows){ cached.guides = rows || []; }).catch(function(){ cached.guides = []; })); }
    if(db && db.getEvents){ promises.push(db.getEvents().then(function(rows){ cached.events = rows || []; }).catch(function(){ cached.events = []; })); }
    if(db && db.getAllProjects){ promises.push(db.getAllProjects({ limit: 500 }).then(function(rows){ cached.projects = rows || []; }).catch(function(){ cached.projects = []; })); }

    Promise.all(promises).then(function(){ run(); }).catch(function(){ run(); });
  }

  var params = new URLSearchParams(location.search);
  var initial = params.get("q");
  function initSearch(){
    if(initial){ qEl.value = initial; }
    else { qEl.focus(); metaEl.innerHTML = "Type to search clubs, projects, guides, events and pages across Zone 7."; }
    loadAll();
  }
  if(document.readyState === "complete" || document.readyState === "interactive"){
    setTimeout(initSearch, 0);
  } else {
    document.addEventListener("DOMContentLoaded", initSearch);
  }
})();
</script>
</body>
</html>
