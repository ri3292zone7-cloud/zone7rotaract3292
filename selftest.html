<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>selftest-overflow</title>
<style>body{font-family:monospace;font-size:11px;background:#111;color:#eee;padding:10px}pre{white-space:pre-wrap}</style>
<script>document.documentElement.classList.add("pt-enter");try{var t=localStorage.getItem("z7-theme");if(!t){var h=localStorage.getItem("hb-theme");if(h==="dark"||h==="light"){localStorage.setItem("z7-theme",h);t=h}}if(t==="dark")document.documentElement.classList.add("dark")}catch(e){}document.documentElement.style.background=document.documentElement.classList.contains("dark")?"#0E0C1A":"#FFF8EF";</script>
  </head>
<body>
<pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const targets = [
    { p: "404.html", v: { w: 1360, h: 900 } },
    { p: "404.html", v: { w: 390, h: 844 } },
    { p: "project.html?club=sukedhara&id=sukedhara-library-2025", v: { w: 390, h: 844 } },
    { p: "club-tools.html", v: { w: 390, h: 844 } },
    { p: "gallery.html", v: { w: 1360, h: 900 } }
  ];
  const results = [];
  for (const t of targets) {
    await new Promise(res => {
      const ifr = document.createElement("iframe");
      ifr.style.width = t.v.w + "px"; ifr.style.height = t.v.h + "px"; ifr.style.border = "0";
      document.body.appendChild(ifr);
      ifr.onload = () => setTimeout(() => {
        try {
          const d = ifr.contentDocument;
          const el = d.documentElement;
          const lines = [];
          lines.push(`== ${t.p} @ ${t.v.w}x${t.v.h} | scrollW=${el.scrollWidth} clientW=${el.clientWidth}`);
          const all = d.querySelectorAll("*");
          for (const e of all) {
            const r = e.getBoundingClientRect();
            if (r.right > el.clientWidth + 2) {
              const cls = (e.className && e.className.toString ? e.className.toString() : "").slice(0, 60);
              lines.push(`  OVER <${e.tagName.toLowerCase()} class="${cls}" id="${e.id||""}"> right=${Math.round(r.right)}`);
            }
            if (r.left < -2) {
              const cls = (e.className && e.className.toString ? e.className.toString() : "").slice(0, 60);
              lines.push(`  UNDER <${e.tagName.toLowerCase()} class="${cls}" id="${e.id||""}"> left=${Math.round(r.left)}`);
            }
          }
          const brokenImgs = Array.from(d.images).filter(i => i.getAttribute("src") && i.getAttribute("src").endsWith("gallery.html")).map(i => {
            const p = i.parentElement;
            return "<" + (p ? p.tagName : "") + " class=" + (p && p.className ? p.className : "") + " src=" + i.getAttribute("src") + ">";
          });
          const backEl = d.querySelector("#siteNav .back");
          if (backEl) lines.push(`  .back display=${getComputedStyle(backEl).display}`);
          lines.push(`  gallerySrcImgs: ${JSON.stringify(brokenImgs.slice(0,2))}`);
          results.push(lines.join("\n"));
        } catch (e) { results.push(`[ERR] ${e.message}`); }
        ifr.remove(); res();
      }, 3000);
      ifr.src = "/" + t.p;
    });
    out.textContent = results.join("\n\n");
  }
  out.textContent = results.join("\n\n") + "\n\nDONE";
})();
</script>
<script src="site-transition.js" defer></script>
<style>/* Zone 7 night-mode pass */
html.dark{color-scheme:dark;--ink:#CBC9DE;--cream:#0E0C1A;--paper:#151327;--line:rgba(233,231,247,.14);--magenta:#E06093;--magenta-deep:#E11A6E;--gold:#D9A648}
html.dark body{background:var(--paper);color:var(--ink)}
html.dark input,html.dark select,html.dark textarea{background:#1C1A33;color:var(--ink);border:1px solid var(--line)}
html.dark ::placeholder{color:rgba(233,231,247,.45)}
</style>
</body>
</html>
