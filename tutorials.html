<script src="zone7-data.js"></script>
<style>
:root{
  --brand:#E11A6E;--brand-deep:#A80F52;--ink:#1B1836;--gold:#F2A900;--teal:#0E7490;
  --cream:#FAFAFA;--paper:#FFFDF9;--accent:#f5f5f5;--border:#e5e7eb;--border-muted:#f3f4f6;
  --pres:#E11A6E;--sec:#2563EB;--treas:#7C3AED;--vps:#0E7490;--vpp:#D97706;--secr:#059669;--serg:#6B21A8;--comms:#C2410C;--board:#1B1836;
  --ink-strong:rgba(27,24,54,.82);--ink-body:rgba(27,24,54,.78);--ink-soft:rgba(27,24,54,.68);
  --ink-mid:rgba(27,24,54,.55);--ink-dim:rgba(27,24,54,.45);--ink-faint:rgba(27,24,54,.4);
  --ink-line:rgba(27,24,54,.1);--ink-line2:rgba(27,24,54,.18);--ink-line3:rgba(27,24,54,.2);
  --ink-line4:rgba(27,24,54,.04);--shadow-card:0 4px 16px rgba(27,24,54,.06);
  --gold-bg:rgba(242,169,0,.05);--gold-line:rgba(242,169,0,.18);--gold-strong:rgba(242,169,0,.14);
  --brand-bg:rgba(225,26,110,.05);--brand-line:rgba(225,26,110,.22);
  --mono:ui-monospace,'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);scroll-behavior:smooth}
body{min-height:100vh}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;color:var(--ink)}
a{color:var(--brand-deep);text-decoration:none}a:hover{text-decoration:underline}
:root.dark{
  --ink:#E9E7F7;--ink-strong:rgba(233,231,247,.86);--ink-body:rgba(233,231,247,.8);--ink-soft:rgba(233,231,247,.68);
  --ink-mid:rgba(233,231,247,.56);--ink-dim:rgba(233,231,247,.42);--ink-faint:rgba(233,231,247,.35);
  --ink-line:rgba(233,231,247,.12);--ink-line2:rgba(233,231,247,.2);--ink-line3:rgba(233,231,247,.24);
  --ink-line4:rgba(233,231,247,.05);--shadow-card:0 4px 18px rgba(0,0,0,.4);
  --cream:#0B0A16;--paper:#151327;--accent:#1C1A33;--border:#282545;--border-muted:#1E1C37;
  --gold-bg:rgba(242,169,0,.12);--gold-line:rgba(242,169,0,.3);--gold-strong:rgba(242,169,0,.2);
  --brand-bg:rgba(225,26,110,.14);--brand-line:rgba(225,26,110,.4);
  --brand-deep:#f0488f;--board:#E9E7F7;
}

/* ── layout shell ── */
.app-layout{display:flex;flex:1;min-height:0}
.main-content{flex:1;min-width:0;display:flex;justify-content:flex-start;padding:0 48px}
.content-inner{width:100%;max-width:672px;padding:44px 0 100px}
@media(max-width:1024px){.content-inner{padding:36px 0 80px}.main-content{padding:0 28px}}
@media(max-width:800px){.main-content{padding:0 16px}.content-inner{padding:24px 0 60px}}

/* ── page toolbar (breadcrumb + actions) ── */
.page-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.pb-crumb{font-size:12.5px;color:var(--ink-dim);font-family:'Inter';font-weight:500;letter-spacing:.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pb-crumb b{color:var(--ink-soft);font-weight:600}
.pb-spacer{flex:1}
.tool-actions{display:flex;align-items:center;gap:8px}
.tool-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1px solid var(--ink-line);border-radius:7px;padding:6px 11px;cursor:pointer;font-family:'Inter';transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.tool-btn:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-bg)}
.tool-btn kbd{font-family:var(--mono);font-size:10px;background:var(--accent);border:1px solid var(--ink-line);border-radius:4px;padding:1px 5px;color:var(--ink-mid)}

/* ── sidebar ── */
.sidebar-wrap{width:300px;flex-shrink:0;position:sticky;top:72px;height:calc(100vh - 72px)}
.sidebar{width:100%;height:100%;background:var(--paper);border-right:1px solid var(--ink-line);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(27,24,54,.08) transparent;padding:24px 12px 24px 36px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(27,24,54,.1);border-radius:8px}
.toc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-mid);margin-bottom:16px;font-family:'Inter'}
.toc-links{display:flex;flex-direction:column;gap:4px}
.toc-link{font-size:13px;color:var(--ink-soft);text-decoration:none;padding:4px 0 4px 12px;border-left:2px solid transparent;transition:color .15s,border-color .15s;line-height:1.5}
.toc-link:hover{color:var(--ink);border-color:var(--brand);text-decoration:none}
.toc-link.active{color:var(--brand-deep);border-color:var(--brand)}
.sb-search{position:relative;margin-bottom:14px}
.sb-search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-faint);pointer-events:none}
.sb-search input{width:100%;height:34px;padding:0 34px 0 30px;border:1px solid var(--ink-line);border-radius:8px;font-size:14px;color:var(--ink);background:var(--paper);font-family:'Inter';transition:border-color .15s}
.sb-search input:focus{outline:none;border-color:var(--brand)}
.sb-search .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink-faint);font-family:var(--mono);pointer-events:none}
.sb-group{margin-bottom:4px}
.sb-group-head{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;margin:0 -12px;font-size:15px;font-weight:700;color:var(--ink);user-select:none;font-family:'Poppins'}
.sb-group-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-items-list{padding:2px 0 8px 0}
.sb-item{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;margin:0 -12px;border-radius:8px;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s;text-decoration:none;border:1px solid transparent}
.sb-item:hover{background:var(--brand-bg);color:var(--ink);text-decoration:none}
.sb-item.active{background:var(--brand-bg);color:var(--brand-deep);font-weight:600;border-color:var(--brand)}
.sb-item .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sb-footer{margin-top:auto;padding-top:20px;border-top:1px solid var(--ink-line);font-size:12px;color:var(--ink-mid)}

/* ── right TOC rail ── */
.right-rail{display:none;width:280px;flex-shrink:0}
@media(min-width:1536px){.right-rail{display:block;position:sticky;top:72px;height:calc(100vh - 72px);padding:40px 32px 40px 0;overflow-y:auto}}
@media(min-width:801px){html.has-subnav .sidebar-wrap{top:120px;height:calc(100vh - 120px)}}
@media(min-width:1536px){html.has-subnav .right-rail{top:120px;height:calc(100vh - 120px)}}
@media(min-width:801px){html.has-subnav [data-spy]{scroll-margin-top:132px}}

/* ── overview ── */
.overview-hero{margin-bottom:36px}
.overview-hero h1{font-size:clamp(1.6rem,3vw,2rem);line-height:1.1;margin-bottom:12px}
.overview-hero h1 em{font-style:normal;color:var(--brand)}
.overview-hero .page-desc{font-size:16px;color:var(--ink-body);line-height:1.7;max-width:560px}
.overview-hero .note{margin-top:16px;font-size:14px;color:var(--ink-soft);border-left:3px solid var(--gold);padding:12px 16px;background:var(--gold-bg);border-radius:0 8px 8px 0;line-height:1.6}
.role-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}
@media(max-width:640px){.role-cards{grid-template-columns:1fr}}
.role-card{background:var(--paper);border:1px solid var(--ink-line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.role-card:hover{border-color:var(--ink-line2);box-shadow:var(--shadow-card);text-decoration:none}
.role-card:hover .rc-body h3{color:var(--brand-deep)}
.rc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ink-line4)}
.rc-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:.95rem;flex-shrink:0}
.rc-head h3{font-size:15px;font-weight:700}
.rc-body{padding:12px 16px}
.rc-body p{font-size:13px;color:var(--ink-soft);line-height:1.55}
.rc-count{font-size:11px;color:var(--ink-faint);margin-top:8px;font-weight:600}
.rc-count span{color:var(--brand);font-weight:700}

/* ── guide detail ── */
.guide-detail{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gd-role{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;padding:4px 10px;border-radius:100px;white-space:nowrap;font-family:'Inter'}
.gd-src{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;font-family:'Inter'}
.gd-src.zone{color:var(--brand-deep);background:var(--brand-bg)}
.gd-src.ri{color:#1c8a4d;background:rgba(28,138,77,.08)}
.gd-src.both{color:var(--teal);background:rgba(14,116,144,.08)}
.guide-detail h1{font-size:clamp(1.5rem,3vw,2rem);line-height:1.1;margin:6px 0 10px}
.gd-deadline{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-body);background:var(--accent);border:1px solid var(--ink-line);border-radius:8px;padding:7px 14px;margin-bottom:20px;font-family:'Inter'}
.gd-intro{font-size:16px;color:var(--ink-strong);line-height:1.75;margin-bottom:24px}
.gd-stat{display:flex;align-items:flex-start;gap:10px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:14px 16px;margin-bottom:28px}
.gd-stat .g-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.gd-stat p{font-size:15px;font-weight:500;line-height:1.65;margin:0;color:var(--ink)}
.gd-stat p span{color:var(--brand-deep);font-weight:700}

/* ── callouts ── */
.callouts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.callout{border:1px solid var(--ink-line);border-left-width:3px;border-radius:10px;padding:13px 16px 13px 15px;background:var(--ink-line4)}
.callout p{font-size:14.5px;color:var(--ink-body);line-height:1.65;margin:0}
.co-head{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.co-head .co-ic{font-size:15px;flex-shrink:0;line-height:1}
.co-head b{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-family:'Inter'}
.callout--tip{border-color:var(--gold);background:var(--gold-bg)}
.callout--tip b{color:#B48600}
.callout--info{border-color:var(--teal);background:rgba(14,116,144,.05)}
.callout--info b{color:var(--teal)}
.callout--warning{border-color:#D97706;background:rgba(217,119,6,.06)}
.callout--warning b{color:#B45309}
.callout--danger{border-color:#DC2626;background:rgba(220,38,38,.06)}
.callout--danger b{color:var(--brand-deep)}
:root.dark .callout--tip b{color:#F2C14E}
:root.dark .callout--info b{color:#4CC1E0}
:root.dark .callout--warning b{color:#F2A900}
:root.dark .callout--danger b{color:#F0488F}

/* documentation prose: spacious reading rhythm */
.doc{margin-bottom:8px;counter-reset:doc-num}
.doc-sec{background:var(--paper);border:1px solid var(--ink-line);border-radius:14px;padding:28px 28px 24px;margin-bottom:16px;position:relative}
.doc-sec::before{counter-increment:doc-num;content:"Part " counter(doc-num,decimal-leading-zero);display:block;font-family:'Inter';font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-deep);margin-bottom:8px}
.doc-sec h3{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin:0 0 4px;max-width:60ch}
.doc-sec>p:first-of-type{margin:0}
.doc-sec>p:first-of-type em{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.doc-sec p{font-size:15.5px;color:var(--ink-body);line-height:1.8;margin:0 0 12px;max-width:68ch}
.doc-sec p:last-child{margin-bottom:0}
.doc-sec p b{color:var(--ink)}
.doc-sec p.intro{font-size:16px;line-height:1.8;color:var(--ink-strong);margin:12px 0 16px;padding-left:14px;border-left:3px solid var(--brand);max-width:68ch}
.doc-sec p:has(>b:only-child){font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:20px 0 4px}
.doc-sec p:has(>b:only-child) b{color:inherit;font-weight:800}
.doc-sec ul{list-style:none;margin:10px 0 6px;padding:0;display:flex;flex-direction:column;gap:10px;max-width:68ch}
.doc-sec li{position:relative;font-size:15.5px;color:var(--ink-body);line-height:1.7;padding-left:28px}
.doc-sec li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--brand)}
.doc-sec li b,.doc-sec li strong{color:var(--ink)}
@media(max-width:640px){.doc-sec{padding:22px 18px 20px}.doc-sec h3{font-size:18px}.doc-sec p{font-size:15px}.doc-sec p.intro{font-size:15.5px}}
.doc-sec table{width:100%;border-collapse:collapse;margin-top:12px;min-width:420px}
.doc-sec th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-mid);text-align:left;padding:9px 12px;border-bottom:1px solid var(--ink-line);background:var(--accent);font-family:'Inter';white-space:nowrap}
.doc-sec td{font-size:13.5px;color:var(--ink-body);padding:9px 12px;border-bottom:1px solid var(--ink-line4);vertical-align:top;line-height:1.55}
.doc-sec tr:last-child td{border-bottom:none}
.doc-sec tbody tr:nth-child(even){background:var(--ink-line4)}

/* ── spec (api) tables ── */
.spec{background:var(--paper);border:1px solid var(--ink-line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.spec-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--accent);border-bottom:1px solid var(--ink-line)}
.spec-head .spec-cap{font-size:13px;font-weight:700;color:var(--ink);font-family:'Poppins'}
.spec-head .spec-note{font-size:11px;color:var(--ink-dim);font-weight:600;font-family:'Inter'}
.spec-head .spec-tot{margin-left:auto;font-size:11px;font-weight:700;color:var(--brand-deep);font-family:var(--mono);background:var(--brand-bg);border:1px solid var(--brand-line);border-radius:100px;padding:3px 9px}
.spec-scroll{overflow-x:auto}
.spec table{width:100%;border-collapse:collapse;min-width:520px}
.spec th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-mid);text-align:left;padding:10px 14px;border-bottom:1px solid var(--ink-line);background:var(--paper);position:sticky;top:0;font-family:'Inter';white-space:nowrap}
.spec td{font-size:14px;color:var(--ink-body);padding:10px 14px;border-bottom:1px solid var(--ink-line4);vertical-align:top;line-height:1.55}
.spec tr:last-child td{border-bottom:none}
.spec tbody tr:nth-child(even){background:var(--ink-line4)}
.spec td.mono,.spec th.mono{font-family:var(--mono);font-size:12.5px}
.spec td.pts,.spec th.pts{text-align:right;white-space:nowrap;color:var(--brand-deep);font-weight:700;font-family:var(--mono)}
.spec tr:hover td{background:var(--brand-bg)}

/* ── tabs ── */
.tabs{background:var(--paper);border:1px solid var(--ink-line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.tab-bar{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--ink-line);overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-bar button{flex-shrink:0;font-size:13px;font-weight:700;color:var(--ink-mid);background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;font-family:'Inter';transition:color .15s,border-color .15s;border-radius:8px 8px 0 0}
.tab-bar button:hover{color:var(--ink)}
.tab-bar button.active{color:var(--brand-deep);border-color:var(--brand)}
.tab-bar button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.tab-panel{padding:16px 18px 18px}
.tab-pane{display:none}
.tab-pane.active{display:block;animation:fadeUp .2s ease}
.tab-pane p{font-size:14.5px;color:var(--ink-body);line-height:1.7;margin-bottom:10px}
.tab-pane ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tab-pane li{font-size:14.5px;color:var(--ink-body);line-height:1.6}

/* ── flow stepper ── */
.flow{background:var(--paper);border:1px solid var(--ink-line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.flow-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--accent);border-bottom:1px solid var(--ink-line)}
.flow-head .f-title{font-size:13px;font-weight:700;color:var(--ink);font-family:'Poppins'}
.flow-head .f-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-mid);font-family:var(--mono)}
.flow-track{display:flex;gap:0;padding:20px 18px 8px;overflow-x:auto;scrollbar-width:none}
.flow-track::-webkit-scrollbar{display:none}
.f-node{flex:1;min-width:88px;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;cursor:pointer;padding:0 4px;position:relative;font-family:'Inter'}
.f-node::before{content:"";position:absolute;top:13px;left:calc(-50% + 16px);right:calc(50% + 16px);height:2px;background:var(--ink-line);transition:background .2s}
.f-node:first-child::before{display:none}
.f-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink-dim);background:var(--accent);border:2px solid var(--ink-line);font-family:var(--mono);transition:all .2s;position:relative;z-index:1}
.f-node:hover .f-dot{border-color:var(--ink-line2)}
.f-node .f-lab{font-size:11.5px;font-weight:600;color:var(--ink-mid);text-align:center;line-height:1.3;transition:color .2s}
.f-node.active .f-dot{background:var(--brand);border-color:var(--brand);color:#fff}
.f-node.active::before{background:var(--brand)}
.f-node.active .f-lab{color:var(--brand-deep);font-weight:700}
.f-node.done .f-dot{background:rgba(28,138,77,.15);border-color:rgb(40,150,103);color:rgb(46,158,108)}
.f-node.done::before{background:rgb(46,158,108)}
.flow-body{padding:6px 18px 12px}
.flow-step{display:none}
.flow-step.active{display:block;animation:fadeUp .2s ease}
.flow-step h4{font-size:15px;font-weight:700;margin-bottom:6px;font-family:'Poppins'}
.flow-step p{font-size:14px;color:var(--ink-body);line-height:1.65}
.flow-nav{display:flex;align-items:center;gap:8px;padding:10px 18px 16px;border-top:1px solid var(--ink-line4);margin-top:6px}

<script>
const ROLES={
  meetings:{label:"Meetings",bg:"var(--pres)",icon:"🗓️"},
  board:{label:"Board",bg:"var(--board)",icon:"🪑"},
  assembly:{label:"Assembly",bg:"var(--vps)",icon:"🗳️"},
  zrr:{label:"ZRR",bg:"var(--comms)",icon:"🤝"},
  drr:{label:"DRR",bg:"var(--treas)",icon:"📋"},
  blood:{label:"Blood",bg:"#D32027",icon:"🩸"}
};

const GROUPS=[
  {id:"run",label:"Run the Club",icon:"🏛️",color:"var(--pres)",guides:["meetings","board","assembly"]},
  {id:"connect",label:"Zone, District & Service",icon:"🌐",color:"var(--vps)",guides:["zrr","drr","blood"]}
];

const GUIDES=[
  {id:"meetings",role:"meetings",source:"both",title:`Running General Meetings`,
   deadline:`Same day, same time, published: rhythm is everything`,
   intro:`Meeting quality is the first thing a visitor notices and the strongest predictor of club health. This tutorial covers the meeting types, the standard order of business, motions and voting, attendance records, minutes and how to host guests so members and visitors both leave wanting more.`,
   callouts:[{type:"info",icon:"📚",title:"Sources for this tutorial",body:`Meeting rules and quorum come from the <a href="media/guides/Standard-Rotaract-Club-Constitution.docx">Standard Rotaract Club Constitution</a> and the <a href="media/guides/662_rotaract_club_recommended_bylaws_en.docx">Recommended Club Bylaws</a>. The sample <a href="media/guides/Sample-Agenda-Paper.doc">Agenda Paper</a> and <a href="media/guides/Sample-GM-attendance-sheet.docx">attendance sheet</a> are the formats most Zone 7 clubs use; the minute-recording format follows the District 3292 Directory's general meeting minute sample.`}],
   docs:[{h:`Which Meeting, When`,p:`<p><em>General, board and special meetings, each with a job</em></p><p class="intro">Rotaract clubs run on a few distinct meeting types. Knowing which one you are in keeps expectations honest: a general meeting is not a board meeting, and neither is a planning session pretending to be one. Typical patterns below; your constitution sets the exact frequency and notice rules.</p>
      <table class="type-table">
        <thead><tr><th>Meeting</th><th>Who attends</th><th>Typical rhythm</th><th>Main job</th></tr></thead>
        <tbody>
          <tr><td>General meeting</td><td>All members</td><td>Weekly or bi-weekly</td><td>Club business, updates, programs and fellowship</td></tr>
          <tr><td>Board meeting</td><td>Officers + directors</td><td>Monthly</td><td>Set direction, review projects and finances, prepare the general meeting</td></tr>
          <tr><td>Club assembly</td><td>All members</td><td>Quarterly or as planned</td><td>Planning, education and two-way discussion, no formal motions</td></tr>
          <tr><td>Special meeting</td><td>Members as announced</td><td>As needed, with proper notice</td><td>Urgent or specific business that cannot wait</td></tr>
          <tr><td>Annual meeting</td><td>All members</td><td>Once a year</td><td>Officer elections and year-end reporting</td></tr>
        </tbody>
      </table><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>A <span>fixed meeting rhythm</span> (same day, same time, published) is the single strongest predictor of good attendance across Zone 7 clubs.</p></div><p><b>Key points</b></p><ul><li>Publish the year's meeting calendar before July so members can plan around it</li><li>Confirm quorum before opening; most constitutions require a majority of members in good standing</li><li>Send the notice and agenda in advance; special meetings need the notice period your constitution specifies</li><li>Respect the clock: start on time even if latecomers arrive, and end on time out of respect for members' study and work</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Standard-Rotaract-Club-Constitution.docx" target="_blank" rel="noopener">↗ Standard Rotaract Club Constitution</a><a href="media/guides/662_rotaract_club_recommended_bylaws_en.docx" target="_blank" rel="noopener">↗ Recommended Club Bylaws</a></div>`}, {h:`The Agenda: A Meeting's Backbone`,p:`<p><em>Same order every time, so nothing gets missed</em></p><p class="intro">A predictable order of business is what separates a meeting from a chat. When members can anticipate what comes next, they prepare, they speak up, and the meeting moves. This is the classic order used by Rotaract clubs across the zone; adapt the format from the Sample Agenda Paper in the guides folder.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Call to order</h5><p>The chair confirms quorum and opens the meeting.</p></li>
        <li><span class="num">2</span><h5>Approval of minutes</h5><p>Members read (or recall) and approve the previous minutes.</p></li>
        <li><span class="num">3</span><h5>Officer reports</h5><p>President, secretary and treasurer give short, numbered updates.</p></li>
        <li><span class="num">4</span><h5>Committee updates</h5><p>Project chairs report progress, needs and next steps.</p></li>
        <li><span class="num">5</span><h5>Unfinished business</h5><p>Items carried over from the last meeting get resolved first.</p></li>
        <li><span class="num">6</span><h5>New business</h5><p>Fresh proposals, requests and motions are introduced and decided.</p></li>
        <li><span class="num">7</span><h5>Announcements &amp; close</h5><p>Next meeting date, reminders, then adjournment.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Meetings that <span>send the agenda 24 hours ahead</span> run measurably shorter; members arrive decided instead of deciding on the spot.</p></div><p><b>Key points</b></p><ul><li>Build the agenda from the previous minutes: unfinished business first, then officer and committee reports</li><li>Put time slots next to items, and hold the chair to them</li><li>Name an owner for every agenda item; no owner, no item</li><li>Keep the agenda in the same format every week so members can scan it in seconds</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-Agenda-Paper.doc" target="_blank" rel="noopener">↗ Sample Agenda Paper (guides folder)</a></div>`}, {h:`Motions, Debate &amp; Voting`,p:`<p><em>How a group actually decides things</em></p><p class="intro">Decisions get made by motion: a formal proposal that members can discuss and vote on. It sounds heavy, but the rhythm is simple and it protects the club from decisions that only the loudest voices wanted.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Move</h5><p>A member states the proposal clearly: "I move that..."</p></li>
        <li><span class="num">2</span><h5>Second</h5><p>Another member seconds it, showing at least two people want it discussed.</p></li>
        <li><span class="num">3</span><h5>Debate</h5><p>Members discuss; the mover speaks first, the chair keeps it fair and on-topic.</p></li>
        <li><span class="num">4</span><h5>Amend (optional)</h5><p>The proposal can be adjusted before voting, if a member moves an amendment.</p></li>
        <li><span class="num">5</span><h5>Vote</h5><p>For ordinary business the vote must be decided by a majority of those present; your constitution sets the bar for bigger items like dues or bylaw changes.</p></li>
        <li><span class="num">6</span><h5>Record</h5><p>The secretary notes the exact motion, who moved it, and the outcome.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>vote on every funded proposal</span> rarely fight about money later; the decision and its reasoning are on the record.</p></div><p><b>Key points</b></p><ul><li>One person, one topic at a time; the chair enforces this gently but consistently</li><li>Restate the motion before the vote so everyone votes on the same words</li><li>Record motions verbatim in the minutes, including the outcome and any amendments</li><li>For close or sensitive votes, count hands rather than deciding by eye</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Standard-Rotaract-Club-Constitution.docx" target="_blank" rel="noopener">↗ Standard Rotaract Club Constitution: voting</a></div>`}, {h:`Attendance That Means Something`,p:`<p><em>The sheet is a record, the follow-up is the point</em></p><p class="intro">Attendance tracking exists for three reasons: quorum (knowing a decision is valid), recognition (knowing who shows up), and care (knowing who stopped showing up). A simple sign-in sheet covers all three, provided someone actually follows up.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>A <span>personal follow-up message to absent members</span> within 48 hours brings many of them back; silence loses them quietly.</p></div><p><b>Key points</b></p><ul><li>Pass a printed sign-in sheet at every meeting; members, guests, visiting Rotaractors and alumni all sign it</li><li>Track attendance against the constitution's requirements, and keep the records year-round, not just for elections</li><li>Review attendance trends at board meetings monthly, not at year-end when it is too late</li><li>Reach out personally after two consecutive absences; usually life got busy, and a message is all it takes</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-GM-attendance-sheet.docx" target="_blank" rel="noopener">↗ Sample GM Attendance Sheet (guides folder)</a></div>`}, {h:`Minutes &amp; Meeting Reports`,p:`<p><em>If it is not written down, it did not happen</em></p><p class="intro">Minutes are the club's institutional memory, what the next board (and next year's board) will rely on. The District 3292 Directory prints a general meeting minute sample; good minutes record decisions and owners, not a transcript of every sentence.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Minutes approved at the <span>next meeting within 14 days</span> keep clubs honest; minutes that take two months to appear keep nothing.</p></div><p><b>Key points</b></p><ul><li>Record: type of meeting, date, time, place, presiding officer, members and guests present</li><li>Record every motion exactly as moved, who moved it, and the vote outcome, plus action items with named owners and deadlines</li><li>Keep minutes and financial records on a shared drive, not one person's device</li><li>Approve minutes at the next meeting, then file them, and report club activity to the district as your district requires</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="/admin" target="_blank" rel="noopener">↗ Club Admin: minutes &amp; treasury</a><a href="/club-guides" target="_blank" rel="noopener">↗ Guides for Clubs: minutes &amp; records</a></div>`}, {h:`Hosting Great Guests &amp; Visitors`,p:`<p><em>Visiting Rotaractors, alumni and Rotary guests are the club's PR</em></p><p class="intro">A general meeting is also the front door of your club. When a visiting Rotaractor, a past president or a Rotarian walks in, how you receive them decides whether they come back, and what they tell everyone else about your club.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Greet at the door</h5><p>Assign a welcome officer before every meeting, someone who knows names and seats people comfortably.</p></li>
        <li><span class="num">2</span><h5>Introduce them early</h5><p>Guest introductions go on the agenda right after the call to order, so visitors feel seen from minute one.</p></li>
        <li><span class="num">3</span><h5>Offer a program slot</h5><p>Visiting Rotaractors often love a 5-minute slot to share their club's work; it doubles as your program.</p></li>
        <li><span class="num">4</span><h5>Sign them in</h5><p>Guests and visiting Rotaractors sign the same attendance sheet; it keeps your records accurate for district reporting.</p></li>
        <li><span class="num">5</span><h5>Follow up after</h5><p>A thank-you message within 48 hours turns a one-time visitor into a friend of the club.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>always have a guest on the agenda</span> grow by invitation; every visitor is a future member, speaker or partner.</p></div><p><b>Key points</b></p><ul><li>Fix a welcome officer roster before the year starts</li><li>Always include a guest introductions line on the agenda</li><li>Keep a guest book alongside the attendance sheet</li><li>Send a personal thank-you to every guest within 48 hours</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}],
   videos:[{id:"tMVYs9azy3M",title:`How to Run a Rotary Club Meeting Effectively`,desc:`A practical walkthrough of making any club meeting interesting and engaging; the structure transfers directly to Rotaract.`}, {id:"ZJm-itrb3u8",title:`Rotaract Training Videos: Episode 12`,desc:`Rotary International's official Rotaract training series covering officer roles, meetings and club operations.`}],
   links:[{label:`Standard Rotaract Club Constitution`,url:`media/guides/Standard-Rotaract-Club-Constitution.docx`}, {label:`Recommended Club Bylaws`,url:`media/guides/662_rotaract_club_recommended_bylaws_en.docx`}, {label:`Sample Agenda Paper (guides folder)`,url:`media/guides/Sample-Agenda-Paper.doc`}, {label:`Sample GM Attendance Sheet (guides folder)`,url:`media/guides/Sample-GM-attendance-sheet.docx`}, {label:`Club Admin: minutes &amp; treasury`,url:`/admin`}, {label:`Guides for Clubs: minutes &amp; records`,url:`/club-guides`}]},

  {id:"board",role:"board",source:"both",title:`Running Board Meetings`,
   deadline:`Monthly board, clear decisions, written minutes`,
   intro:`How a five-position board keeps the club moving between general meetings: roles, monthly rhythm, quorum, money and a clean handover.`,
   callouts:[{type:"info",icon:"📚",title:"Sources for this tutorial",body:`Officer roles and quorum come from the <a href="media/guides/Standard-Rotaract-Club-Constitution.docx">Standard Rotaract Club Constitution</a> and the <a href="media/guides/662_rotaract_club_recommended_bylaws_en.docx">Recommended Club Bylaws</a>; the treasury and handover practices follow what Zone 7 clubs with strong boards do. Source documents are listed under each section below.`}],
   docs:[{h:`Your Board: The Seats`,p:`<p><em>Six positions, one shared responsibility</em></p><p class="intro">Every board meeting starts with people knowing their job. The board runs the club between general meetings, and each seat has a specific responsibility; when one is unclear, the meeting is where it shows. These are the core roles from the standard Rotaract structure; your constitution names the exact titles and terms.</p>
      <table class="type-table">
        <thead><tr><th>Seat</th><th>Focus</th><th>Core duties</th></tr></thead>
        <tbody>
          <tr><td>President</td><td>Steers the year</td><td>Chairs board and general meetings; sets the annual vision and goals with the board; represents the club to the district and sponsor Rotary club</td></tr>
          <tr><td>President-Elect</td><td>Prepares the next year</td><td>Shadows the president throughout the year; plans next year's officer team and calendar; chairs planning committees and transition meetings</td></tr>
          <tr><td>Vice President</td><td>Steps in, steps up</td><td>Chairs meetings when the president is absent; coordinates service programs and projects; works with committee chairs to keep plans moving</td></tr>
          <tr><td>Secretary</td><td>Memory of the club</td><td>Records minutes and keeps membership records; sends meeting notices, agendas and follow-ups; handles official correspondence and reports</td></tr>
          <tr><td>Treasurer</td><td>Owns the numbers</td><td>Collects dues and keeps the accounts; reports finances at every board meeting; prepares the budget with the president</td></tr>
          <tr><td>Directors</td><td>Run the committees</td><td>Lead service, club service, public image and membership work; report committee progress at board meetings; turn board decisions into member action</td></tr>
        </tbody>
      </table><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Boards that <span>open every meeting with a 60-second round</span> (each officer's top item) finish their agenda in half the time.</p></div><p><b>Key points</b></p><ul><li>Hold a board orientation in the first month of the year; walk every officer through their role and the agenda format</li><li>Keep one shared calendar of board meetings, general meetings and deadlines that every officer can see</li><li>Send the board a short pack 48 hours before each board meeting: agenda, previous minutes, treasurer report</li><li>Review the constitution's officer duties once at the start of the year so everyone works from the same document</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Standard-Rotaract-Club-Constitution.docx" target="_blank" rel="noopener">↗ Standard Rotaract Club Constitution</a><a href="media/guides/662_rotaract_club_recommended_bylaws_en.docx" target="_blank" rel="noopener">↗ Recommended Club Bylaws</a></div>`}, {h:`The Monthly Rhythm`,p:`<p><em>Same cadence, every month, all year</em></p><p class="intro">Most clubs hold board meetings monthly, roughly a week before the first general meeting of the month, so board decisions have time to reach members. A predictable flow keeps the meeting under an hour and the club moving.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Send the pack 48 hours out</h5><p>Agenda, previous minutes, treasurer report and any proposals go to every officer in advance, no surprises at the table.</p></li>
        <li><span class="num">2</span><h5>Call to order &amp; quorum</h5><p>The chair confirms the required number of officers is present before anything is decided.</p></li>
        <li><span class="num">3</span><h5>Approve previous minutes</h5><p>Corrections get made, then the minutes are approved and filed.</p></li>
        <li><span class="num">4</span><h5>Treasurer's report</h5><p>Finances come early: balance, dues, spending since the last meeting.</p></li>
        <li><span class="num">5</span><h5>President's update</h5><p>Vision, district news, sponsor Rotary club relationships, upcoming deadlines.</p></li>
        <li><span class="num">6</span><h5>Committee reports</h5><p>Service, club service, public image and membership chairs report progress and needs.</p></li>
        <li><span class="num">7</span><h5>Decisions &amp; approvals</h5><p>Projects, budgets and proposals get voted on, and recorded with owners.</p></li>
        <li><span class="num">8</span><h5>Plan the next general meeting</h5><p>Set the agenda, assign the welcome officer, agree the program slot and announcements.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>A <span>fixed monthly date</span> (announced at the start of the year) turns board attendance into a habit instead of a negotiation.</p></div><p><b>Key points</b></p><ul><li>Fix the board meeting date for the whole year and publish it with the general meeting calendar</li><li>Never decide anything at a board meeting that was not on the agenda; park it for the next meeting or a special session</li><li>Keep board meetings under 90 minutes; if it runs over twice in a row, the agenda is too big</li><li>Minutes go to all officers within 48 hours, while the decisions are still fresh</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-Agenda-Paper.doc" target="_blank" rel="noopener">↗ Sample Agenda Paper (guides folder)</a></div>`}, {h:`Quorum &amp; Voting Rules`,p:`<p><em>A decision is only valid if the board is properly constituted</em></p><p class="intro">Quorum is the minimum number of officers who must be present for decisions to be valid. Rules differ between meeting types; check your constitution, but the common pattern across clubs looks like this.</p>
      <table class="type-table">
        <thead><tr><th>Meeting</th><th>Quorum</th><th>How decisions pass</th></tr></thead>
        <tbody>
          <tr><td>Board meeting</td><td>Majority of officers, commonly 4, including the president or vice president</td><td>Majority of those present and voting</td></tr>
          <tr><td>General meeting</td><td>Majority of members in good standing</td><td>Majority of members present and voting</td></tr>
          <tr><td>Special meeting</td><td>As your constitution specifies for that business</td><td>Majority present unless the constitution says otherwise</td></tr>
          <tr><td>Bylaw changes &amp; big items</td><td>Full quorum as for a general meeting</td><td>Often two-thirds or as your constitution requires</td></tr>
        </tbody>
      </table>
      <p class="intro">If quorum is missing, the meeting can still run as discussion, but no binding decisions. Record the quorum count in the minutes; it is what makes a decision defensible later.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>The most common board quorum mistake is <span>voting without counting</span>; count heads before you decide, and say the count out loud.</p></div><p><b>Key points</b></p><ul><li>Check the quorum number in your constitution at the start of the year and write it inside every board meeting pack</li><li>If quorum fails, hold discussion only, and state in the minutes that no decisions were taken</li><li>Record the number present, the vote count and abstentions for every motion</li><li>The chair votes too, unless your constitution says otherwise, and the chair's tie-break rule is usually written down</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Standard-Rotaract-Club-Constitution.docx" target="_blank" rel="noopener">↗ Standard Rotaract Club Constitution: quorum</a></div>`}, {h:`Money: Budget &amp; Treasurer`,p:`<p><em>Own the numbers or the numbers own you</em></p><p class="intro">The treasurer's job is not collecting money; it is keeping the club's finances so clear that anyone could follow them. The board's job is to know the numbers every month, not at the end of the year.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Approve a budget before July</h5><p>Income (dues, fundraising, grants) against planned spending, voted by the board and shared with members.</p></li>
        <li><span class="num">2</span><h5>Collect and record dues</h5><p>Dues go through the treasurer with receipts; in many constitutions a member is only in good standing when dues are settled.</p></li>
        <li><span class="num">3</span><h5>Set an approval threshold</h5><p>Small expenses need one officer's sign-off; bigger ones need board approval. Write the limits down.</p></li>
        <li><span class="num">4</span><h5>Report every month</h5><p>A one-page report: opening balance, income, spending, remaining budget per project.</p></li>
        <li><span class="num">5</span><h5>Close the year clean</h5><p>Final accounts, handover of records and bank access to the next treasurer, nothing personal, all on the club drive.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>review finances at every board meeting</span> never discover a problem at the year-end meeting, when it is too late to fix.</p></div><p><b>Key points</b></p><ul><li>Two signatories on the club account, never one person alone</li><li>Receipts for every expense, filed on the shared drive within a week</li><li>Treasurer report at every board meeting, even if nothing moved</li><li>Annual accounts presented to the general meeting before the year closes</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Standard-Rotaract-Club-Constitution.docx" target="_blank" rel="noopener">↗ Standard Rotaract Club Constitution: dues &amp; finance</a><a href="media/guides/statement-of-policy.docx" target="_blank" rel="noopener">↗ Statement of Policy</a></div>`}, {h:`Decisions Between Meetings`,p:`<p><em>Small team, fast calls, clear records</em></p><p class="intro">The club cannot wait a month for every decision. The art is delegating the small things so the board only spends its meeting time on what truly needs the room.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Delegate to committee chairs</h5><p>Service, membership and PR chairs get authority over their committee's routine work, with a spending limit.</p></li>
        <li><span class="num">2</span><h5>Define the emergency lane</h5><p>Urgent calls (venue changes, last-minute approvals) go to the president and treasurer together, then to the board at the next meeting.</p></li>
        <li><span class="num">3</span><h5>Communicate the same day</h5><p>Board decisions reach members through the secretary's message; decisions made in private stay in private if no one shares them.</p></li>
        <li><span class="num">4</span><h5>Log everything</h5><p>Off-meeting approvals are recorded as a one-line addendum to the next board minutes, so the record stays complete.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Zone 7 clubs that <span>publish board decisions in the same week</span> have notably calmer general meetings; members trust a board that reports.</p></div><p><b>Key points</b></p><ul><li>Write the delegation list and spending limits down at the start of the year</li><li>Decide who covers for each officer during exams and holidays</li><li>Keep a running decision log on the shared drive, updated within 24 hours</li><li>Review the log at each board meeting; ratify, adjust or reverse</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`Transition &amp; Handover`,p:`<p><em>The year ends, the club continues</em></p><p class="intro">A Rotaract club's real test is whether it survives its own leadership change. The president-elect shadows all year, and the handover is a document trail, not a conversation.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Shadow all year</h5><p>The president-elect attends every board meeting, learns the rhythm and takes over the planning calendar.</p></li>
        <li><span class="num">2</span><h5>Run the transition meeting</h5><p>Old and new boards meet once before the handover: projects, finances, contacts, lessons, mistakes.</p></li>
        <li><span class="num">3</span><h5>Hand over the files</h5><p>Minutes, finances, the decision log, committee files and the constitution all move to the shared drive, organised and current.</p></li>
        <li><span class="num">4</span><h5>Orient the new board</h5><p>The new board runs through roles, the agenda format, the calendar and the district reporting cycle in its first week.</p></li>
        <li><span class="num">5</span><h5>Stay reachable</h5><p>Past officers remain advisors for the first quarter; the club keeps their knowledge, not just their title.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>hand over in writing</span> start the next year with momentum; clubs that hand over in conversation start it from zero.</p></div><p><b>Key points</b></p><ul><li>Book the transition meeting before the handover, in writing, both boards invited</li><li>Hand over bank access and signatories on day one, not month three</li><li>The president-elect publishes next year's calendar before the handover ceremony</li><li>Archive last year's files as read-only so records survive the year end</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Effective-Planning-Guide-to-Clubs.docx" target="_blank" rel="noopener">↗ Effective Planning Guide to Clubs</a></div>`}],
   videos:[{id:"A3Jeki3peds",title:`Club Leadership Team Workshop`,desc:`Rotary 5360's recorded leadership team workshop on how officers divide responsibility and lead together. The board structure transfers directly to Rotaract.`}, {id:"P-dcBS_6gMc",title:`How to Organize a Rotaract Club`,desc:`Rotary District 7910's advisor training seminar covering the building blocks of a well-organized club, from founding team to operating rhythm.`}],
