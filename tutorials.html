  {id:"assembly",role:"assembly",source:"both",title:`Club Assemblies`,
   deadline:`The club plans together, quarterly`,
   intro:`The full membership meets as a body to plan the year, elect officers and approve the big calls. Plan it, run it, record it.`,
   callouts:[{type:"info",icon:"📚",title:"Sources for this tutorial",body:`The statutory June or July and January assembly sessions, the governing agenda and the quorum rules come from the <a href="media/guides/Standard-Rotaract-Club-Constitution.docx">Standard Rotaract Club Constitution</a>; the agenda and minutes format follow what Zone 7 clubs and the District 3292 Directory's minute samples use. Source documents are listed under each section below.`}],
   docs:[{h:`What an Assembly Actually Is`,p:`<p><em>The full membership, sitting as a body</em></p><p class="intro">The club assembly is the meeting of the whole membership, and in most Rotaract structures it is the club's governing voice: it elects officers, sets the budget and the annual plan, and approves the big decisions the board proposes. In many constitutions it is also where the year's programme is presented to the members for approval.</p>
      <table class="type-table">
        <thead><tr><th>Type</th><th>When</th><th>What it does</th></tr></thead>
        <tbody>
          <tr><td>Regular assembly</td><td>Set by the club calendar, commonly twice a year</td><td>Serves as the governing meeting: programme planning, elections, budget, major proposals</td></tr>
          <tr><td>Statutory assembly</td><td>June or July, then again around January</td><td>The two required governance meetings of the year; elections and the annual plan usually happen here</td></tr>
          <tr><td>Special assembly</td><td>As constitution rule or officer call</td><td>Called by the president or a petition of members for a specific item</td></tr>
        </tbody>
      </table>
      <p class="intro">The assembly is not the general meeting; the general meeting is the club's regular weekly or monthly rhythm, while the assembly gathers members for governance. The general meeting is where the club runs; the assembly is where it decides.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Members who <span>see their vote in the record</span> at the next assembly keep coming; members who never see the outcome stop coming.</p></div><p><b>Key points</b></p><ul><li>Check your constitution for how many assemblies are required each year and hold at least that many</li><li>Publish the assembly date at least two weeks ahead with the agenda attached</li><li>Invite the sponsor Rotary club and the ZRR or DRR when the program allows; they attend by invitation</li><li>Hold elections at the assembly your constitution designates, usually the June and July session</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Standard-Rotaract-Club-Constitution.docx" target="_blank" rel="noopener">↗ Standard Rotaract Club Constitution: assemblies</a><a href="media/guides/662_rotaract_club_recommended_bylaws_en.docx" target="_blank" rel="noopener">↗ Recommended Club Bylaws</a></div>`}, {h:`Building the Agenda`,p:`<p><em>The order of business that makes or breaks the room</em></p><p class="intro">A statutory assembly fails when it wanders; it succeeds when the agenda is a tight, published order. The standard sequence, used across clubs and mirrored in the Directory's assembly minutes, is deliberately short.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Call to order and quorum</h5><p>The chair confirms members in good standing present; the count is recorded before business begins.</p></li>
        <li><span class="num">2</span><h5>Adoption of the agenda</h5><p>Members approve the agenda itself, or amend it, before it binds the meeting.</p></li>
        <li><span class="num">3</span><h5>Approval of previous minutes</h5><p>Minutes of the last assembly are read, corrected and approved.</p></li>
        <li><span class="num">4</span><h5>Reports</h5><p>President, treasurer, committees: progress, money, membership, service.</p></li>
        <li><span class="num">5</span><h5>Programme and plan</h5><p>Next year's goals, activities and the budget are presented to members for approval.</p></li>
        <li><span class="num">6</span><h5>Elections (when due)</h5><p>Officers are elected per the constitution, recorded with vote counts.</p></li>
        <li><span class="num">7</span><h5>Ratify the calendar</h5><p>The year's assembly, board and general meeting dates get the members' blessing.</p></li>
        <li><span class="num">8</span><h5>Announcements</h5><p>District events, dues deadlines, visit schedules, service opportunities.</p></li>
        <li><span class="num">9</span><h5>Adjournment</h5><p>A firm close, with the next meeting date stated.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Assemblies that <span>print the agenda</span> and read it verbatim take 30 minutes; assemblies that improvise take a day.</p></div><p><b>Key points</b></p><ul><li>Send the agenda with the notice, two weeks out, so members arrive already decided</li><li>Put reports in writing before the meeting; the room decides on what they have read, not on what they hear</li><li>Keep elections on a fixed agenda line with a stated order: nominations, speeches, ballot, result</li><li>State the next assembly date in the final agenda line and record it in the minutes</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-Agenda-Paper.doc" target="_blank" rel="noopener">↗ Sample Agenda Paper (guides folder)</a></div>`}, {h:`Quorum &amp; Genuine Attendance`,p:`<p><em>A real assembly needs more than a full room</em></p><p class="intro">Quorum for an assembly is commonly a majority of all members in good standing, not merely of those who show up. When it is not reached, the assembly cannot pass binding items; many clubs then treat the meeting as a consultation and reschedule the governance items.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Define good standing early</h5><p>Members in good standing are those whose dues are paid and who maintain attendance per club policy; the secretary holds this list.</p></li>
        <li><span class="num">2</span><h5>Count at the door</h5><p>Sign-in with attendance recorded against the good-standing list; the count opens the minutes.</p></li>
        <li><span class="num">3</span><h5>Plan for the low season</h5><p>January and the University exam window thin attendance; schedule the statutory assembly outside exam weeks.</p></li>
        <li><span class="num">4</span><h5>Make online joining official</h5><p>If your club allows members to join remotely, decide in advance how online attendance counts toward quorum.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs whose <span>statutory assembly stalls for quorum more than once</span> should check whether their meeting day fights the local exam calendar.</p></div><p><b>Key points</b></p><ul><li>Confirm the quorum number from the constitution before the notice goes out</li><li>Record the quorum count and the vote counts in the minutes, whatever the outcome</li><li>If quorum fails, minute a new date on the spot and have the chair sign the notice</li><li>List members in good standing alongside the 100% attendance honours; one page, both messages</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Standard-Rotaract-Club-Constitution.docx" target="_blank" rel="noopener">↗ Standard Rotaract Club Constitution: quorum</a></div>`}, {h:`Running the Room`,p:`<p><em>Structure keeps members generous with their time</em></p><p class="intro">A hundred members and no structure becomes a hundred different meetings. The chair's discipline, not the size of the room, decides whether an assembly feels empowering or exhausting.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Nominate a neutral chair</h5><p>For elections, many clubs hand the gavel to a past president or the sponsor club's representative, never a candidate.</p></li>
        <li><span class="num">2</span><h5>One speaker at a time</h5><p>Recognised speakers only; the chair repeats, paraphrases and moves on.</p></li>
        <li><span class="num">3</span><h5>Put it to a motion</h5><p>Any item that needs a decision is worded as a motion by a member; the room votes on the motion you read back.</p></li>
        <li><span class="num">4</span><h5>Timebox every report</h5><p>Five minutes per report, signalled visibly; members who prepared shorter reports win the room.</p></li>
        <li><span class="num">5</span><h5>Read decisions back</h5><p>After voting, the chair reads the decision out loud before moving on.</p></li>
        <li><span class="num">6</span><h5>Welcome visitors properly</h5><p>Guests are introduced and acknowledged; the assembly has no silent strangers.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Minutes where <span>every decision appears as a stated sentence</span> let an absent member catch up in three minutes instead of an hour.</p></div><p><b>Key points</b></p><ul><li>Every member who speaks is recognised first; the chair holds the list</li><li>Amendments are voted before the main motion; no one votes on a moving target</li><li>Non-members get the floor only by invite and only for their agenda item</li><li>The chair's summary at each agenda line ends with a decision or a clear non-decision</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`Recording &amp; Follow-up`,p:`<p><em>The assembly ends; its record begins</em></p><p class="intro">The minutes of an assembly are a governance document, not a diary. They are signed, kept with the club's official records, shared with members, and they turn votes into action items that have owners and deadlines.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Capture decisions, not speeches</h5><p>Every motion, the mover, the count and the outcome, in order. One page for a two-hour meeting is normal.</p></li>
        <li><span class="num">2</span><h5>Name owners and dates</h5><p>Each decision gets an owner and a deadline before the room closes; the minutes list them in a follow-up table.</p></li>
        <li><span class="num">3</span><h5>Approve and sign</h5><p>The next assembly opens by approving the record, corrected and signed by the chair and secretary.</p></li>
        <li><span class="num">4</span><h5>Share within 48 hours</h5><p>Members who could not attend read the outcome while it still matters.</p></li>
        <li><span class="num">5</span><h5>File with the official records</h5><p>The signed copy joins the club's minutes book and the shared drive; elected boards change, the record does not.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>The assembly record is <span>the club's own constitution in practice</span>; auditors and incoming boards read it before they read anything else.</p></div><p><b>Key points</b></p><ul><li>Minutes carry the date, quorum count, agenda and signatures</li><li>Each action line has an owner and a deadline; each vote has a count</li><li>Minutes are approved, signed and filed before the next notice goes out</li><li>Past assembly minutes live in the official records folder and on the shared drive</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-GM-attendance-sheet.docx" target="_blank" rel="noopener">↗ Sample GM attendance sheet (record keeping)</a></div>`}],
   videos:[{id:"H3KO3rn2P0o",title:`Rotaract Zone 34 Monthly Meeting: Club Information`,desc:`Rotaract Zone 34's monthly meeting session on updating Rotaract club information on My Rotary, exactly the kind of practical education assembly content members can use immediately.`}],
   links:[{label:`Standard Rotaract Club Constitution: assemblies`,url:`media/guides/Standard-Rotaract-Club-Constitution.docx`}, {label:`Recommended Club Bylaws`,url:`media/guides/662_rotaract_club_recommended_bylaws_en.docx`}, {label:`Sample Agenda Paper (guides folder)`,url:`media/guides/Sample-Agenda-Paper.doc`}, {label:`Sample GM attendance sheet (record keeping)`,url:`media/guides/Sample-GM-attendance-sheet.docx`}]},

  {id:"zrr",role:"zrr",source:"zone",title:`ZRR Visits`,
   deadline:`Two host-ready visits a year`,
   intro:`The ZRR is your club's human line into District 3292. Know who they are, host the two visits well, and let each one strengthen the club.`,
   callouts:[{type:"info",icon:"📚",title:"Sources for this tutorial",body:`The zone structure, the nine Zone 7 clubs and the two-visits-a-year expectation come from the <a href="media/guides/RC. Dis. Dinesh Gaire BW 2082 Final District directory.pdf">District 3292 Directory</a>, with the district&#8211;club relationship from the <em>Rotaract Guidebook</em> and RI&#8217;s official Rotaract training series. Source documents are listed under each section below.`}],
   docs:[{h:`Who Is the ZRR?`,p:`<p><em>Your club's link to the district, one zone away</em></p><p class="intro">The Zonal Rotaract Representative sits between the clubs and the district: above the clubs, below the DRR. A ZRR is a trained Rotaract leader who looks after a cluster of clubs (in our case, Zone 7 and its nine clubs) and is supported by Assistant DRRs in the work.</p>
      <table class="type-table">
        <thead><tr><th>Level</th><th>Who</th><th>What they do for your club</th></tr></thead>
        <tbody>
          <tr><td>District Rotaract Representative (DRR)</td><td>One per district</td><td>Leads the district's Rotaract program, chairs the District Rotaract Committee, liaises with the District Governor</td></tr>
          <tr><td>Zonal Rotaract Representative (ZRR)</td><td>One per zone</td><td>Your direct link: visits clubs, monitors health, communicates district programs, supports leaders</td></tr>
          <tr><td>Assistant DRR (ADRR)</td><td>A few per zone</td><td>Support the ZRR with visits, training and follow-up</td></tr>
          <tr><td>Your club</td><td>9 clubs in Zone 7</td><td>Hosts visits, reports activity, and stays connected through the zone</td></tr>
        </tbody>
      </table>
      <p class="intro">For members, the ZRR is the face of the district, the person who knows your club's name, champions its work, and shows up when you need help. Making that relationship warm and regular is one of the cheapest investments a club can make in its own strength.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>know their ZRR by name and meet them twice a year</span> get help faster and recognition louder than clubs that only meet the district at conferences.</p></div><p><b>Key points</b></p><ul><li>Introduce the ZRR to the whole club at the first visit: name, zone, what they do</li><li>Share the ZRR's contact with the board and add them to the club's official channel</li><li>Read the district's annual plan so the club knows what the ZRR is asked to deliver</li><li>Treat the ZRR as a coach, not a supervisor; clubs that ask questions get answers</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Rotaract-Guidebook.pdf" target="_blank" rel="noopener">↗ Rotaract Guidebook: zone &amp; district structure</a></div>`}, {h:`Why Two Visits a Year`,p:`<p><em>Monitoring with a human face</em></p><p class="intro">The district expects each club to host at least two ZRR visits a year, spread across the year, not two weeks before the district conference. The visits exist for three reasons, and understanding them changes how you prepare.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Monitoring</h5><p>The ZRR sees the club as it really is: attendance, meetings, projects, records. Good news travels to the district; problems get help before they get bigger.</p></li>
        <li><span class="num">2</span><h5>Support</h5><p>Visits are coaching sessions: leadership advice, project ideas, links to district resources, grants and training your club did not know existed.</p></li>
        <li><span class="num">3</span><h5>Recognition</h5><p>Strong clubs get noticed through the ZRR: awards, conference stages, district roles. The visit is how your club enters that conversation.</p></li>
        <li><span class="num">4</span><h5>Connection</h5><p>Zone 7's nine clubs stay connected through shared visits, joint projects and inter-club exchanges that the ZRR can initiate.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Spreading the two visits across the year matters: <span>a visit in each half</span> keeps the club honest twice instead of once.</p></div><p><b>Key points</b></p><ul><li>Book both visits early in the year; the ZRR's calendar fills fast</li><li>Space them: one in the first half, one in the second</li><li>Invite the ZRR to a project or event, not just a meeting; visits with activity are richer</li><li>Ask the ZRR for one concrete recommendation at each visit and act on it</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`Before the Visit`,p:`<p><em>A prepared club makes the visit a pleasure</em></p><p class="intro">Ninety percent of a good visit happens before the ZRR arrives. The board agrees the date and agenda with the ZRR in advance, and the club walks in ready to show its real self, good and bad.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Agree the date &amp; format</h5><p>Coordinate with the ZRR directly: a general meeting visit, a board visit, or a project visit; each has a different agenda.</p></li>
        <li><span class="num">2</span><h5>Send the club's status</h5><p>One page: membership count, meeting rhythm, projects done and planned, finances in one line, challenges the club wants help with.</p></li>
        <li><span class="num">3</span><h5>Prepare the documents</h5><p>Have the constitution, recent minutes, attendance records and financial summary ready; the ZRR may ask to see them.</p></li>
        <li><span class="num">4</span><h5>Brief the members</h5><p>Tell members a visit is happening, what it means, and invite them to attend and speak freely.</p></li>
        <li><span class="num">5</span><h5>Plan the logistics</h5><p>Venue, timing, transport, tea: the small courtesies that make a visitor feel valued.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>send the one-page status report before the visit</span> get double the advice; the ZRR reads it and comes ready to help, not to discover.</p></div><p><b>Key points</b></p><ul><li>Book the visit at least three weeks ahead</li><li>Send the status report 48 hours before the visit</li><li>Warn members: visits are friendly, not inspections; honesty is the point</li><li>Confirm the venue and timing with the ZRR the day before</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-Agenda-Paper.doc" target="_blank" rel="noopener">↗ Sample Agenda Paper (guides folder)</a></div>`}, {h:`Hosting the Visit`,p:`<p><em>The meeting, the project, the conversation</em></p><p class="intro">A visit usually has three parts: the meeting, the activity, and the conversation. Run the meeting in your normal format; the ZRR wants to see the club as it is, not a performance.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Welcome properly</h5><p>The president welcomes the ZRR at the door, introduces them to the board, and gives a formal introduction early in the meeting.</p></li>
        <li><span class="num">2</span><h5>Run the normal agenda</h5><p>Minutes, reports, committee updates, exactly as usual. The ZRR observes the club's real rhythm.</p></li>
        <li><span class="num">3</span><h5>Give them the floor</h5><p>The ZRR gets a program slot: district news, upcoming events, feedback on the club, training offers.</p></li>
        <li><span class="num">4</span><h5>Show the work</h5><p>If a project is running, take them to see it; a moment at the site beats an hour of slides.</p></li>
        <li><span class="num">5</span><h5>Make room for honest talk</h5><p>Members should be able to ask the ZRR anything, about district plans, their club's standing, how to improve.</p></li>
        <li><span class="num">6</span><h5>Close with thanks</h5><p>A photo, a small token, a public thank-you; the club's warmth is the part everyone remembers.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Visits where <span>members ask questions freely</span> leave both sides better; the ZRR learns what the zone needs, the club learns what the district offers.</p></div><p><b>Key points</b></p><ul><li>Keep the club's normal meeting format; do not script a special show</li><li>Give the ZRR a real program slot with time for questions</li><li>Invite at least one project chair to present their work directly</li><li>Make the welcome personal; the president, not a stranger, opens the door</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`A Visit Agenda That Works`,p:`<p><em>Structure the hour so nothing is wasted</em></p><p class="intro">Whether the visit is a full general meeting or a shorter working session, a written agenda shared with the ZRR beforehand keeps it useful. Adapt this flow to your club's format and the visit's purpose.</p>
      <table class="type-table">
        <thead><tr><th>Time</th><th>Item</th><th>Who</th></tr></thead>
        <tbody>
          <tr><td>0&ndash;5 min</td><td>Welcome, introductions, purpose of the visit</td><td>President</td></tr>
          <tr><td>5&ndash;15 min</td><td>Club status: membership, meetings, projects, finances, challenges</td><td>President / Secretary</td></tr>
          <tr><td>15&ndash;30 min</td><td>Regular meeting business: minutes, reports, committee updates</td><td>Officers &amp; chairs</td></tr>
          <tr><td>30&ndash;45 min</td><td>ZRR's program: district news, feedback, training and support offers</td><td>ZRR</td></tr>
          <tr><td>45&ndash;55 min</td><td>Open discussion: members ask, ZRR answers, next steps agreed</td><td>All members</td></tr>
          <tr><td>55&ndash;60 min</td><td>Action items, photo, thanks, close</td><td>President / Secretary</td></tr>
        </tbody>
      </table><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>An agenda with <span>the ZRR's name next to a 15-minute block</span> says more about your club's professionalism than any banner ever will.</p></div><p><b>Key points</b></p><ul><li>Send the visit agenda to the ZRR at least a week before</li><li>Name an owner for every agenda item, including the open discussion</li><li>Save the last five minutes for action items with deadlines</li><li>Assign someone to photograph the visit for the club's records and social media</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-Agenda-Paper.doc" target="_blank" rel="noopener">↗ Sample Agenda Paper (guides folder)</a></div>`}, {h:`After the Visit`,p:`<p><em>The minutes make the visit permanent</em></p><p class="intro">A visit that is not followed up is a visit that evaporates. The follow-up is short, but it is what turns a pleasant hour into a strengthened club.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Write the visit minutes</h5><p>What was discussed, what the ZRR recommended, what the club agreed to do, with owners and deadlines.</p></li>
        <li><span class="num">2</span><h5>Thank the ZRR</h5><p>A personal message within 48 hours, with the photo and the minutes attached. It keeps the door warm.</p></li>
        <li><span class="num">3</span><h5>Act on the recommendations</h5><p>Present the ZRR's suggestions at the next board meeting and decide which to adopt, visibly, so members see the visit changed something.</p></li>
        <li><span class="num">4</span><h5>Report through the zone</h5><p>The visit feeds the club's reporting to the district; confirm your secretary knows what the district expects.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>complete one ZRR recommendation before the next visit</span> turn visits into progress; the ZRR sees momentum, and the district hears about it.</p></div><p><b>Key points</b></p><ul><li>Publish visit minutes to members within 48 hours</li><li>Send the ZRR a thank-you with the photo and minutes</li><li>Add the ZRR's recommendations to the next board agenda</li><li>Note the next visit's provisional date before the ZRR leaves</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/statement-of-policy.docx" target="_blank" rel="noopener">↗ Statement of Policy: reporting &amp; recognition</a></div>`}],
   videos:[{id:"ZJm-itrb3u8",title:`Rotaract Training Videos: Episode 12`,desc:`Rotary International's official Rotaract training series covering district and zone structure, officer roles and club operations. The system this tutorial describes, straight from RI.`}],
   links:[{label:`Rotaract Guidebook: zone &amp; district structure`,url:`media/guides/Rotaract-Guidebook.pdf`}, {label:`Sample Agenda Paper (guides folder)`,url:`media/guides/Sample-Agenda-Paper.doc`}, {label:`Statement of Policy: reporting &amp; recognition`,url:`media/guides/statement-of-policy.docx`}]},

  {id:"drr",role:"drr",source:"zone",title:`DRR Visits`,
   deadline:`One visit a year: show the file`,
   intro:`The DRR visit is your club face to face with the whole district system. Prepare it like the milestone it is, host it well, and close the loop after.`,
   callouts:[{type:"info",icon:"📚",title:"Sources for this tutorial",body:`The DRR role and the recognition and reporting expectations come from the <em>Rotaract Guidebook</em> and the <a href="media/guides/statement-of-policy.docx">District 3292 Statement of Policy</a>. Source documents are listed under each section below.`}],
   docs:[{h:`Who Is the DRR?`,p:`<p><em>The district's Rotaract leader, working for you</em></p><p class="intro">The District Rotaract Representative is the Rotaractor who leads the whole district's Rotaract program on behalf of the District Governor, usually chairing or co-chairing the District Rotaract Committee and working through the ZRRs who look after the zones.</p>
      <table class="type-table">
        <thead><tr><th>Level</th><th>Who</th><th>What they do</th></tr></thead>
        <tbody>
          <tr><td>District Governor (DG)</td><td>Rotary leader of the district</td><td>Oversees all Rotary and Rotaract activity; the DRR reports to them</td></tr>
          <tr><td>District Rotaract Representative (DRR)</td><td>One per district</td><td>Leads Rotaract in the district, chairs the District Rotaract Committee, coordinates ZRRs and district programs</td></tr>
          <tr><td>ZRR &amp; ADRR</td><td>Per zone</td><td>Carry the DRR's work into clubs through visits, monitoring and support</td></tr>
          <tr><td>Your club</td><td>9 clubs in Zone 7</td><td>Hosts visits, reports activity, and earns recognition through performance</td></tr>
        </tbody>
      </table>
      <p class="intro">Members often assume the DRR is remote and ceremonial. In District 3292 the DRR is anything but, a working leader who knows the clubs, pushes district programs, and carries the strongest clubs' stories to the Governor. A visit from the DRR is your club meeting that whole system face to face.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>A club the DRR knows personally <span>gets picked for district events, awards and roles</span>; visibility is earned through visits, not through reports.</p></div><p><b>Key points</b></p><ul><li>Know who the current DRR is and add them to the club's official channels</li><li>Read what the DRR's annual plan promises: events, programs, deadlines</li><li>Follow the DRR's public updates so the club never surprises the district</li><li>Ask the ZRR how the DRR likes to engage with clubs; every DRR has a style</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Rotaract-Guidebook.pdf" target="_blank" rel="noopener">↗ Rotaract Guidebook: district leadership</a></div>`}, {h:`What a DRR Visit Means`,p:`<p><em>Recognition, coaching and a direct line to the district</em></p><p class="intro">A DRR visit is not a bigger ZRR visit; it is a different kind of moment for the club. Understanding what it carries changes how seriously you prepare for it.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Recognition</h5><p>The district's top Rotaract leader chose to visit your club. That fact alone lifts the club's standing with the Governor, sponsors and the zone.</p></li>
        <li><span class="num">2</span><h5>Coaching</h5><p>The DRR brings a district-wide view: what strong clubs across the district do, where your club stands, what to fix next.</p></li>
        <li><span class="num">3</span><h5>Access</h5><p>District programs, grants, trainings and conference slots open up in the room; clubs that ask for them get them.</p></li>
        <li><span class="num">4</span><h5>Accountability</h5><p>The visit reminds everyone the club belongs to a bigger system with shared standards and a shared story.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>treat the DRR visit as a milestone, not an errand</span> get more from the hour than clubs that treat it as a formality.</p></div><p><b>Key points</b></p><ul><li>Tell members in advance what the visit means: recognition, not inspection</li><li>Set one goal for the visit: one program the club wants, one question the club needs answered</li><li>Invite the sponsor Rotary club's leadership; a district visit is a shared moment</li><li>Announce the visit's outcome to members within a week</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`Preparing the Club`,p:`<p><em>The district deserves your best paperwork</em></p><p class="intro">Preparation for a DRR visit follows the same discipline as a ZRR visit, with higher polish. The DRR sees many clubs a year; the ones that stand out are the ones that arrived ready.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Invite early, coordinate directly</h5><p>Agree the date, format and agenda with the DRR or their team through the ZRR; the DRR's calendar is crowded.</p></li>
        <li><span class="num">2</span><h5>Send the club's real status</h5><p>Membership numbers, meeting rhythm, projects with outcomes, finances, challenges, honest and one page long.</p></li>
        <li><span class="num">3</span><h5>Prepare the records</h5><p>Constitution, recent minutes, attendance data and financial summary, tidy and available.</p></li>
        <li><span class="num">4</span><h5>Choose the showcase</h5><p>Pick one project or initiative to present properly; the DRR needs one story to carry to the Governor.</p></li>
        <li><span class="num">5</span><h5>Plan the logistics</h5><p>Venue, timing, transport, hospitality; small courtesies, done properly.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>The clubs DRRs remember are the ones that <span>hand them a one-page status report on arrival</span>; it makes the whole visit better.</p></div><p><b>Key points</b></p><ul><li>Coordinate the visit through the ZRR so the zone's calendar stays coherent</li><li>Send the status report 48 hours ahead, and bring a printed copy to the meeting</li><li>Prepare one presentation of a real project, ready in five minutes</li><li>Confirm logistics with the DRR's team the day before</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Sample-Agenda-Paper.doc" target="_blank" rel="noopener">↗ Sample Agenda Paper (guides folder)</a></div>`}, {h:`Hosting the DRR`,p:`<p><em>Structure the hour; fill it with the club's real life</em></p><p class="intro">The visit format can vary: a general meeting, a working session, or a project site visit. Whatever the format, these are the moments that make it work.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Formal welcome</h5><p>The president welcomes the DRR personally, introduces them to the board, and gives a proper introduction early in the agenda.</p></li>
        <li><span class="num">2</span><h5>Club presentation</h5><p>Ten minutes: who the club is, what it did, what it plans, with the showcase project front and centre.</p></li>
        <li><span class="num">3</span><h5>District update from the DRR</h5><p>Programs, events, deadlines, district direction, a real program slot, with time for questions.</p></li>
        <li><span class="num">4</span><h5>Open conversation</h5><p>Members ask what they actually want to know: how the district works, how to improve, what happens next.</p></li>
        <li><span class="num">5</span><h5>Photo &amp; ceremony</h5><p>A group photo, a small token of thanks, public appreciation, the moment members retell for months.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>DRR visits where <span>members, not just officers, talk</span> give the district a real picture of the club, and members a real sense of the district.</p></div><p><b>Key points</b></p><ul><li>Keep the club's genuine format; the DRR wants to see the real club</li><li>Give members priority over officers in the open conversation</li><li>Have the photographer and group photo slot planned in advance</li><li>Prepare a small, tasteful token of thanks; district customs vary, ask the ZRR</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`Making the Visit Useful`,p:`<p><em>Turn the hour into programs, advice and connections</em></p><p class="intro">The visit's value is not the ceremony; it is what the club takes from it. Five kinds of results are worth chasing explicitly.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Ask for district programs</h5><p>Grants, trainings, joint projects, conference slots; name what the club wants while the DRR is in the room.</p></li>
        <li><span class="num">2</span><h5>Request specific coaching</h5><p>Attendance problem? Weak public image? Ask for one piece of advice per challenge, and write it down.</p></li>
        <li><span class="num">3</span><h5>Build the relationship</h5><p>The DRR should leave knowing your president, your secretary and one rising member, the club's future leaders.</p></li>
        <li><span class="num">4</span><h5>Offer something back</h5><p>Volunteer the club to host a district workshop or a joint event; clubs that give to the district get remembered.</p></li>
        <li><span class="num">5</span><h5>Note the next touchpoint</h5><p>Agree the next meeting point before the DRR leaves: conference, joint visit, online check-in.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that leave a DRR visit with <span>two concrete commitments (one theirs, one the district's)</span> convert ceremony into progress.</p></div><p><b>Key points</b></p><ul><li>Prepare the club's asks in writing before the visit</li><li>Assign one member to scribe every commitment made during the visit</li><li>Introduce the club's next-generation leaders to the DRR personally</li><li>Volunteer for one district opportunity during the visit</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`After the Visit`,p:`<p><em>Close the loop with the district</em></p><p class="intro">The DRR's visit feeds the district's picture of your club, and your club's place in the district. The follow-up is short, but it is how the visit becomes a relationship.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Publish visit minutes</h5><p>Discussion, commitments, owners and deadlines, shared with members within 48 hours.</p></li>
        <li><span class="num">2</span><h5>Thank the DRR properly</h5><p>A personal message with the photo and minutes, and copy the ZRR, so the zone sees the club's professionalism.</p></li>
        <li><span class="num">3</span><h5>Honour the commitments</h5><p>Track the club's promises at the next board meeting; follow up on the district's promises after a reasonable time.</p></li>
        <li><span class="num">4</span><h5>Feed the reporting cycle</h5><p>The visit and its outcomes flow into the club's regular reporting to the district; keep the record consistent.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>The clubs the district trusts are the ones that <span>do what they promised after the visit</span>; trust compounds from one visit to the next.</p></div><p><b>Key points</b></p><ul><li>Send minutes and photos to the DRR within 48 hours</li><li>Add every commitment to the board meeting agenda</li><li>Follow up on district promises politely after two weeks</li><li>Keep the visit report in the club's records for the year-end review</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/statement-of-policy.docx" target="_blank" rel="noopener">↗ Statement of Policy: recognition &amp; reporting</a><a href="media/guides/Rotaract-Guidebook.pdf" target="_blank" rel="noopener">↗ Rotaract Guidebook: reporting</a></div>`}],
   videos:[{id:"bQ3CE1-PzDE",title:`What Is a Hybrid Meeting &amp; How to Start`,desc:`Rotary District 5950's practical session on hybrid meetings, invaluable for DRR visits to clubs that join online, and for every club reaching members who cannot attend in person.`}],
   links:[{label:`Rotaract Guidebook: district leadership`,url:`media/guides/Rotaract-Guidebook.pdf`}, {label:`Sample Agenda Paper (guides folder)`,url:`media/guides/Sample-Agenda-Paper.doc`}, {label:`Statement of Policy: recognition &amp; reporting`,url:`media/guides/statement-of-policy.docx`}]},

  {id:"blood",role:"blood",source:"both",title:`Blood Donation Programs`,
   deadline:`Licensed bank, screened donors, safe camp`,
   intro:`One of the most visible service projects a club runs, and one of the most regulated. Plan the logistics, let the blood bank run the medicine, and every unit counts.`,
   callouts:[{type:"info",icon:"📚",title:"Sources for this tutorial",body:`The legal and safety framework follows the licensed blood bank rules that govern camps in Nepal, with eligibility from the <a href="https://www.who.int/publications/i/item/9789241548519" target="_blank" rel="noopener">WHO Blood Donor Selection Guidelines</a> and the <a href="https://nepalredcross.org.np/" target="_blank" rel="noopener">Nepal Red Cross blood service</a>, and the District 3292 district fund available to cover costs. Source documents are listed under each section below.`}],
   docs:[{h:`Legal &amp; Medical Basics`,p:`<p><em>The rules are not paperwork; they are the safety</em></p><p class="intro">A blood donation camp is a medical procedure event, regulated by the state. The blood bank runs the medical side; the club runs the logistics side. Neither can do the other's job, and the rules are the reason why.</p>
      <table class="type-table">
        <thead><tr><th>Requirement</th><th>What it means for your camp</th></tr></thead>
        <tbody>
          <tr><td>Licensed blood bank</td><td>Only a licensed blood bank may collect, test and store blood; the camp happens under their licence and staff</td></tr>
          <tr><td>Trained medical staff</td><td>Doctors and trained phlebotomists run screening, collection and donor care; members help with flow, not needles</td></tr>
          <tr><td>Proper premises</td><td>Clean, ventilated, adequate space for screening, donation beds and rest; the blood bank will confirm the site</td></tr>
          <tr><td>Consent &amp; records</td><td>Every donor gives informed consent; every unit is labelled and recorded by the blood bank</td></tr>
          <tr><td>Donor protection</td><td>Eligibility screening protects the donor's health first; no pressure, no exceptions</td></tr>
        </tbody>
      </table>
      <p class="intro">The single rule that keeps every camp safe: the club never touches medical decisions. If a member is unsure whether someone can donate, the blood bank's staff decide, always.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Every safe Zone 7 camp shares one feature: <span>the club planned logistics, the blood bank ran medicine</span>, and never the other way around.</p></div><p><b>Key points</b></p><ul><li>Confirm the blood bank's licence and facility before committing a date</li><li>Put the division of roles in writing: club = logistics, bank = medicine</li><li>Visit the venue with the blood bank team before the camp date</li><li>Keep the blood bank's emergency contact and the camp agreement in the club records</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/MOU-Document.doc" target="_blank" rel="noopener">↗ MOU Document (partnership template)</a><a href="https://www.who.int/publications/i/item/9789241548519" target="_blank" rel="noopener">↗ WHO Blood Donor Selection Guidelines</a></div>`}, {h:`Partnering with a Blood Bank`,p:`<p><em>The partnership makes the camp legal, safe and possible</em></p><p class="intro">Everything follows from the partnership. A blood bank agrees to bring staff, equipment and medical responsibility to your venue; the club brings donors, logistics and promotion. Do this step properly and the camp runs itself medically.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Find the licensed banks</h5><p>Hospitals and blood transfusion centres in the valley; ask other Zone 7 clubs which banks they work with and how it went.</p></li>
        <li><span class="num">2</span><h5>Approach early</h5><p>Banks have quotas and calendars; approach 4&ndash;6 weeks ahead with dates, venue and expected donor numbers.</p></li>
        <li><span class="num">3</span><h5>Sign an agreement</h5><p>Roles, venue, staff, dates, donor targets, costs and responsibilities in writing; the club MOU template adapts well.</p></li>
        <li><span class="num">4</span><h5>Confirm the staffing</h5><p>Doctor, phlebotomists and support staff for your expected turnout; roughly one team per station with rest capacity.</p></li>
        <li><span class="num">5</span><h5>Plan the handover</h5><p>Agree who supplies forms, refreshments, beds, signage and first-aid backup, and who clears the venue after.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>A camp with <span>50&ndash;70 donors over about three hours</span> needs a full team; banks staff to volume, so give them real numbers, not optimism.</p></div><p><b>Key points</b></p><ul><li>Ask at least two banks and compare before committing</li><li>Put the agreement in writing, including who pays for what</li><li>Give the bank realistic donor numbers and confirm them a week before</li><li>Introduce the bank's team to your logistics team at the site visit</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/MOU-Document.doc" target="_blank" rel="noopener">↗ MOU Document (partnership template)</a></div>`}, {h:`Donor Eligibility`,p:`<p><em>Screening protects donors; publish the basics honestly</em></p><p class="intro">Eligibility protects the donor, not just the blood. The blood bank's staff do the final screening, but the club must communicate the basics so members and the public know whether they are likely to qualify, and come prepared.</p>
      <table class="type-table">
        <thead><tr><th>Criterion</th><th>Typical requirement</th></tr></thead>
        <tbody>
          <tr><td>Age</td><td>18&ndash;60 years (limits vary; confirm with your bank)</td></tr>
          <tr><td>Weight</td><td>At least 45 kg</td></tr>
          <tr><td>Interval</td><td>At least 3 months since the last donation</td></tr>
          <tr><td>Health</td><td>Feeling well on the day, no fever, cold or active infection</td></tr>
          <tr><td>Lifestyle &amp; history</td><td>Honest disclosure: recent travel, medication, tattoos, surgery and past conditions all matter</td></tr>
          <tr><td>Rest &amp; food</td><td>Enough sleep, a meal beforehand, not on an empty stomach</td></tr>
        </tbody>
      </table>
      <p class="intro">Publish the basics on every poster and registration page. Being declined on site is awkward; being declined informed is fine, and coming prepared keeps the queue moving.</p><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Camps that <span>publish eligibility before the event</span> see fewer on-site declines, and donors leave with respect instead of frustration.</p></div><p><b>Key points</b></p><ul><li>Publish age, weight, interval and health basics on all promotion</li><li>Advise donors to sleep, eat and hydrate before coming</li><li>Tell potential donors: honest answers, not hopeful ones</li><li>Remind donors to bring ID and any donor card they hold</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="https://nepalredcross.org.np/" target="_blank" rel="noopener">↗ Nepal Red Cross Blood Transfusion Service</a><a href="https://www.who.int/publications/i/item/9789241548519" target="_blank" rel="noopener">↗ WHO Blood Donor Selection Guidelines</a></div>`}, {h:`Planning &amp; Promotion`,p:`<p><em>Six weeks of planning make six hours of smooth camp</em></p><p class="intro">A blood camp is a full club project: it needs a chair, a plan, a budget and real promotion. Use the same planning discipline as any big program; this is the timeline that works.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Appoint a camp chair</h5><p>One accountable lead with a small team: logistics, promotion, registration, refreshments, records.</p></li>
        <li><span class="num">2</span><h5>Fix date, venue, bank</h5><p>Six weeks out: the date, the site (approved by the bank), the partnership agreement signed.</p></li>
        <li><span class="num">3</span><h5>Set the budget</h5><p>Refreshments, certificates, transport, thank-you tokens; approved by the board; grants can cover costs (see the district fund).</p></li>
        <li><span class="num">4</span><h5>Promote in layers</h5><p>Members first (who donates when), then colleges and workplaces, then the public; posters, social posts, campus announcements.</p></li>
        <li><span class="num">5</span><h5>Open registration</h5><p>A simple form collects name, age, contact, blood group if known and time slot; slots keep the queue smooth.</p></li>
        <li><span class="num">6</span><h5>Confirm everything</h5><p>One week out: bank team, venue, equipment, supplies, volunteers' roster, emergency plan.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Clubs that <span>collect registrations with time slots</span> run queues that move; walk-ins still welcome, but the scheduled donors carry the day.</p></div><p><b>Key points</b></p><ul><li>Start planning at least six weeks before the camp date</li><li>Approve the budget at a board meeting, before spending starts</li><li>Promote in three waves: members, institutions, public</li><li>Confirm all partners and volunteers seven days before the camp</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/Rotaract-District-Fund_Grant-Criterion-Document.pdf" target="_blank" rel="noopener">↗ District Fund Grant Criterion Document</a><a href="media/guides/Effective-Planning-Guide-to-Clubs.docx" target="_blank" rel="noopener">↗ Effective Planning Guide to Clubs</a></div>`}, {h:`The Day-Of Flow`,p:`<p><em>Every donor moves through the same five stations</em></p><p class="intro">A well-run camp is a five-station flow, with volunteers at each point and clear signage. Donors enter at one end and leave with a certificate at the other; the flow is the same whether the camp collects forty units or a hundred.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Registration</h5><p>Donors check in, confirm their slot, receive the consent form. Volunteers collect contact details and blood group history.</p></li>
        <li><span class="num">2</span><h5>Screening</h5><p>Blood bank staff take history, check weight, blood pressure and haemoglobin, and decide eligibility. This station is theirs, fully.</p></li>
        <li><span class="num">3</span><h5>Donation</h5><p>Phlebotomists collect the unit on labelled beds; volunteers keep the queue moving and the donors calm.</p></li>
        <li><span class="num">4</span><h5>Rest &amp; refreshment</h5><p>Every donor rests 10&ndash;15 minutes with food and drink before leaving; this station is non-negotiable.</p></li>
        <li><span class="num">5</span><h5>Certificate &amp; thanks</h5><p>Certificate, token of thanks, photo if they want it, and an invitation to the next camp.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>With <span>two registration desks and three donation beds</span>, a camp comfortably processes 50&ndash;70 donors in about three hours.</p></div><p><b>Key points</b></p><ul><li>Place signage so the flow is obvious from the entrance</li><li>Assign two volunteers per station; one working, one relieving</li><li>Keep the waiting area stocked with water and seats</li><li>Run a quick volunteers' briefing 30 minutes before the first donor</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`First Aid &amp; Emergencies`,p:`<p><em>Fainting is common, panic is optional</em></p><p class="intro">Most donors feel fine; a few feel faint, and that is normal, not a crisis. The difference between a handled moment and a story is preparation: know the likely reactions, keep the calm routine, and let medical staff handle anything medical.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Know the common reactions</h5><p>Fainting, dizziness, nausea and a cool sweat are the usual ones; most happen when a donor stands too fast.</p></li>
        <li><span class="num">2</span><h5>Never rush a donor</h5><p>Standing up too quickly is the classic trigger; enforce the rest period kindly but firmly.</p></li>
        <li><span class="num">3</span><h5>Keep the first-aid station ready</h5><p>Water, juice, glucose, chairs, a fan, a private rest corner; the club's first-aid station supports the bank's medical team.</p></li>
        <li><span class="num">4</span><h5>Know the escalation path</h5><p>Any serious reaction goes to the blood bank's doctor immediately; volunteers never diagnose or treat beyond basic comfort.</p></li>
        <li><span class="num">5</span><h5>Document incidents</h5><p>Any reaction is recorded by the medical team; the club keeps its own one-line log of incidents and how they were handled.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Well-run camps see a <span>faint or two per hundred donors</span>; handled calmly with water, a chair and a minute, they are moments, not emergencies.</p></div><p><b>Key points</b></p><ul><li>Brief all volunteers: faint = normal, alert = medical</li><li>Keep the first-aid corner stocked and staffed all day</li><li>Enforce the rest period after every donation</li><li>Log every incident, even the small ones, with the medical team's notes</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"></div>`}, {h:`After the Camp`,p:`<p><em>Records, thanks and the next camp</em></p><p class="intro">The camp ends when the beds are cleared, but the project ends when the report is filed. The records make the camp repeatable, reportable and increasingly respected.</p>
      <ol class="steps">
        <li><span class="num">1</span><h5>Collect the numbers</h5><p>Registered, screened, accepted, deferred, units collected; the blood bank provides the official figures; keep the club's copy.</p></li>
        <li><span class="num">2</span><h5>Thank everyone</h5><p>Blood bank team, volunteers, venue host, sponsors and every donor; personal messages and public recognition within a week.</p></li>
        <li><span class="num">3</span><h5>Share the impact</h5><p>Photos and the unit count on the club's channels; the story builds your club's public image and next camp's turnout.</p></li>
        <li><span class="num">4</span><h5>Report to the district</h5><p>The camp enters the club's activity reporting, with the bank's official record attached.</p></li>
        <li><span class="num">5</span><h5>Review for next time</h5><p>Short debrief: what ran well, what to change, and note the next camp date while the team is still warm.</p></li>
      </ol><div class="callout callout--tip"><div class="co-head"><span class="co-ic">💡</span><b>Key insight</b></div><p>Camps that <span>file their numbers and thank their donors</span> double their turnout by the second edition; reputation compounds.</p></div><p><b>Key points</b></p><ul><li>Get the official unit count and deferral figures from the blood bank in writing</li><li>Send thanks to all partners within a week</li><li>Publish the impact story with real numbers</li><li>Book the debrief meeting and note the next camp date</li></ul><p class="doc-src-label">Source documents</p><div class="gd-sources"><a href="media/guides/statement-of-policy.docx" target="_blank" rel="noopener">↗ Statement of Policy: reporting</a><a href="media/guides/Rotaract-District-Fund_Grant-Criterion-Document.pdf" target="_blank" rel="noopener">↗ District Fund Grant Criterion Document</a></div>`}],
   videos:[{id:"JPfHels0cXU",title:`RVU Blood Donation Drive`,desc:`A university blood donation drive organised end to end, from registration and screening to collection in one smooth flow, exactly the stations this tutorial walks through.`}, {id:"iAz-hpP83vM",title:`RVCE Blood Donation Camp`,desc:`A student-run blood donation camp in action, showing the day-of flow, donor care and the energy that makes these events work.`}, {id:"b-HmpNcdMbc",title:`Rotaract &amp; Interact Joint Blood Drive`,desc:`A joint Rotaract and Interact blood donation drive, showing how inter-club collaboration scales a camp and spreads its impact.`}],
   links:[{label:`MOU Document (partnership template)`,url:`media/guides/MOU-Document.doc`}, {label:`WHO Blood Donor Selection Guidelines`,url:`https://www.who.int/publications/i/item/9789241548519`}, {label:`Nepal Red Cross Blood Transfusion Service`,url:`https://nepalredcross.org.np/`}, {label:`District Fund Grant Criterion Document`,url:`media/guides/Rotaract-District-Fund_Grant-Criterion-Document.pdf`}, {label:`Effective Planning Guide to Clubs`,url:`media/guides/Effective-Planning-Guide-to-Clubs.docx`}, {label:`Statement of Policy: reporting`,url:`media/guides/statement-of-policy.docx`}]}
];

let currentView="overview";let currentGuide=null;

/* ── helpers ── */
function esc(s){return String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function th(i,g){const x=GUIDES.find(v=>v.id===i);const gr=GROUPS.find(v=>v.guides.includes(i));return {g:x,gr}}
function groupOf(id){return GROUPS.find(x=>x.guides.includes(id))}

/* ── block renderers ── */
const blockAnchor=(gid,kind,idx)=>`sec-${gid}-${kind}-${idx}`;
const COI={info:"ℹ️",tip:"💡",warning:"⚠️",danger:"🚫"};
const COT={info:"Note",tip:"Tip",warning:"Watch out",danger:"Hard rule"};
const VID_ICON={};

function renderCallouts(g){if(!g.callouts)return "";return `<div class="callouts" id="${blockAnchor(g.id,'notes',0)}" data-spy="notes">${g.callouts.map((c,i)=>`<div class="callout callout--${c.type}" data-spy-node="${i}"><div class="co-head"><span class="co-ic">${c.icon||COI[c.type]}</span><b>${c.title||COT[c.type]}</b></div><p>${c.body}</p></div>`).join("")}</div>`}
function renderDocs(g){if(!g.docs)return "";return `<div class="doc" id="${blockAnchor(g.id,'docs',0)}" data-spy="docs">${g.docs.map(d=>`<div class="doc-sec" data-spy-node=""><h3>${d.h}</h3>${d.p}</div>`).join("")}</div>`}
function renderSpec(g,s,key,idx){if(!s)return "";return `<div class="spec" id="${blockAnchor(g.id,key,idx)}" data-spy="${key}"><div class="spec-head"><span class="spec-cap">${s.caption}</span><span class="spec-note">${s.note||""}</span>${s.tot?`<span class="spec-tot">${s.tot}</span>`:""}</div><div class="spec-scroll"><table><thead><tr>${s.headers.map(h=>`<th class="${h==="Pts"?"pts":h==="Rule"?"mono":""}">${h}</th>`).join("")}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map((cell,j)=>`<td class="${s.headers[j]==="Pts"?"pts":""}">${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
function renderTabs(g){if(!g.tabs)return "";return `<div class="tabs" id="${blockAnchor(g.id,'tabs',0)}" data-spy="tabs"><div class="tab-bar" role="tablist" aria-label="${esc(g.tabs.label||"Variants")}">${g.tabs.panels.map((p,i)=>`<button role="tab" id="tabb-${g.id}-${i}" aria-controls="tabp-${g.id}-${i}" aria-selected="${i===0}" data-tab-i="${i}" class="tab${i===0?" active":""}">${esc(p.label)}</button>`).join("")}</div><div class="tab-panel">${g.tabs.panels.map((p,i)=>`<div class="tab-pane${i===0?" active":""}" id="tabp-${g.id}-${i}" role="tabpanel" data-tab-i="${i}">${p.body}</div>`).join("")}</div></div>`}
function renderFlow(g){if(!g.flow)return "";const st=g.flow.steps;return `<div class="flow" id="${blockAnchor(g.id,'flow',0)}" data-spy="flow"><div class="flow-head"><span class="f-title">Process · ${g.flow.title}</span><span class="f-count" data-flow-count>step 1 / ${st.length}</span></div><div class="flow-track" role="tablist" aria-label="${esc(g.flow.title)}">${st.map((s,i)=>`<button class="f-node${i===0?" active":""}" role="tab" data-flow-node="${i}" aria-selected="${i===0}"><span class="f-dot">${i+1}</span><span class="f-lab">${esc(s.title)}</span></button>`).join("")}</div><div class="flow-body">${st.map((s,i)=>`<div class="flow-step${i===0?" active":""}" data-flow-step="${i}"><h4>${s.title}</h4><p>${s.body}</p></div>`).join("")}</div><div class="flow-nav"><button class="f-prev" data-flow-prev type="button" disabled>‹ Prev</button><button class="f-next" data-flow-next type="button">Next ›</button><span class="flow-progress">${st.map((s,i)=>`<button class="f-dot-s${i===0?" active":""}" data-flow-prog="${i}" aria-label="Step ${i+1}" type="button"></button>`).join("")}</span></div></div>`}
function renderVideosMulti(g){
  return `<div class="video-frame" id="${blockAnchor(g.id,'videos',0)}" data-spy="videos">${g.videos.map(v=>`<div class="vf-head"><b>${esc(v.title)}</b>${v.desc?`<span> · ${esc(v.desc)}</span>`:""}</div><div class="vf-box"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`).join("")}</div>`
}

/* ── wire up rendered interactions ── */
function wireTabs(root,g){const bar=root.querySelector(".tab-bar");if(!bar)return;const btns=[...bar.querySelectorAll("[role=tab]")];
  btns.forEach(b=>b.addEventListener("click",()=>{btns.forEach(x=>{const on=x.dataset.tabI==b.dataset.tabI;x.classList.toggle("active",on);x.setAttribute("aria-selected",on);const p=root.querySelector('.tab-pane[data-tab-i="'+x.dataset.tabI+'"]');p.classList.toggle("active",on)})}));
  bar.addEventListener("keydown",e=>{const cur=btns.indexOf(document.activeElement);if(cur===-1)return;let n=null;if(e.key==="ArrowRight")n=(cur+1)%btns.length;else if(e.key==="ArrowLeft")n=(cur-1+btns.length)%btns.length;else if(e.key==="Home")n=0;else if(e.key==="End")n=btns.length-1;if(n!==null){e.preventDefault();btns[n].focus();btns[n].click()}});
}
function wireFlow(root){const flow=root.querySelector(".flow");if(!flow)return;const nodes=[...flow.querySelectorAll("[data-flow-node]")];const steps=[...flow.querySelectorAll("[data-flow-step]")];const dots=[...flow.querySelectorAll("[data-flow-prog]")];const prev=flow.querySelector("[data-flow-prev]");const next=flow.querySelector("[data-flow-next]");const count=flow.querySelector("[data-flow-count]");let cur=0;
  function go(i){cur=Math.max(0,Math.min(nodes.length-1,i));nodes.forEach((n,j)=>{n.classList.toggle("active",j===cur);n.classList.toggle("done",j<cur);n.setAttribute("aria-selected",j===cur)});steps.forEach((s,j)=>s.classList.toggle("active",j===cur));dots.forEach((d,j)=>d.classList.toggle("active",j===cur));prev.disabled=cur===0;next.disabled=cur===nodes.length-1;if(count)count.textContent="step "+(cur+1)+" / "+nodes.length;}
  nodes.forEach((n,j)=>n.addEventListener("click",()=>go(j)));dots.forEach((d,j)=>d.addEventListener("click",()=>go(j)));prev.addEventListener("click",()=>go(cur-1));next.addEventListener("click",()=>go(cur+1));
  flow.querySelector(".flow-track").addEventListener("keydown",e=>{const idx=nodes.indexOf(document.activeElement);if(idx===-1)return;let n=null;if(e.key==="ArrowRight")n=idx+1;else if(e.key==="ArrowLeft")n=idx-1;if(n!==null&&n>=0&&n<nodes.length){e.preventDefault();go(n);nodes[n].focus()}});
}

/* ── content rendering ── */
function renderContent(){
  const area=document.getElementById("contentArea");
  if(currentView==="guide"&&currentGuide){
    const g=GUIDES.find(x=>x.id===currentGuide);if(!g){renderOverview();return}
    const srcLabel=g.source==="zone"?"District 3292":g.source==="ri"?"Rotary International":"RI + District 3292";
    const srcClass=g.source==="zone"?"zone":g.source==="ri"?"ri":"both";
    const gr=groupOf(g.id);
    const sameGroup=gr?gr.guides.filter(id=>id!==g.id):[];
    const fillIds=GUIDES.map(x=>x.id).filter(id=>id!==g.id&&!sameGroup.includes(id));
    const related=[...sameGroup,...fillIds].slice(0,4).map(id=>GUIDES.find(x=>x.id===id));
    const crumb=`<span>Tutorials</span> <span>/</span> <b>${g.title}</b>`;
    const toolbar=toolbarHTML(crumb,true);

    const statBlock=g.stat?`<div class="gd-stat"><div class="g-icon">${g.stat.icon}</div><p>${g.stat.text}</p></div>`:"";
    const calloutSection=renderCallouts(g)||"";
    const docsBlock=renderDocs(g);
    const specBlock=renderSpec(g,g.spec,"spec",0);
    const specB=g.specB?renderSpec(g,g.specB,"specB",1):"";
    const tabSection=(g.tabs?renderTabs(g):"");
    const flowSection=(g.flow?renderFlow(g):"");
    const videoBlock=(g.videos&&g.videos.length)?renderVideosMulti(g):"";

    area.innerHTML=`<div class="guide-detail">${toolbar}<div class="gd-head" id="${blockAnchor(g.id,'head',0)}"><span class="gd-role" style="background:${ROLES[g.role].bg}">${ROLES[g.role].label}</span><span class="gd-src ${srcClass}">${srcLabel}</span></div><h1 id="${g.id}">${g.title}</h1><div class="gd-deadline">⏰ ${g.deadline}</div><p class="gd-intro">${g.intro}</p>${statBlock}${calloutSection}${docsBlock}${specBlock+specB}${tabSection}${flowSection}${g.links.length?`<div class="gd-sources" id="sec-links">${g.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">↗ ${l.label}</a>`).join("")}</div>`:""}${videoBlock}<div class="gd-related"><div class="related-cards">${related.map(r=>`<a class="rel-card" href="#${r.id}" data-guide="${r.id}"><span class="dot" style="background:${ROLES[r.role].bg}"></span><div><h4>${r.title}</h4><p>${r.deadline}</p></div><span class="arrow">→</span></a>`).join("")}</div></div></div>`;

    wireTabs(area,g);wireFlow(area);
    area.querySelectorAll(".rel-card").forEach(c=>c.addEventListener("click",e=>{e.preventDefault();currentGuide=c.dataset.guide;currentView="guide";history.replaceState(null,"","#"+c.dataset.guide);renderAll();closeSidebar()}));
    setTimeout(()=>{const ids=location.hash.slice(1);if(ids&&area.querySelector("[id='"+ids+"']"))area.querySelector("[id='"+ids+"']").scrollIntoView({behavior:"smooth",block:"start"})},30);
  } else { renderOverview(); }
}

function toolbarHTML(crumb,isGuide){
  const darkNow=document.documentElement.classList.contains("dark");
  return `<div class="page-toolbar" id="pageToolbar"><div class="pb-crumb">${crumb}</div><div class="pb-spacer"></div><div class="tool-actions">${isGuide?`<button class="tool-btn" type="button" data-copylink title="Copy link to this chapter">🔗</button>`:""}<button class="tool-btn" type="button" data-palette>Search <kbd>⌘K</kbd></button><button class="tool-btn" type="button" data-theme title="Toggle dark mode" aria-pressed="${darkNow}">${darkNow?"☀":"☾"}</button></div></div>`;
}

function renderOverview(){
  const area=document.getElementById("contentArea");
  const crumb=`<span>Home</span> <span>/</span> <b>Tutorials</b>`;
  const toolbar=toolbarHTML(crumb,false);
  area.innerHTML=`${toolbar}<div class="overview-hero"><h1>The <em>Tutorials</em>.</h1><p class="page-desc">Six step-by-step tutorials for Zone 7 clubs: general meetings, the board, club assemblies, ZRR and DRR visits, and blood donation camps. Videos and source documents included.</p><p class="note">Pick a tutorial from the sidebar, or drop ⌘K to search every section at once. Each tutorial states the rule, cites the source document, and keeps the videos beside the steps.</p></div><div class="role-cards">${GUIDES.map(g=>{const r=ROLES[g.role];return`<a class="role-card" data-guide="${g.id}" href="#${g.id}"><div class="rc-head"><div class="rc-icon" style="background:color-mix(in srgb,${r.bg} 10%,transparent);color:${r.bg}">${r.icon}</div><h3>${g.title}</h3></div><div class="rc-body"><p>${g.deadline}</p><div class="rc-count"><span>${(g.docs||[]).length}</span> how-to sections · ${(g.videos||[]).length} video${(g.videos||[]).length>1?"s":""}</div></div></a>`}).join("")}</div>`;
  area.querySelectorAll(".role-card").forEach(c=>c.addEventListener("click",e=>{
    e.preventDefault();const id=c.dataset.guide;currentGuide=id;currentView="guide";history.replaceState(null,"","#"+id);renderAll();closeSidebar();
  }));
  area.scrollTo({top:0});
  renderRightRail();
}

function renderAll(){renderSidebar();renderContent();renderRightRail();wireToolbar();setupScrollSpy(currentGuide?GUIDES.find(x=>x.id===currentGuide):null);}

function wireToolbar(){const tb=document.querySelector("#contentArea .page-toolbar");if(!tb)return;
  const th=tb.querySelector("[data-theme]");if(th)th.addEventListener("click",()=>{const dark=document.documentElement.classList.toggle("dark");try{localStorage.setItem("hb-theme",dark?"dark":"light")}catch(e){}th.textContent=dark?"☀":"☾";th.setAttribute("aria-pressed",dark)});
  const pl=tb.querySelector("[data-palette]");if(pl)pl.addEventListener("click",openPalette);
  const cl=tb.querySelector("[data-copylink]");if(cl)cl.addEventListener("click",()=>{navigator.clipboard.writeText("https://zone7rotaract3292.vercel.app/tutorials#"+currentGuide).then(()=>{cl.textContent="✓ copied";setTimeout(()=>cl.textContent="🔗",1400)})});
}

/* ── sidebar ── */
function renderSidebar(){
  const byId={};GUIDES.forEach(g=>byId[g.id]=g);
  document.getElementById("sbNav").innerHTML=GROUPS.map(gr=>{
    return`<div class="sb-group" data-group="${gr.id}"><div class="sb-group-head"><span class="dot" style="background:${gr.color}"></span>${gr.label}</div><div class="sb-items-list">${gr.guides.map(id=>{const g=byId[id];return`<a class="sb-item${currentGuide===g.id?" active":""}" data-guide="${g.id}" href="#${g.id}"><span class="dot" style="background:${ROLES[g.role].bg}"></span>${g.title}</a>`}).join("")}</div></div>`;
  }).join("");
  document.querySelectorAll(".sb-item").forEach(item=>item.addEventListener("click",e=>{
    e.preventDefault();currentGuide=item.dataset.guide;currentView="guide";history.replaceState(null,"","#"+item.dataset.guide);renderAll();closeSidebar();
  }));
}

/* ── right rail + scrollspy ── */
function railSections(g){
  const s=[];
  s.push({label:"Intro",id:blockAnchor(g.id,"head",0)});
  if(g.callouts)s.push({label:"Notes",id:blockAnchor(g.id,"notes",0)});
  if(g.docs)s.push({label:"How to",id:blockAnchor(g.id,"docs",0)});
  if(g.spec)s.push({label:"Spec · "+g.spec.caption,id:blockAnchor(g.id,"spec",0)});
  if(g.specB)s.push({label:"Spec · "+g.specB.caption,id:blockAnchor(g.id,"specB",1)});
  if(g.tabs)s.push({label:g.tabs.label||"Variants",id:blockAnchor(g.id,"tabs",0)});
  if(g.flow)s.push({label:"Process · "+g.flow.title,id:blockAnchor(g.id,"flow",0)});
  if(g.videos&&g.videos.length)s.push({label:"Videos",id:blockAnchor(g.id,"videos",0)});
  if(g.links.length)s.push({label:"Official sources",id:"sec-links"});
  return s;
}
let spyObserver=null;
function setupScrollSpy(g){
  if(spyObserver)spyObserver.disconnect();
  const rail=document.getElementById("rightRail");
  const links=[...rail.querySelectorAll(".toc-link")];
  if(!links.length){return}
  const targets=links.map(l=>document.getElementById(l.hash.slice(1))).filter(Boolean);
  spyObserver=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.hash==="#"+en.target.id))}
    });
  },{rootMargin:"-20% 0px -70% 0px",threshold:0});
  targets.forEach(t=>spyObserver.observe(t));
}
function renderRightRail(){
  const rail=document.getElementById("rightRail");
  if(currentView!=="guide"||!currentGuide){rail.innerHTML="";if(spyObserver)spyObserver.disconnect();return}
  const g=GUIDES.find(x=>x.id===currentGuide);if(!g){rail.innerHTML="";return}
  rail.innerHTML=`<div class="toc-label">On this page</div><div class="toc-links">${railSections(g).map(s=>`<a class="toc-link" href="#${s.id}">${esc(s.label)}</a>`).join("")}</div>`;
}

/* ── command palette ── */
const PAL_KIND={guide:"Tutorial",doc:"How to",notes:"Note",spec:"Spec",specB:"Spec",tabs:"Tab",flow:"Step",video:"Video"};
function buildPaletteIndex(){
  const idx=[];
  GUIDES.forEach(g=>{
    idx.push({gid:g.id,kind:"guide",target:null,label:g.title,sub:"Open tutorial · "+(g.docs||[]).length+" how-to sections"});
    (g.callouts||[]).forEach(c=>idx.push({gid:g.id,kind:"notes",target:blockAnchor(g.id,"notes",0),label:c.title,sub:g.title+" · "+COT[c.type]}));
    (g.docs||[]).forEach(d=>idx.push({gid:g.id,kind:"doc",target:blockAnchor(g.id,"docs",0),label:d.h,sub:g.title+" · how to"}));
    if(g.spec)idx.push({gid:g.id,kind:"spec",target:blockAnchor(g.id,"spec",0),label:g.spec.caption,sub:g.title+" · "+g.spec.rows.length+" rows"});
    if(g.specB)idx.push({gid:g.id,kind:"spec",target:blockAnchor(g.id,"specB",1),label:g.specB.caption,sub:g.title+" · "+g.specB.rows.length+" rows"});
    (g.tabs?g.tabs.panels:[]).forEach(p=>idx.push({gid:g.id,kind:"tabs",target:blockAnchor(g.id,"tabs",0),label:p.label,sub:g.title+" · variant"}));
    (g.flow?g.flow.steps:[]).forEach(s=>idx.push({gid:g.id,kind:"flow",target:blockAnchor(g.id,"flow",0),label:s.title,sub:g.title+" · process · "+g.flow.title}));
    (g.videos||[]).forEach(v=>idx.push({gid:g.id,kind:"video",target:blockAnchor(g.id,"videos",0),label:v.title,sub:g.title+" · video"}));
  });
  return idx;
}
const idna = buildPaletteIndex();
let palSel=0,palResults=[];
function openPalette(){const p=document.getElementById("palette"),b=document.getElementById("paletteBackdrop");p.classList.add("open");b.classList.add("open");const inp=document.getElementById("paletteInput");inp.value="";renderPalette(inp.value);inp.focus()}
function closePalette(){document.getElementById("palette").classList.remove("open");document.getElementById("paletteBackdrop").classList.remove("open")}
function renderPalette(q){
  const host=document.getElementById("paletteResults");
  q=(q||"").toLowerCase();
  palResults=[];
  const flat=idna.filter(it=>!q||(it.label+" "+it.sub).toLowerCase().includes(q));
  const byG={};
  flat.forEach(it=>{(byG[it.gid]=byG[it.gid]||[]).push(it)});
  const keys=Object.keys(byG);
  keys.sort((a,b)=>{const ga=GUIDES.find(x=>x.id===a),gb=GUIDES.find(x=>x.id===b);const sa=ga.title.toLowerCase().indexOf(q),sb=gb.title.toLowerCase().indexOf(q);return (sa===-1?1:0)-(sb===-1?1:0)});
  if(!flat.length){host.innerHTML=`<div class="pal-empty">No matches for "${esc(q||"")}"</div>`;return}
  let total=0;
  host.innerHTML=keys.map(k=>{
    const g=GUIDES.find(x=>x.id===k);
    const items=byG[k].slice(0,9);
    const out=`<div class="pal-group">${g.title}</div>`+items.map(it=>{
      const j=total++;
      palResults.push({gid:it.gid,target:it.target});
      return`<button class="pal-item${j===0?" sel":""}" data-pal="${j}" type="button"><span class="pi-dot" style="background:${ROLES[g.role].bg}"></span><span class="pi-main"><span class="pi-title">${esc(it.label)}</span><span class="pi-sub">${esc(it.sub)}</span></span><span class="pi-kind">${PAL_KIND[it.kind]}</span></button>`
    }).join("");
    return out;
  }).join("");
  palSel=0;
  host.querySelectorAll("[data-pal]").forEach(b=>b.addEventListener("click",()=>goPalette(+b.dataset.pal)));
  requestAnimationFrame(()=>{const sel=host.querySelector(".pal-item.sel");if(sel)sel.scrollIntoView({block:"nearest"})});
}
function goPalette(i){
  if(!palResults[i])return;
  const r=palResults[i];closePalette();
  const g=GUIDES.find(x=>x.id===r.gid);
  if(currentGuide!==r.gid){currentGuide=r.gid;currentView="guide";history.replaceState(null,"","#"+r.gid);renderAll();closeSidebar()}
  setTimeout(()=>{const el=r.target?document.getElementById(r.target):null;if(el)el.scrollIntoView({behavior:"smooth",block:"start"});else document.querySelector(".content-inner").scrollTo({top:0})},60);
}
document.getElementById("paletteInput").addEventListener("input",e=>renderPalette(e.target.value));
document.getElementById("paletteInput").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();const items=document.querySelectorAll(".pal-item");if(items.length){palSel=(palSel+1)%items.length;updatePalSel(items)}}
  else if(e.key==="ArrowUp"){e.preventDefault();const items=document.querySelectorAll(".pal-item");if(items.length){palSel=(palSel-1+items.length)%items.length;updatePalSel(items)}}
  else if(e.key==="Enter"){e.preventDefault();goPalette(palSel)}
  else if(e.key==="Escape"){closePalette()}
});
function updatePalSel(items){document.querySelectorAll(".pal-item").forEach(x=>x.classList.remove("sel"));items[palSel].classList.add("sel");items[palSel].scrollIntoView({block:"nearest"})}
document.getElementById("paletteBackdrop").addEventListener("click",closePalette);

/* ── global keyboard + misc ── */
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette()}
});
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("sidebarBackdrop").classList.remove("open");document.body.style.overflow=""}
function openSidebar(){document.getElementById("sidebar").classList.add("open");document.getElementById("sidebarBackdrop").classList.add("open");document.body.style.overflow="hidden"}
document.getElementById("sidebarBackdrop").addEventListener("click",closeSidebar);
document.getElementById("sbSearch").addEventListener("input",function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll(".sb-item").forEach(item=>{
    const g=GUIDES.find(x=>x.id===item.dataset.guide);
    const hay=(g.title+" "+g.intro+" "+(g.docs||[]).map(d=>d.h).join(" ")+" "+(g.spec?g.spec.caption:"")).toLowerCase();
    item.style.display=(!q||hay.includes(q))?"":"none";
  });
});
document.getElementById("sbSearch").addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette()}
  else if(e.key==="/"){e.preventDefault();openPalette()}
});
window.addEventListener("hashchange",()=>{
  const id=location.hash.slice(1);
  if(GUIDES.some(g=>g.id===id)){currentGuide=id;currentView="guide";renderAll()}
});

/* mobile sidebar toggle: uses site-nav burger if available, else fallback */
function injectMobileToggle(){
  if(document.querySelector(".sidebar-mobile-btn"))return;
  var bar=document.querySelector("#siteNav .wrap");
  if(!bar)return;
  var btn=document.createElement("button");
  btn.className="sidebar-mobile-btn";
  btn.setAttribute("aria-label","Open tutorials sidebar");
  btn.style.cssText="display:none;background:none;border:none;cursor:pointer;padding:6px;font-size:1.2rem;color:var(--ink);flex-shrink:0;border-radius:6px;transition:background .15s;";
  btn.innerHTML="☰";
  btn.addEventListener("click",openSidebar);
  btn.addEventListener("mouseenter",()=>btn.style.background="rgba(27,24,54,.05)");
  btn.addEventListener("mouseleave",()=>btn.style.background="none");
  bar.insertBefore(btn,bar.firstChild);
  function showHide(){btn.style.display=window.innerWidth<=800?"block":"none"}
  showHide();window.addEventListener("resize",showHide);
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",()=>setTimeout(injectMobileToggle,200))}else{setTimeout(injectMobileToggle,200)}

renderAll();
if(location.hash){const id=location.hash.slice(1);if(GUIDES.some(g=>g.id===id)){currentGuide=id;currentView="guide";renderAll()}}
</script>
</body>
</html>
